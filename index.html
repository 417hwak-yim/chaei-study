async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return setCloud('off');
    const db=await window.claude.use('db'), user=await window.claude.use('user'); if(!db||!user) return setCloud('off');
    const id=await user.id(); if(!id) return setCloud('off');
    const ref=db.collection('data/users/'+id).doc('progress');
    const before=sig(), remote=readRemote(await ref.get());
    mergeState(remote); saveLocal(); cloudRef=ref; setCloud('on');
    if(sig()!==before) refreshView();
    if(!remote||JSON.stringify([remote.stamps,remote.best,remote.days||{}])!==JSON.stringify([STATE.stamps,STATE.best,STATE.days])) pushCloud();
    try{ ref.onSnapshot(snap=>{ const b=sig(); mergeState(readRemote(snap)); if(sig()!==b){ saveLocal(); refreshView(); } },()=>{}); }catch(e){}
  }catch(e){ setCloud(cloudRef?'error':'off'); }
}
/* 기록 코드: 도장(별 수)을 짧은 글자로 바꿔서 다른 기기로 옮겨요 */
function allSlots(v){ const a=[]; Object.keys(GRADES).forEach(g=>GRADES[g].units.forEach(u=>{(v===1?[0,1,2,3]:SLOTS).forEach(l=>a.push(u.id+'-'+l))})); while(a.length%4) a.push('-'); return a; }
function makeCode(){
  const sl=allSlots(2), bytes=[]; for(let i=0;i<sl.length;i+=4){ let b=0; for(let k=0;k<4;k++) b|=((prog[sl[i+k]]||0)&3)<<(k*2); bytes.push(b); }
  return 'E2-'+btoa(String.fromCharCode.apply(null,bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function readCode(code){
  const m=/^E([12])-([A-Za-z0-9_-]+)$/.exec(String(code).trim()); if(!m) return -1;
  let bin; try{ bin=atob(m[2].replace(/-/g,'+').replace(/_/g,'/')); }catch(e){ return -1; }

  for(let i=0;i<sl.length;i++){ const v=((bin.charCodeAt(i>>2)||0)>>((i&3)*2))&3; if(sl[i]!=='-'&&v>(prog[sl[i]]||0)){ prog[sl[i]]=v; n++; } }
  if(n) persist(); return n;
}

function routeInner(v,a,b){

/* 새로 고침을 해도 보고 있던 화면으로 돌아와요 (같은 탭에서만) */
function restoreView(){
  let o=null; try{ o=JSON.parse(sessionStorage.getItem('e3-view')||'null'); }catch(e){}
  if(!o||!o.v||o.v==='start') return start('');
  if(o.v==='subj') return routeInner('subj',o.a);
  try{
    setGrade(o.g); const u=UNITS[+o.a], rs=resumeInfo();
    if(o.v==='grade'||o.v==='home') return route('home');
    if(!u) return route('home');
    if(o.v==='quiz'||o.v==='resume'){
      if(rs&&rs.r.i<rs.r.qs.length&&(o.v==='resume'||(rs.u===u&&rs.r.l===+o.b))) return route('resume');

  }catch(e){ start(); }
}

/* ---------- 문제 만들기 ---------- */
function others(u,w,n,picOnly){return pick(u.words.filter(x=>x!==w&&(!picOnly||!x.nopic)),n)}
function buildQuiz(u,l){
  if(u.cq) return u.math?mathQuiz(u,l):u.gq?egQuiz(u,l):u.kq?korQuiz(u,l):hanjaQuiz(u,l);
  const pw=u.words.filter(w=>!w.nopic), qs=[];
  const big=t=>'<span class="en" style="font-size:2rem;font-weight:700">'+t+'</span>', oth=(w,n)=>pick(LET.filter(x=>x!==w),n);
  if(u.abc&&l===0){
    const ws=pick(LET,10);
    ws.forEach((w,k)=>{
      const ex=w.txt+' '+w.en+' : '+w.ko;
      if(k<5||(k>=8&&!canSpeak)) qs.push({t:'c',inst:'대문자와 짝이 되는 소문자를 고르세요.',stim:pic(w),say:w.say,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.en),ok:x===w})),ex});
      else if(k<8) qs.push({t:'c',inst:'소문자와 짝이 되는 대문자를 고르세요.',stim:'<div class="line en" style="font-size:4.5rem;line-height:1.1">'+w.en+'</div>',say:w.say,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.txt),ok:x===w})),ex});
      else qs.push({t:'c',inst:'버튼을 눌러 소리를 듣고 알맞은 글자를 고르세요.',listen:w.say,peek:w.ko,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.txt+x.en),ok:x===w})),ex});
    });
  }else if(u.abc&&l===2){
    pick([...Array(23).keys()],3).forEach((st,k)=>{
      const hole=1+Math.floor(Math.random()*3), w=LET[st+hole], f=k===1?(x=>x.en):(x=>x.txt);
      const row=[0,1,2,3].map(j=>j===hole?'<span class="gap">&nbsp;</span>':f(LET[st+j])).join(' ');
      qs.push({t:'c',inst:'알파벳 순서에 맞게 빈칸에 들어갈 글자를 고르세요.',stim:'<div class="spell en">'+row+'</div>',ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(f(x)),ok:x===w})),ex:[0,1,2,3].map(j=>f(LET[st+j])).join(' ')});
    });
    pick(LET,2).forEach(w=>qs.push({t:'w',exact:1,inst:'대문자를 소문자로 써 보세요.',w:{en:w.en,txt:w.txt,ko:'이 글자의 소문자는?',say:w.say},ex:w.txt+' → '+w.en}));
    pick(u.words,4).forEach(w=>{
      const ans=w.en[0], pool=shuffle('abcdeghklmnopqrstw'.split('').filter(c=>c!==ans)).slice(0,3);
      qs.push({t:'b',inst:'낱말의 첫 글자를 고르세요.',w,idx:0,tiles:shuffle([ans,...pool]),ex:w.en+' : '+w.ko});
    });
    u.order.forEach(s=>qs.push({t:'o',inst:'낱말을 순서대로 눌러 문장을 만드세요.',s,ex:s}));
  }else if(l===0&&pw.length<4){
    const koCh=w=>shuffle([w,...others(u,w,2,false)]).map(x=>({h:x.ko,ok:x===w})), ex=w=>w.en+' : '+w.ko;
    pick(u.words,4).forEach(w=>qs.push({t:'c',inst:'낱말의 뜻을 고르세요.',stim:'<div class="line en">'+w.en+'</div>',say:w.en,ch:koCh(w),ex:ex(w)}));
    pick(u.words,3).forEach(w=>qs.push({t:'c',inst:'뜻에 알맞은 낱말을 고르세요.',stim:'<div class="line">'+w.ko+'</div>',ch:shuffle([w,...others(u,w,2,false)]).map(x=>({h:'<span class="en">'+x.en+'</span>',ok:x===w})),ex:ex(w),sayAns:w.en}));
    pick(u.words,3).forEach(w=>qs.push(canSpeak?{t:'c',inst:'버튼을 눌러 소리를 듣고 알맞은 뜻을 고르세요.',listen:w.en,ch:koCh(w),ex:ex(w)}:{t:'c',inst:'낱말의 뜻을 고르세요.',stim:'<div class="line en">'+w.en+'</div>',ch:koCh(w),ex:ex(w)}));
  }else if(l===0){
    pick(pw,4).forEach(w=>qs.push({t:'c',inst:'그림에 알맞은 낱말을 고르세요.',stim:pic(w),ch:shuffle([w,...others(u,w,3,false)]).map(x=>({h:'<span class="en">'+x.en+'</span>',ok:x===w})),ex:w.en+' : '+w.ko,say:w.en}));
    pick(pw,3).forEach(w=>qs.push({t:'c',inst:canSpeak?'버튼을 눌러 소리를 듣고 알맞은 그림을 고르세요.':'낱말에 알맞은 그림을 고르세요.',listen:w.en,ch:shuffle([w,...others(u,w,2,true)]).map(x=>({h:pic(x),ok:x===w})),ex:w.en+' : '+w.ko}));
    pick(u.words,3).forEach(w=>qs.push({t:'c',inst:'낱말의 뜻을 고르세요.',stim:'<div class="line en">'+w.en+'</div>',say:w.en,ch:shuffle([w,...others(u,w,2,false)]).map(x=>({h:x.ko,ok:x===w})),ex:w.en+' : '+w.ko}));
  }else if(l===1){
    shuffle(u.mc).forEach(m=>{
      const en=/[a-zA-Z]/.test(m[2])&&!/[가-힣]/.test(m[2]);
      qs.push({t:'c',inst:m[6]||'알맞은 대답을 고르세요.',stim:pic(m[1])+(m[0]?'<div class="line en">'+m[0]+'</div>':''),say:m[0]&&m[0].indexOf('_')<0?m[0]:'',
        ch:shuffle([0,1,2]).map(k=>({h:'<span class="'+(en?'en':'')+'">'+m[2+k]+'</span>',ok:k===0})),ex:m[5],sayAns:en&&m[0].indexOf('_')<0?m[2]:''});
    });
  }else{
    pick(u.words.filter(w=>/[a-z]/.test(w.en)),4).forEach(w=>{
      const idx=shuffle([...w.en].map((c,k)=>/[a-z]/.test(c)?k:-1).filter(k=>k>=0))[0], ans=w.en[idx];
      const pool=shuffle('abcdeghiklmnoprstuwy'.split('').filter(c=>c!==ans)).slice(0,3);
      qs.push({t:'b',inst:'빠진 글자를 골라 낱말을 완성하세요.',w,idx,tiles:shuffle([ans,...pool]),ex:w.en+' : '+w.ko});
    });
    pick((x=>x.length>=3?x:u.words)(u.words.filter(w=>/^[A-Za-z ]+$/.test(w.en)&&w.en.replace(/ /g,'').length<=10)),3).forEach(w=>qs.push({t:'w',inst:'섞인 글자를 끌어다 빈칸에 놓아 낱말을 완성하세요.',w,ex:w.en+' : '+w.ko}));
    u.order.forEach(s=>qs.push({t:'o',inst:'낱말을 순서대로 눌러 문장을 만드세요.',s,ex:s}));
  }
  if(l===2&&!u.abc&&!u.cq) pick(u.words.filter(w=>/^[A-Za-z]+$/.test(w.en)&&w.en.length>=3&&w.en.length<=9),2).forEach(w=>qs.push(ENDIC(w)));
  return qs;
}

let Q=null;

  }else if(q.t==='w'){

function bindQ(q){

    if(typeof Q.l==='number'){ STATE.resume={uid:Q.u.id,l:Q.l,qs:Q.qs,i:Q.i+1,right:Q.right}; persist(); }
    const last=Q.i===Q.qs.length-1, st=q.t==='o'?(q.sep?'':q.s):(q.w?sp(q.w):(q.sayAns||q.listen||''));
    document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'" role="status"><span class="fbbud">'+BUD(ok?'cheer':'up',ok?'happy':'')+'<small>'+BUDS[ok?'cheer':'up'].n+'</small></span><div style="flex:1 1 12em">'+(ok&&Q.streak>=3?'<span class="streak">🎉 '+Q.streak+'문제 연속 정답!</span>':'')+'<b>'+(ok?pick([KID.ya+', 정답이야!','잘했어, '+KID.ya+'!',KID.ya+', 맞았어!'],1)[0]:'괜찮아 '+KID.ya+', 다시 보자.')+'</b><p>'+(extra||'')+'<span class="en">'+esc(q.ex)+'</span> '+(st?sayBtn(st):'')+'</p></div><button class="btn main" id="next">'+(last?'결과 보기':'다음 문제')+'</button></div>';
    const n=document.getElementById('next'); n.onclick=()=>{Q.i++; Q.i<Q.qs.length?drawQ():finish()}; n.focus();
  };
  if(q.t==='c'){
    const pk=document.getElementById('peek'); if(pk) pk.onclick=()=>{document.getElementById('peekw').hidden=false};
    const bs=[...$app.querySelectorAll('.choice')];
    bs.forEach(b=>b.onclick=()=>{
      const c=q.ch[+b.dataset.k]; bs.forEach((x,k)=>{x.disabled=true; if(q.ch[k].ok) x.classList.add('ok')});
      if(!c.ok) b.classList.add('no');
      done(c.ok);
    });
  }else if(q.t==='b'){
    const bs=[...$app.querySelectorAll('.tile')];
    bs.forEach(b=>b.onclick=()=>{
      const ok=b.dataset.t===q.w.en[q.idx]; bs.forEach(x=>x.disabled=true);
      document.getElementById('gap').textContent=q.w.en[q.idx]; done(ok);
    });
  }else if(q.t==='w'&&!q.exact){
    const bank=document.getElementById('dbank'), slotsEl=document.getElementById('dslots'), slots=[...slotsEl.querySelectorAll('.slot')], chk=document.getElementById('chk');
    let locked=false, drag=null;
    const sync=()=>{chk.disabled=locked||slots.some(x=>!x.firstElementChild)};
    const put=(tile,slot)=>{            /* slot 이 null 이면 글자 상자로 돌려보내요 */
      const from=tile.parentElement;
      if(!slot){ bank.appendChild(tile); }
      else{ const old=slot.firstElementChild;
        if(old&&old!==tile){ if(from.classList.contains('slot')) from.appendChild(old); else bank.appendChild(old); }
        slot.appendChild(tile); }
      sync();
    };
    const slotAt=(x,y)=>{const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('.slot'):null;};
    [...bank.children].forEach(t=>{
      t.addEventListener('pointerdown',e=>{ if(locked) return; e.preventDefault(); drag={t,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId}; try{t.setPointerCapture(e.pointerId)}catch(_){} });
      t.addEventListener('pointermove',e=>{ if(!drag||drag.t!==t) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
        if(!drag.moved&&Math.hypot(dx,dy)<7) return; drag.moved=true; t.classList.add('drag'); t.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';
        t.style.pointerEvents='none'; const over=slotAt(e.clientX,e.clientY); t.style.pointerEvents=''; slots.forEach(x=>x.classList.toggle('over',x===over)); });
      const end=e=>{ if(!drag||drag.t!==t) return; const d=drag; drag=null; try{t.releasePointerCapture(d.id)}catch(_){}
        t.classList.remove('drag'); t.style.transform=''; slots.forEach(x=>x.classList.remove('over'));
        if(e.type==='pointercancel') return;
        if(d.moved){ t.style.pointerEvents='none'; const over=slotAt(e.clientX,e.clientY); t.style.pointerEvents=''; put(t,over); }
        else if(t.parentElement.classList.contains('slot')) put(t,null);
        else{ const empty=slots.find(x=>!x.firstElementChild); if(empty) put(t,empty); } };
      t.addEventListener('pointerup',end); t.addEventListener('pointercancel',end);
      t.addEventListener('keydown',e=>{ if(locked||(e.key!=='Enter'&&e.key!==' ')) return; e.preventDefault();
        if(t.parentElement.classList.contains('slot')) put(t,null); else{ const empty=slots.find(x=>!x.firstElementChild); if(empty) put(t,empty); } t.focus(); });
    });
    chk.onclick=()=>{ locked=true; sync();
      const ok=slots.every((x,k)=>x.firstElementChild&&x.firstElementChild.dataset.c===q.L[k]);
      slots.forEach((x,k)=>x.classList.add(x.firstElementChild.dataset.c===q.L[k]?'ok':'no')); [...slotsEl.querySelectorAll('.tile')].forEach(t=>t.disabled=true);
      done(ok, ok?'':'바른 답: '); };
  }else if(q.t==='w'){
    const inp=document.getElementById('inp'), go=()=>{
      const raw=inp.value.trim(), v=raw.toLowerCase().replace(/\s+/g,' '); if(!v) {inp.focus();return;}
      inp.disabled=true; document.getElementById('chk').disabled=true;
      const NS=t=>{ t=t.replace(/[\s.?!,’'-]/g,''); return q.ci?t.toLowerCase():t; }, ok=q.loose?NS(raw)===NS(q.w.en):q.exact?raw===q.w.en:v===q.w.en.toLowerCase(); done(ok, ok?'':'바른 답: ');
    };
    document.getElementById('chk').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go()}; inp.focus();
  }else{
    const slots=document.getElementById('slots'), bank=document.getElementById('bank'), chk=document.getElementById('chk');
    const redraw=()=>{
      slots.innerHTML=q.put.map((k,p)=>'<button class="tile en" data-p="'+p+'">'+q.toks[k]+'</button>').join('');
      [...bank.children].forEach(b=>b.classList.toggle('used',q.put.includes(+b.dataset.k)));
      chk.disabled=q.put.length!==q.toks.length;
    };
    let locked=false;
    bank.onclick=e=>{const b=e.target.closest('.tile'); if(!b||locked) return; q.put.push(+b.dataset.k); redraw()};
    slots.onclick=e=>{const b=e.target.closest('.tile'); if(!b||locked) return; q.put.splice(+b.dataset.p,1); redraw()};
    chk.onclick=()=>{locked=true; chk.disabled=true; const ok=q.put.map(k=>q.toks[k]).join(q.sep||' ')===q.s; done(ok, ok?'':(q.sep?'바른 순서: ':'바른 문장: '))};
  }
}
function finish(){
  if(Q.l==='g') return gramEnd();
  if(Q.u.wrap) return wrapEnd();
  if(Q.l==='s') return hanjaEnd();
  const {u,l,qs,right}=Q, r=right/qs.length, stars=r>=.9?3:r>=.6?2:1, bk=u.id+'-'+l, old=STATE.best[bk];
  if(!old||right>old.r) STATE.best[bk]={r:right,n:qs.length};
  STATE.resume=null;
  resultScreen(u,l,stars,right+' / '+qs.length+' 문제를 맞혔어요.','quiz:'+UNITS.indexOf(u)+':'+l);
}
function resultScreen(u,l,stars,msg,again){

  saveStamp(u,l,stars);
  const ui=UNITS.indexOf(u), next=l<3?'lesson:'+ui+':'+(l+1):(GRAM[u.id]?'gram:'+ui:'say:'+ui);

  show('<section class="panel result"><div class="big" style="margin:8px 0 40px">'+sticker(u,l,'big')+'</div><div class="budcheer">'+BUD('cheer','happy')+'</div><h2>'+['',KID.ya+', 끝까지 해냈구나!',KID.ya+', 참 잘했어!',KID.full+' 어린이 최고!'][stars]+'</h2><p>'+msg+'<br>'+(isNew?'<b>'+a.name+'</b> 도장이 찍혔어요!':'<b>'+a.name+'</b> 도장은 이미 모았어요. 별은 가장 많이 받은 만큼 남아요.')+'</p><div class="row center"><button class="btn" data-go="'+again+'">다시 하기</button><button class="btn main" data-go="'+next+'">'+nextLabel+'</button><button class="btn" data-go="unit:'+ui+'">차시 목록</button></div><div class="row center" style="margin-top:14px">'+gameBtn()+'</div></section>',u.color);

function gameHead(u,title,sub){
  return '<button class="back" data-go="lesson:'+UNITS.indexOf(u)+':3">← 놀이 고르기</button><section class="panel"><h2>'+title+'</h2><p class="lead">'+sub+'</p>';

function startGame(u,kind){ sfx('start'); const f=({mem:gameMem,mix:gameMix,ox:gameOx})[kind]; f?f(u):sprint(u,kind); }

function gameMem(u){
  const ws=pick(POOL(u),6), ui=UNITS.indexOf(u);
  const cards=shuffle(ws.flatMap(w=>[{w,h:face(w)},{w,h:'<span class="en"'+(u.abc?' style="font-size:2rem"':'')+'>'+w.en+'</span>'}]));
  let open=[], found=0, tries=0, lock=true;
  show(gameHead(u,'짝 맞추기','시작을 누르면 카드를 3초 동안 보여 줘요. 자리를 잘 기억했다가 '+(u.abc?'대문자와 소문자를':'그림이나 뜻을 낱말과')+' 짝지어요.')+'<div class="row center"><button class="btn main" id="memgo">시작</button></div><div class="meter" id="mt">시작을 누르면 카드가 보여요</div><div class="mem">'+cards.map((c,k)=>'<button class="mcard" data-k="'+k+'" aria-label="카드"><span class="f">'+c.h+'</span></button>').join('')+'</div></section>',u.color);
  const mt=document.getElementById('mt'), goBtn=document.getElementById('memgo'), all=[...$app.querySelectorAll('.mcard')];
  goBtn.onclick=()=>{
    goBtn.disabled=true; all.forEach(c=>c.classList.add('up'));
    let left=3; mt.textContent='잘 기억해요! '+left;
    const tm=setInterval(()=>{
      if(!document.body.contains(mt)){clearInterval(tm);return;}
      left--;
      if(left>0) mt.textContent='잘 기억해요! '+left;
      else{clearInterval(tm); all.forEach(c=>c.classList.remove('up')); goBtn.parentNode.hidden=true; mt.textContent='뒤집은 횟수 0번'; lock=false;}
    },1000);
  };
  $app.querySelector('.mem').onclick=e=>{
    const b=e.target.closest('.mcard'); if(!b||lock||b.classList.contains('up')) return;
    b.classList.add('up'); open.push(b);
    if(open.length<2) return;
    tries++; mt.textContent='뒤집은 횟수 '+tries+'번';
    const [a,c]=open, wa=cards[+a.dataset.k].w, wc=cards[+c.dataset.k].w; open=[];
    if(wa===wc){ a.classList.add('done'); c.classList.add('done'); found++;
      if(found===ws.length) setTimeout(()=>resultScreen(u,3,tries<=9?3:tries<=14?2:1,tries+'번 만에 짝을 모두 찾았어요.','game:'+ui+':mem'),700);
    }else{ lock=true; setTimeout(()=>{a.classList.remove('up'); c.classList.remove('up'); lock=false},900); }
  };
}

function gameMix(u){
  const ws=pick(u.words.filter(w=>w.en.length>2&&/^[A-Za-z ]+$/.test(w.en)&&w.en.replace(/ /g,'').length<=11),5), ui=UNITS.indexOf(u); let i=0, miss=0;
  const draw=()=>{
    const w=ws[i], letters=[...w.en.replace(/ /g,'')]; let sh=shuffle(letters); if(sh.join('')===letters.join('')) sh=sh.reverse();
    let put=[];
    show(gameHead(u,'글자 섞기','글자를 순서대로 눌러 낱말을 만들어요. 다 놓으면 낱말을 읽어 줘요.')+'<div class="meter">'+(i+1)+' / '+ws.length+'</div><div class="stim">'+(w.nopic?'':pic(w))+'<div>'+w.ko+'</div></div><div class="slots en" id="slots"></div><div class="bank" id="bank">'+sh.map((t,k)=>'<button class="tile en" data-k="'+k+'">'+t+'</button>').join('')+'</div><div class="meter" id="msg">놓은 글자를 누르면 다시 내려가요.</div></section>',u.color);
    const slots=document.getElementById('slots'), bank=document.getElementById('bank'), msg=document.getElementById('msg');
    const redraw=()=>{
      slots.innerHTML=put.map((k,p)=>'<button class="tile en" data-p="'+p+'">'+sh[k]+'</button>').join('');
      [...bank.children].forEach(b=>b.classList.toggle('used',put.includes(+b.dataset.k)));
      if(put.length===sh.length){
        const again=canSpeak?' <button class="say" data-say="'+w.en+'">🔊 다시 듣기</button>':'';
        say(w.en);
        if(put.map(k=>sh[k]).join('')===letters.join('')){ bank.onclick=slots.onclick=null;
          msg.innerHTML='<b style="color:var(--ok)">'+KID.ya+', 맞았어!</b> <span class="en">'+w.en+'</span>'+again+'<div style="margin-top:12px"><button class="btn main" id="mixnext">'+(i<ws.length-1?'다음 낱말':'결과 보기')+'</button></div>';
          document.getElementById('mixnext').onclick=()=>{i++; i<ws.length?draw():resultScreen(u,3,miss===0?3:miss<=2?2:1,'낱말 '+ws.length+'개를 모두 완성했어요.','game:'+ui+':mix')};
        }else{ miss++; msg.innerHTML='<b style="color:var(--no)">순서가 달라요.</b> 소리를 잘 듣고 글자를 눌러 다시 놓아 보세요.'+again; }
      }
    };
    bank.onclick=e=>{const b=e.target.closest('.tile'); if(b){put.push(+b.dataset.k); redraw()}};
    slots.onclick=e=>{const b=e.target.closest('.tile'); if(b){put.splice(+b.dataset.p,1); redraw()}};
  };
  draw();
}

function gameOx(u){
  const pw=POOL(u), ui=UNITS.indexOf(u), N=10; let i=0, right=0, t0=Date.now();
  const draw=()=>{
    const w=pick(pw,1)[0], match=Math.random()<.5, shown=match?w:pick(pw.filter(x=>x!==w),1)[0];
    show(gameHead(u,'빨리 OX',(u.abc?'대문자와 소문자가 짝이면 O, 아니면 X를 눌러요.':'그림이나 뜻이 낱말과 같으면 O, 다르면 X를 눌러요.'))+'<div class="meter">'+(i+1)+' / '+N+' , 맞힌 개수 '+right+'</div><div class="stim">'+face(w)+'<div class="line en">'+shown.en+'</div></div><div class="ox"><button class="o" data-a="1" aria-label="맞아요">O</button><button class="x" data-a="0" aria-label="달라요">X</button></div><p class="meter" id="msg">&nbsp;</p></section>',u.color);
    $app.querySelector('.ox').onclick=e=>{
      const b=e.target.closest('button'); if(!b) return; $app.querySelector('.ox').onclick=null;
      const ok=(b.dataset.a==='1')===match; if(ok) right++;
      document.getElementById('msg').textContent=(ok?'맞았어요! ':'아쉬워요. ')+(u.abc?w.txt+' 의 짝은 '+w.en:'그림은 '+w.en+' ('+w.ko+')');
      setTimeout(()=>{i++; if(i<N) draw(); else{const sec=Math.round((Date.now()-t0)/1000); resultScreen(u,3,right>=9?3:right>=6?2:1,N+'문제 중 '+right+'개를 '+sec+'초 만에 맞혔어요.','game:'+ui+':ox')}},ok?650:1500);
    };
  };
  draw();
}

  /* 소리 */
  function initAudio(){ try{ if(!audio){ audio=new (window.AudioContext||window.webkitAudioContext)(); master=audio.createGain(); master.gain.value=.5; master.connect(audio.destination); musicBus=audio.createGain(); musicBus.gain.value=.5; musicBus.connect(master); fxBus=audio.createGain(); fxBus.connect(master); } if(audio.state==='suspended') audio.resume().catch(()=>{}); return true; }catch(e){ return false; } }
  function tone(f,d,t,type,v,to,bus){ if(!audio) return; bus=bus||fxBus; const o=audio.createOscillator(), g=audio.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,to||f),t+d); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(v||.15,t+.006); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+.015); o.onended=()=>{o.disconnect(); g.disconnect();}; }
  function fx(kind){ if(!soundOn||!initAudio()) return; const t=audio.currentTime+.005, seq=(ns,st)=>ns.forEach((n,i)=>tone(n,(st||.085)*1.8,t+i*(st||.085),'triangle',.2));
    if(kind==='countdown') tone(remaining<=3?1200:880,.1,t,'square',.065); else if(kind==='finish') seq([784,659,523,659,784,1047],.11); else if(kind==='shoot') tone(240,.1,t,'square',.08,1000);
    else if(kind==='pop'){ tone(850,.15,t,'sine',.28,170); tone(1200,.15,t+.035,'triangle',.12,480); } else if(kind==='drop') seq([523,659,784,1047,1319],.055); else if(kind==='clear') seq([523,659,784,1047,784,1047,1568],.105);
    else if(kind==='over') seq([523,494,392,294,196],.14); else if(kind==='bounce') tone(800,.055,t,'sine',.09,450); else if(kind==='swap') seq([390,580],.04); else tone(180,.09,t,'sine',.17,80); }
  const melody=[76,0,79,81,79,76,72,74,76,79,84,83,81,79,76,74,77,0,81,84,81,77,74,76,77,81,86,84,83,81,79,77,79,0,83,86,84,83,79,76,79,83,88,86,84,83,81,79,76,79,84,79,81,77,74,77,79,76,72,74,76,79,72,0], freq=n=>440*Math.pow(2,(n-69)/12);
  function musicTick(){ if(!audio) return; const on=soundOn&&state==='playing'&&!document.hidden; musicBus.gain.setTargetAtTime(on?.5:0,audio.currentTime,.025); if(!on){ musicAt=audio.currentTime; return; }
    const step=60/156/2; if(musicAt<audio.currentTime) musicAt=audio.currentTime+.025;
    while(musicAt<audio.currentTime+.12){ const i=musicStep%64, n=melody[i], root=[48,53,55,48][Math.floor(i/16)]; if(n) tone(freq(n),step*.7,musicAt,'square',.05,freq(n),musicBus); if(i%2===0){ const bass=root+(i%4===2?7:0); tone(freq(bass),step*.85,musicAt,'triangle',.18,freq(bass),musicBus); } musicAt+=step; musicStep++; } }
  const musicTimer=setInterval(musicTick,40);
  /* 화면 */
  function hud(){ $('bp-score').textContent=score.toLocaleString(); $('bp-level').textContent=1+Math.floor(score/1200); }
  function timerHud(){ const s=Math.max(0,Math.ceil(remaining)); $('bp-timer').textContent=s+'초'; $('bp-timer').style.color=s<=10?'var(--no)':''; }
  function overlay(title,msg,btns){ $('bp-h').textContent=title; $('bp-m').innerHTML=msg; $('bp-b').innerHTML=btns; $('bp-over').hidden=false; }
  function begin(){ initAudio(); state='playing'; timerAt=performance.now(); $('bp-over').hidden=true; $('bp-pause').textContent='잠깐 쉬기'; cv.focus({preventScroll:true}); }
  function pause(){ if(state==='playing'){ state='paused'; saveState(false); overlay('잠깐 쉬는 중','쉬는 동안에는 시간도 멈춰요.','<button class="btn main" id="bp-go">계속하기</button>'); $('bp-go').onclick=begin; $('bp-pause').textContent='계속하기'; } else if(state==='paused') begin(); }
  function timeUp(){ state='over'; shot=null; remaining=0; timerHud(); saveState(true); fx('finish'); const left=B.tix||0;
    overlay('60초 끝!','지금까지 <b>'+score.toLocaleString()+'점</b>, 레벨 '+(1+Math.floor(score/1200))+'!<br>'+KID.ya+', 다음 공부를 끝내면 <b>지금 멈춘 곳부터</b> 이어서 할 수 있어.','<button class="btn main" id="bp-done">공부하러 가기</button>'+(left?'<button class="btn sun" id="bp-more">이용권 '+left+'장 남음, 이어서 하기</button>':''));
    $('bp-done').onclick=quit; if(left) $('bp-more').onclick=()=>{ quit(); bubbleGame(); }; }
  function danger(){ texts.push({x:W/2,y:300,text:'앗! 새 판으로 다시!',life:1.8}); fx('over'); wave(); stage=0; elapsed=0; combo=0; shot=null; current=pickC(); next=pickC(); }
  function adjacent(a,b){ const p=pos(a.r,a.c), q=pos(b.r,b.c); return Math.hypot(p.x-q.x,p.y-q.y)<54; }
  function flood(seeds,test){ const seen=new Set(seeds), stack=[...seeds]; while(stack.length){ const a=stack.pop(); for(const b of board) if(!seen.has(b)&&test(b)&&adjacent(a,b)){ seen.add(b); stack.push(b); } } return seen; }
  function burst(b,drop){ const p=pos(b.r,b.c); if(!drop&&!reduceMotion) rings.push({x:p.x,y:p.y,color:b.color,life:.4}); if(drop) particles.push({x:p.x,y:p.y,color:b.color,vx:(Math.random()-.5)*100,vy:60,life:1.1,drop:true}); else for(let i=0;i<9;i++){ const a=Math.random()*Math.PI*2, v=60+Math.random()*130; particles.push({x:p.x,y:p.y,color:b.color,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.3}); } }
  function addPoints(n){ score+=n; stage+=n; }
  function settle(){ const s=shot; shot=null; const occupied=new Set(board.map(key)); let cand=[];
    for(const b of board) for(let r=b.r-1;r<=b.r+1;r++) for(let c=b.c-1;c<=b.c+1;c++){ const t={r,c}; if(r<minRow||c<0||c>=(odd(r)?8:9)||occupied.has(key(t))||!adjacent(b,t)) continue; const p=pos(r,c); cand.push({r,c,d:Math.hypot(p.x-s.x,p.y-s.y)}); }
    for(let c=0;c<(odd(minRow)?8:9);c++){ const t={r:minRow,c}, p=pos(t.r,c); if(!occupied.has(key(t))) cand.push({r:t.r,c,d:Math.hypot(p.x-s.x,p.y-s.y)}); }
    cand.sort((a,b)=>a.d-b.d); if(!cand.length){ danger(); return; }
    const b={r:cand[0].r,c:cand[0].c,color:s.color}; board.push(b); const group=flood([b],n=>n.color===b.color);
    if(group.size>=3){ combo++; for(const n of group) burst(n); board=board.filter(n=>!group.has(n));
      const anchored=flood(board.filter(n=>n.r===minRow),()=>true), fall=board.filter(n=>!anchored.has(n)); for(const n of fall) burst(n,true); board=board.filter(n=>anchored.has(n));
      const gain=group.size*20+fall.length*40+Math.max(0,combo-1)*30; addPoints(gain); const p=pos(b.r,b.c);
      texts.push({x:Math.max(90,Math.min(W-90,p.x)),y:p.y,text:(fall.length?'와르르! ':combo>1?combo+'연속! ':'팡! ')+'+'+gain,life:1.2}); fx('pop'); if(fall.length) fx('drop');
      if(!board.length){ addPoints(300); fx('clear'); wave(); texts.push({x:W/2,y:280,text:'모두 팡! +300',life:1.7}); } hud();
    }else{ combo=0; fx('land'); }
    if(board.some(n=>pos(n.r,n.c).y+R>=LIMIT)){ danger(); return; }
    current=next; if(!getColors().includes(current)) current=pickC(); next=pickC(); }
  function fire(){ if(state!=='playing'||shot) return; kick=1; trail=[]; shot={x:OX,y:OY,vx:Math.cos(angle)*850,vy:Math.sin(angle)*850,color:current}; fx('shoot'); }
  function swap(){ if(state==='playing'&&!shot){ const t=current; current=next; next=t; fx('swap'); } }
  function jelly(x,y,color,r,t){ r=r||R; const c=colors[color]||colors[0]; ctx.save(); ctx.translate(x,y); ctx.scale(1+Math.sin(t||0)*.025,1-Math.sin(t||0)*.025);
    const g=ctx.createRadialGradient(-r*.3,-r*.45,r*.04,0,0,r*1.15); g.addColorStop(0,c[2]); g.addColorStop(.4,c[0]); g.addColorStop(1,c[1]); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,1,r*.95,r*.92,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ffffff80'; ctx.beginPath(); ctx.ellipse(-r*.34,-r*.5,r*.25,r*.12,-.5,0,7); ctx.fill();
    for(const k of [-.27,.27]){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(r*k,-r*.03,r*.17,r*.25,0,0,7); ctx.fill(); ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(r*k+r*.03,r*.015,r*.083,r*.14,0,0,7); ctx.fill(); }
    ctx.strokeStyle=INK; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0,r*.25,r*.12,0,Math.PI); ctx.stroke(); ctx.restore(); }
  function aim(e){ const a=cv.getBoundingClientRect(), x=(e.clientX-a.left)/a.width*W, y=(e.clientY-a.top)/a.height*H; angle=Math.max(-Math.PI+.15,Math.min(-.15,Math.atan2(Math.min(-15,y-OY),x-OX))); }
  cv.addEventListener('pointerdown',e=>{ if(state!=='playing') return; aiming=true; try{cv.setPointerCapture(e.pointerId)}catch(_){} aim(e); });
  cv.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'||aiming) aim(e); });
  cv.addEventListener('pointerup',e=>{ if(!aiming) return; aiming=false; aim(e); fire(); });
  cv.addEventListener('pointercancel',()=>{aiming=false});
  cv.addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight',' ','x','X'].includes(e.key)) e.preventDefault(); if(e.key==='ArrowLeft') angle=Math.max(-Math.PI+.15,angle-.055); if(e.key==='ArrowRight') angle=Math.min(-.15,angle+.055); if(e.key===' ') fire(); if(e.key.toLowerCase()==='x') swap(); });
  $('bp-swap').onclick=swap; $('bp-pause').onclick=pause;
  $('bp-sound').onclick=()=>{ soundOn=!soundOn; $('bp-sound').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐'; $('bp-sound').setAttribute('aria-pressed',String(soundOn)); musicTick(); };
  const onHide=()=>{ if(document.hidden&&state==='playing') pause(); }; document.addEventListener('visibilitychange',onHide);
  quit=()=>{ if(state==='playing'||state==='paused'||state==='ready'){ saveState(true); } state='closed'; closeModal(); };
  $('bp-x').onclick=quit; modal.addEventListener('pointerdown',e=>{ if(e.target===modal&&state!=='playing') quit(); });
  function update(dt){
    const now=performance.now(); remaining=Math.max(0,remaining-(now-timerAt)/1000); timerAt=now; const sec=Math.ceil(remaining);
    if(sec!==lastSec){ timerHud(); if(sec<=10&&sec>0) fx('countdown'); lastSec=sec; } if(remaining<=0){ timeUp(); return; }
    if(now-saveAt>2000){ saveAt=now; saveState(false); }
    kick=Math.max(0,kick-dt*7); rings.forEach(r=>r.life-=dt); rings=rings.filter(r=>r.life>0); trail.forEach(p=>p.life-=dt); trail=trail.filter(p=>p.life>0); if(shot&&!reduceMotion) trail.push({x:shot.x,y:shot.y,color:shot.color,life:.16});
    elapsed+=dt; scroll+=dt*Math.min(4.5,1.7+Math.min(elapsed,150)/65+Math.floor(stage/1200)*.3);
    const target=-Math.floor(scroll/DY); while(minRow>target){ minRow--; row(minRow); }
    if(shot){ for(let n=0;n<4&&shot;n++){ shot.x+=shot.vx*dt/4; shot.y+=shot.vy*dt/4; if(shot.x<R){ shot.x=R+(R-shot.x); shot.vx=Math.abs(shot.vx); fx('bounce'); } if(shot.x>W-R){ shot.x=W-R-(shot.x-(W-R)); shot.vx=-Math.abs(shot.vx); fx('bounce'); }
        if(shot.y<=pos(minRow,0).y||board.some(b=>{const p=pos(b.r,b.c); return Math.hypot(p.x-shot.x,p.y-shot.y)<=R*1.94;})) settle(); } }
    if(state==='playing'&&board.some(b=>pos(b.r,b.c).y+R>=LIMIT)) danger();
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; p.life-=dt; } particles=particles.filter(p=>p.life>0);
    for(const t of texts){ t.y-=30*dt; t.life-=dt; } texts=texts.filter(t=>t.life>0);
  }
  function draw(time){
    ctx.fillStyle=TH.paper; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=TH.dot; for(let gy=11;gy<LIMIT;gy+=22) for(let gx=11;gx<W;gx+=22){ ctx.beginPath(); ctx.arc(gx,gy,1.4,0,7); ctx.fill(); }
    ctx.fillStyle=TH.card; ctx.fillRect(0,LIMIT,W,H-LIMIT); ctx.strokeStyle=TH.no; ctx.setLineDash([8,7]); ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,LIMIT); ctx.lineTo(W,LIMIT); ctx.stroke(); ctx.setLineDash([]);
    ctx.font="15px Jua, 'Malgun Gothic', sans-serif"; ctx.fillStyle=TH.no; ctx.textAlign='right'; ctx.fillText('위험선',W-12,LIMIT-10);
    for(const b of board){ const p=pos(b.r,b.c); if(p.y>-R) jelly(p.x,p.y,b.color,R,reduceMotion?0:time/450+b.c); }
    if(!shot&&state==='playing'){ let x=OX,y=OY,vx=Math.cos(angle),vy=Math.sin(angle); ctx.fillStyle=colors[current][1]; for(let i=0;i<58;i++){ x+=vx*10; y+=vy*10; if(x<R||x>W-R){ vx=-vx; x=Math.max(R,Math.min(W-R,x)); } if(y<25||board.some(b=>{const p=pos(b.r,b.c); return Math.hypot(p.x-x,p.y-y)<R*2;})) break; if(i%2===0){ ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill(); } } }
    ctx.save(); ctx.translate(OX,OY+kick*7); ctx.rotate(angle+Math.PI/2); ctx.fillStyle='#FFC83A'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(-17,-45,34,60,12); else ctx.rect(-17,-45,34,60); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(OX,OY+17,41,15,0,0,7); ctx.fill();
    for(const p of trail){ ctx.globalAlpha=Math.min(1,p.life*3); ctx.fillStyle=colors[p.color][0]; ctx.beginPath(); ctx.arc(p.x,p.y,R*p.life*3,0,7); ctx.fill(); } ctx.globalAlpha=1;
    if(!shot) jelly(OX,OY,current,27); else jelly(shot.x,shot.y,shot.color); jelly(80,OY+5,next,20);
    ctx.textAlign='center'; ctx.font="14px Jua, 'Malgun Gothic', sans-serif"; ctx.fillStyle=TH.soft; ctx.fillText('다음 방울',80,OY+40); ctx.fillText('조준하고 손 떼기',OX,OY+51);
    for(const r of rings){ ctx.globalAlpha=Math.min(1,r.life*2); ctx.strokeStyle=colors[r.color][0]; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,25+(1-r.life/.4)*38,0,7); ctx.stroke(); } ctx.globalAlpha=1;
    for(const p of particles){ ctx.globalAlpha=Math.min(1,p.life*2); if(p.drop) jelly(p.x,p.y,p.color); else{ ctx.fillStyle=colors[p.color][0]; ctx.beginPath(); ctx.arc(p.x,p.y,4+p.life*5,0,7); ctx.fill(); } } ctx.globalAlpha=1;
    for(const t of texts){ ctx.globalAlpha=Math.min(1,t.life*2); ctx.font="27px Jua, 'Malgun Gothic', sans-serif"; ctx.lineWidth=6; ctx.lineJoin='round'; ctx.strokeStyle='#FFFFFF'; ctx.strokeText(t.text,t.x,t.y); ctx.fillStyle='#E0457B'; ctx.fillText(t.text,t.x,t.y); } ctx.globalAlpha=1;
  }
  function frame(t){
    if(!cv.isConnected){ clearInterval(musicTimer); document.removeEventListener('visibilitychange',onHide); try{ if(audio) audio.close(); }catch(e){} return; }
    const dt=Math.min((t-last)/1000,.033); last=t; if(state==='playing') update(dt); draw(t); requestAnimationFrame(frame);
  }
  if(!resume){ wave(); current=pickC(); next=pickC(); }
  hud(); timerHud();
  overlay(resume?'이어서 팡팡!':'말랑팝 방울 슈터',(resume?'지난번에 멈춘 곳부터 이어서 해요.':'같은 색 방울 <b>3개</b>를 이으면 팡!<br>꾹 눌러 조준하고 손을 떼면 발사해요.')+'<br>남은 시간 <b>'+Math.ceil(remaining)+'초</b>','<button class="btn main" id="bp-go">'+(resume?'이어서 시작':'게임 시작')+'</button>');
  $('bp-go').onclick=begin;
  requestAnimationFrame(frame);
}

restoreView();
initCloud();
</script>
