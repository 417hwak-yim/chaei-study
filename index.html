<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채이의 공부방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F8FF; --dot:#D5E2F5; --card:#FFFFFF; --ink:#1B2750; --soft:#5A668C; --line:#C9D6EE;
  --ok:#1E9E62; --okbg:#E2F6EC; --no:#D9415F; --nobg:#FDE7EC; --sun:#FFC83A; --u:#3D7BF2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A33; --dot:#222C52; --card:#1C2547; --ink:#EEF2FF; --soft:#A9B4D9; --line:#34406E;
    --okbg:#143B2A; --nobg:#45182A; --ok:#4FD093; --no:#FF7C95;
  }
}
:root[data-theme="dark"]{
  --paper:#131A33; --dot:#222C52; --card:#1C2547; --ink:#EEF2FF; --soft:#A9B4D9; --line:#34406E;
  --okbg:#143B2A; --nobg:#45182A; --ok:#4FD093; --no:#FF7C95;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background:var(--paper);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px); background-size:22px 22px;
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:18px; line-height:1.6;
}
h1,h2,h3,.jua{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:400; line-height:1.25; margin:0}
.en{font-family:'Andika','Comic Sans MS','Trebuchet MS',sans-serif}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun); outline-offset:3px}
#app{max-width:920px; margin:0 auto; padding:20px 16px 64px}

/* 버튼 */
.btn{border:2px solid var(--ink); background:var(--card); border-radius:999px; padding:10px 22px; font-family:'Jua',sans-serif; font-size:1.05rem; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--u); color:#fff}
.btn.sun{background:var(--sun); color:#1B2750}
.btn[disabled]{opacity:.45; cursor:default}
.back{border:none; background:none; padding:6px 2px; color:var(--soft); font-size:1rem}
.back:hover{color:var(--ink)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.center{justify-content:center; text-align:center}

/* 첫 화면 */
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(2rem,6.5vw,3.4rem); letter-spacing:-.01em}
.hero p{max-width:34em; color:var(--soft); margin:10px 0 0}
.board{margin:22px 0 10px; background:var(--card); border:2px solid var(--ink); border-radius:22px; padding:16px 18px; box-shadow:0 6px 0 var(--ink)}
.board h2{font-size:1.2rem; margin-bottom:10px}
.boardgrid{display:grid; grid-template-columns:repeat(var(--n,8),1fr); gap:10px 6px}
.board h3{font-size:1rem; color:var(--soft); margin:12px 0 6px}
.semh{font-size:1.5rem; margin:30px 0 0}
.semh + .units{margin-top:12px}
.col{display:grid; gap:13px; justify-items:center}
.col small{font-size:.75rem; color:var(--soft); text-align:center; line-height:1.2}
.stk{position:relative; display:inline-grid; place-items:center; width:44px; height:44px; border-radius:50%; background:var(--bg); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--line),0 3px 0 rgba(27,39,80,.22); transform:rotate(var(--rot)); font-size:25px; line-height:1; flex:none}
.stk>span,.lesson .stk>span{font-size:inherit; color:initial}
.lesson .stk{font-size:25px}
.stk i{position:absolute; left:50%; bottom:-10px; transform:translateX(-50%) rotate(calc(var(--rot) * -1)); font-style:normal; font-size:10px; letter-spacing:-1px; color:#E8A400; white-space:nowrap; text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff}
.stk.off{background:none; border:2px dashed var(--line); box-shadow:none; transform:none}
.stk.dim{filter:grayscale(1); opacity:.6; box-shadow:0 0 0 1.5px var(--line)}
.stk.mini{width:28px; height:28px; font-size:16px; border-width:2px}
.stk.big{width:150px; height:150px; font-size:88px; border-width:8px; box-shadow:0 0 0 2px var(--line),0 8px 0 rgba(27,39,80,.22); animation:stampin .65s cubic-bezier(.2,1.5,.4,1) both}
.stk.big i{font-size:28px; bottom:-34px; letter-spacing:0}
@keyframes stampin{0%{transform:scale(2.8) rotate(24deg); opacity:0} 55%{opacity:1} 100%{transform:scale(1) rotate(var(--rot)); opacity:1}}
.stkline{display:flex; align-items:center; gap:12px; margin:8px 0 14px; padding:8px 12px; border-radius:14px; background:var(--paper)}
.stamp{width:34px; height:34px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-size:.8rem; color:transparent}
.stamp.on{border:2px solid var(--u); background:var(--u); color:#fff; transform:rotate(-12deg); font-family:'Jua',sans-serif}
.units{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; margin-top:22px}
.unit{position:relative; text-align:left; background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:16px 16px 14px 26px; box-shadow:0 5px 0 var(--ink); overflow:hidden; transition:transform .1s}
.unit::before{content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--u)}
.unit:hover{transform:translateY(-2px)}
.unit .pic{font-size:2rem; line-height:1}
.num{display:inline-block; font-family:'Jua',sans-serif; font-size:1.1rem; background:var(--u); color:#fff; border-radius:999px; padding:3px 14px; line-height:1.4}
.unit h3{font-size:1.25rem; margin:6px 0 0}
.unit .ko{color:var(--soft); font-size:.95rem}
.unit .dots{display:flex; gap:7px; margin-top:12px; align-items:center}
.unit .dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--u)}
.unit .dots i.on{background:var(--u)}
details{margin-top:28px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px 16px}
summary{font-family:'Jua',sans-serif; cursor:pointer}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.92rem; margin-top:10px; min-width:520px}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top}
th{font-family:'Jua',sans-serif; font-weight:400}

/* 단원 화면 */
.uhead{border-left:12px solid var(--u); padding-left:16px; margin:8px 0 20px}
.uhead h1{font-size:clamp(1.7rem,5.5vw,2.6rem)}
.uhead p{margin:4px 0 0; color:var(--soft)}
.lessons{display:grid; gap:14px}
.lesson{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; text-align:left; background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:14px 16px; box-shadow:0 5px 0 var(--ink)}
.lesson .n{font-family:'Jua',sans-serif; background:var(--u); color:#fff; border-radius:12px; padding:6px 12px; white-space:nowrap}
.lesson b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem; display:block}
.lesson span{color:var(--soft); font-size:.95rem}

/* 수업 화면 */
.panel{background:var(--card); border:2px solid var(--ink); border-radius:22px; padding:22px 20px; box-shadow:0 6px 0 var(--ink)}
.panel h2{font-size:1.5rem; margin-bottom:6px}
.lead{color:var(--soft); margin:0 0 14px}
.words{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; margin:14px 0}
.word{background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center}
.word .en{display:block; font-size:1.25rem; font-weight:700}
.word small{color:var(--soft)}
.pic{display:inline-grid; place-items:center; line-height:1}
.pic svg{width:1em; height:1em}
.ph{width:1.5em; height:1.5em; object-fit:cover; border-radius:14px; border:2px solid var(--line); background:#fff}
.word .ph{width:92px; height:92px}
.stim .ph{width:160px; height:160px}
.choice .ph{width:104px; height:104px}
.mcard .ph{width:100%; height:100%; border:none; border-radius:0}
.mcard .pic:has(.ph:not([style])){width:100%; height:100%}
.sw{width:1em; height:1em; border-radius:50%; border:3px solid var(--ink); display:inline-block}
.talk{display:grid; gap:8px; margin:14px 0}
.bub{max-width:85%; border:2px solid var(--line); border-radius:18px; padding:10px 14px; background:var(--paper); text-align:left}
.bub.b{justify-self:end; border-color:var(--u)}
.bub .en{font-size:1.2rem; font-weight:700; display:block}
.bub small{color:var(--soft)}
.tip{border:2px dashed var(--u); border-radius:14px; padding:10px 14px; margin:14px 0}
.tip b{font-family:'Jua',sans-serif; font-weight:400}
.say{border:2px solid var(--ink); background:var(--sun); color:#1B2750; border-radius:999px; padding:4px 14px; font-size:.95rem; font-family:'Jua',sans-serif}

.bar{height:14px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--card); margin:6px 0 16px}
.bar i{display:block; height:100%; background:var(--u); transition:width .25s}
.inst{font-family:'Jua',sans-serif; font-size:1.2rem; margin:0 0 4px}
.sit{color:var(--soft); margin:0 0 8px}
.stim{text-align:center; margin:12px 0 16px}
.stim .pic{font-size:5rem}
.stim .line{font-size:1.5rem; font-weight:700; margin-top:6px}
.choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.choice{border:2px solid var(--ink); background:var(--card); border-radius:16px; padding:14px 10px; font-size:1.2rem; box-shadow:0 4px 0 var(--ink); min-height:64px}
.choice .pic{font-size:3rem}
.choice.ok{background:var(--okbg); border-color:var(--ok); box-shadow:0 4px 0 var(--ok)}
.choice.no{background:var(--nobg); border-color:var(--no); box-shadow:0 4px 0 var(--no)}
.choice[disabled]{cursor:default}
.fb{margin-top:16px; border-radius:16px; padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--nobg)}
.fb b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--no)}
.fb p{margin:2px 0 0}
.slots,.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:56px; margin:10px 0}
.slots{border-bottom:3px solid var(--ink); padding-bottom:10px}
.tile{border:2px solid var(--ink); background:var(--card); border-radius:12px; padding:8px 14px; font-size:1.3rem; font-weight:700; box-shadow:0 3px 0 var(--ink)}
.tile.used{visibility:hidden}
.dslots,.dbank{display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin:12px 0}
.dbank{min-height:60px; gap:8px; padding:10px; border-radius:16px; background:var(--paper)}
.dslots{flex-wrap:nowrap}
.slot{flex:0 1 54px; min-width:20px; height:clamp(42px,10vw,60px); border:2px dashed var(--ink); border-radius:12px; display:grid; place-items:center; background:var(--paper)}
.slot.over{border-style:solid; border-color:var(--u); background:var(--card)}
.slot.ok{border-style:solid; border-color:var(--ok); background:var(--okbg)}
.slot.no{border-style:solid; border-color:var(--no); background:var(--nobg)}
.wgap{flex:0 0 10px}
.dtile{width:clamp(27px,7.2vw,46px); height:clamp(36px,8.6vw,50px); padding:0; display:grid; place-items:center; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}
.dtile.drag{position:relative; z-index:5; cursor:grabbing; box-shadow:0 8px 14px rgba(27,39,80,.3)}
.slot .dtile{width:100%; height:100%; box-shadow:none; border-color:transparent; background:none}
.gap{display:inline-block; min-width:1.1em; border-bottom:4px solid var(--u); color:var(--u); text-align:center; margin:0 2px}
.kof{font-family:'Gowun Dodum','Malgun Gothic',sans-serif; font-size:.95rem; line-height:1.25; font-weight:400}
.stim .kof{font-size:1.7rem; font-weight:700}
.spell{overflow-wrap:anywhere; font-size:clamp(1.25rem,5.2vw,2.2rem); font-weight:700; letter-spacing:.08em}
input.type{font-family:'Andika',sans-serif; font-size:1.6rem; text-align:center; width:min(100%,320px); padding:10px; border:2px solid var(--ink); border-radius:14px; background:var(--paper); color:var(--ink)}
.result{text-align:center}
.result .big{font-size:4rem; line-height:1.1}
.result h2{font-size:1.8rem}

.sit{display:flex; gap:14px; align-items:center; background:var(--paper); border:2px solid var(--u); border-radius:18px; padding:16px; margin:10px 0 16px}
.sit .pic{font-size:2.6rem}
.sit p{margin:0; font-size:1.2rem; line-height:1.55}
.rules{margin:0; padding-left:1.2em}
.rules li{margin:6px 0; font-size:1.08rem}
.hints{display:flex; flex-wrap:wrap; gap:8px}
.hint{border:2px solid var(--ink); border-radius:999px; padding:4px 16px; font-size:1.05rem; background:var(--sun); color:#1B2750; font-family:'Jua',sans-serif; box-shadow:0 3px 0 var(--ink)}
.hint[disabled]{opacity:.5; cursor:default}
.hints span{border:2px dashed var(--ink); border-radius:999px; padding:4px 16px; font-size:1.2rem; font-weight:700; background:var(--card)}
/* 공부 달력 */
.cal{margin-top:22px; max-width:380px; padding:12px 14px}
.cal .lead{font-size:.85rem; line-height:1.4}
.calhead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.calhead h2{font-size:1.05rem; margin:0}
.calnav{border:2px solid var(--ink); background:var(--card); border-radius:50%; width:30px; height:30px; font-size:.75rem; padding:0; box-shadow:0 2px 0 var(--ink)}
.calnav[disabled]{opacity:.35; cursor:default}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cw{text-align:center; font-family:'Jua',sans-serif; color:var(--soft); font-size:.75rem}
.cw.sun{color:var(--no)} .cw.sat{color:#3D7BF2}
.cd{position:relative; height:32px; border-radius:8px; background:var(--paper); border:2px solid transparent; display:grid; place-items:center}
.cd.empty{background:none}
.cd b{font-weight:400; font-size:.78rem; color:var(--soft); line-height:1}
.cd.done{background:var(--ok); border-color:var(--ok)}
.cd.done b{color:#fff; font-family:'Jua',sans-serif}
.cd.done i{position:absolute; right:1px; top:-1px; font-style:normal; font-size:.6rem; line-height:1; color:#fff}
.cd.done small{display:none}
.cd.today{border-color:var(--ink); border-style:dashed}
.cd.today.done{border-style:solid; border-color:var(--ink)}
.cd.today b{color:var(--ink); font-family:'Jua',sans-serif}
.cd.today.done b{color:#fff}
/* 처음 화면 윗부분: 화면이 좁아도 제목은 왼쪽, 달력은 오른쪽 */
.starttop{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,min(380px,60%)); gap:clamp(10px,3vw,24px); align-items:center}
.starttop .cal{margin:0; width:100%; max-width:none}
.starttop .hero{padding:0}
.starttop .hero h1{font-size:clamp(1.45rem,6.2vw,3.6rem)}
.starttop .hero p{font-size:clamp(.82rem,2.6vw,1.1rem)}
@media (max-width:600px){
  .starttop .cal{padding:8px; border-radius:16px; box-shadow:0 4px 0 var(--ink)}
  .starttop .cal .lead{font-size:.7rem; margin:3px 0 5px!important}
  .starttop .cal>p.jua{font-size:.82rem!important; margin-bottom:3px!important}
  .starttop .calhead h2{font-size:.85rem}
  .starttop .calnav{width:24px; height:24px; font-size:.6rem}
  .starttop .calgrid{gap:2px}
  .starttop .cw{font-size:.62rem}
  .starttop .cd{height:22px; border-radius:6px; border-width:1.5px}
  .starttop .cd b{font-size:.66rem}
  .starttop .cd.done i{display:none}
}
/* 가을 꾸밈 */
.kidface{display:block; width:clamp(58px,13vw,118px); height:clamp(58px,13vw,118px); border-radius:50%; object-fit:cover; border:4px solid #fff; box-shadow:0 0 0 2px var(--ink),0 5px 0 rgba(27,39,80,.3); transform:rotate(-5deg); margin:0 4px; flex:none}
.autumn .hero{display:flex; flex-wrap:wrap; align-items:center; align-self:start; gap:clamp(6px,2vw,18px); padding-bottom:clamp(34px,9vw,74px)}
.herotxt{min-width:0; flex:1 1 170px}
.autumn{position:relative; overflow:hidden; border:2px solid var(--ink); border-radius:26px; box-shadow:0 6px 0 var(--ink); padding:clamp(12px,3vw,22px); padding-bottom:clamp(50px,11vw,84px);
  background:radial-gradient(ellipse 60% 34% at 18% 108%,#E9A25A 0 99%,transparent 100%),radial-gradient(ellipse 70% 30% at 74% 112%,#D98742 0 99%,transparent 100%),linear-gradient(165deg,#FFF6DD 0%,#FFE2B0 50%,#FBC98C 100%)}
.autumn .hero,.autumn .cal{position:relative; z-index:1}
.autumn .hero p{color:#7A4A21; font-family:'Jua',sans-serif}
.fallttl span{display:inline-block; transform:rotate(var(--r)); text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 4px 0 rgba(122,74,33,.25)}
.leaves{position:absolute; inset:0; pointer-events:none}
.leaf{position:absolute; top:-14%; width:clamp(17px,3.4vw,30px); animation:leaffall linear infinite}
.leaf svg,.fleaf svg{display:block; width:100%; height:auto}
.fleaf{width:clamp(17px,3.6vw,32px); transform:rotate(var(--r))}
@keyframes leaffall{0%{transform:translate(0,-10%) rotate(0deg)} 25%{transform:translate(18px,90px) rotate(70deg)} 50%{transform:translate(-10px,200px) rotate(150deg)} 75%{transform:translate(16px,310px) rotate(230deg)} 100%{transform:translate(0,440px) rotate(320deg)}}
.cd.red b{color:var(--no)}
.cd.hol{background:var(--nobg)}
.cd.done.red b{color:#fff}
.cd.hol.done{background:var(--ok)}
.calmarks{display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 0}
.holnote{padding:0 8px; border-radius:999px; background:var(--nobg); color:var(--no); font-family:'Jua',sans-serif; font-size:.8rem}
.calmarks .bdnote{margin:0; font-size:.8rem}
.cd.bday{background:#FFE1EA; border-color:#E0457B}
.cd.bday b{color:#B5234F; font-family:'Jua',sans-serif}
.cd.bday em{position:absolute; left:0; top:-5px; font-style:normal; font-size:.75rem; line-height:1}
.cd.bday.done{background:var(--ok); border-color:#E0457B} .cd.bday.done b{color:#fff}
.bdnote{display:inline-block; margin-left:4px; padding:0 8px; border-radius:999px; background:#FFE1EA; color:#B5234F; font-family:'Jua',sans-serif}
@media (max-width:600px){ .cd.bday em{font-size:.55rem; top:-4px} .holnote,.calmarks .bdnote{font-size:.66rem; padding:0 6px} .calmarks{gap:3px; margin-top:5px} }
/* 가을 바닥: 단풍나무, 낙엽 더미, 도토리, 다람쥐 */
.fallground{position:absolute; left:0; right:0; bottom:0; height:clamp(46px,10vw,78px); pointer-events:none; background:linear-gradient(#C97A3A,#B5642B); border-top:2px solid var(--ink)}
.fallground>span{position:absolute; line-height:1}
.ftree{bottom:62%; width:calc(clamp(44px,9vw,86px) * var(--s)); }
.ftree svg{display:block; width:100%; height:auto}
.fpile{bottom:38%; font-size:clamp(.95rem,2.8vw,1.6rem); letter-spacing:-.25em}
.facorn{bottom:12%; width:clamp(13px,2.6vw,22px); transform:rotate(var(--r))}
.facorn svg{display:block; width:100%; height:auto}
.fsq{bottom:14%; width:clamp(34px,7vw,60px); animation:sqhop 2.6s ease-in-out infinite}
.fsq svg{display:block; width:100%; height:auto}
.fsq.flip{animation-name:sqhopf}
@keyframes sqhop{0%,60%,100%{transform:translateY(0)} 70%{transform:translateY(-14%)} 80%{transform:translateY(0)} 90%{transform:translateY(-8%)}}
@keyframes sqhopf{0%,60%,100%{transform:scaleX(-1) translateY(0)} 70%{transform:scaleX(-1) translateY(-14%)} 80%{transform:scaleX(-1) translateY(0)} 90%{transform:scaleX(-1) translateY(-8%)}}
@media (prefers-reduced-motion:reduce){ .leaf{animation:none; top:auto; bottom:30%} .fsq{animation:none} .fsq.flip{transform:scaleX(-1)} }
/* 팝업 */
.modal{position:fixed; inset:0; z-index:60; background:rgba(27,39,80,.5); display:grid; place-items:center; padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px)); overflow:auto}
.modalcard{width:min(100%,500px); max-height:100%; overflow:auto; background:var(--paper); background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px); background-size:22px 22px; color:var(--ink); border:2px solid var(--ink); border-radius:24px; box-shadow:0 8px 0 var(--ink); padding:14px; animation:popin .28s cubic-bezier(.2,1.4,.4,1) both}
.modalcard.result{padding:26px 20px}
.modalhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.modalhead h2{font-size:1.3rem}
.modalhead .btn{padding:6px 16px; font-size:.95rem; box-shadow:0 3px 0 var(--ink)}
@keyframes popin{from{transform:scale(.86) translateY(18px); opacity:0} to{transform:none; opacity:1}}
/* 방울 게임 */
.bp{max-width:520px; margin:0 auto}
.bpstats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px}
.bpstats div{background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:4px 10px; text-align:center; box-shadow:0 4px 0 var(--ink)}
.bpstats small{display:block; color:var(--soft); font-size:.8rem}
.bpstats strong{font-family:'Jua',sans-serif; font-weight:400; font-size:1.4rem}
.bpstage{position:relative; border:2px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:0 6px 0 var(--ink); background:var(--paper); width:min(100%,calc((100vh - 290px) * 468 / 630)); min-width:240px; margin:0 auto}
.bpstage canvas{display:block; width:100%; height:auto; touch-action:none}
.bpover{position:absolute; inset:0; display:grid; place-items:center; background:rgba(243,248,255,.8); background:color-mix(in srgb,var(--paper) 80%,transparent); padding:18px; text-align:center}
.bpover[hidden]{display:none}
.bpover>div{background:var(--card); color:var(--ink); border:2px solid var(--ink); border-radius:22px; padding:20px; max-width:340px; box-shadow:0 6px 0 var(--ink)}
.bpover h2{font-size:1.5rem; margin-bottom:6px}
.bpover p{margin:0 0 14px}
/* 학년 고르기 */
.sync{margin:22px 0 0; color:var(--soft); font-size:.95rem}
.code{flex:1 1 240px; min-width:0; font-size:1rem; padding:10px 12px; border:2px solid var(--ink); border-radius:12px; background:var(--paper); color:var(--ink)}
.grades{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; margin-top:24px}
.grade{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; text-align:left; background:var(--card); border:2px solid var(--ink); border-radius:22px; padding:18px; box-shadow:0 6px 0 var(--ink); transition:transform .1s}
.grade:hover:not([disabled]){transform:translateY(-2px)}
.grade[disabled]{opacity:.55; cursor:default; box-shadow:0 6px 0 var(--line); border-color:var(--line)}
.gnum{font-family:'Jua',sans-serif; font-size:2.6rem; line-height:1; width:72px; height:72px; border-radius:20px; background:var(--u); color:#fff; display:grid; place-items:center}
.gtxt b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.5rem; display:block}
.gtxt span{color:var(--soft); font-size:.95rem; display:block}
.gbar{height:10px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; margin-top:8px; background:var(--paper)}
.gbar i{display:block; height:100%; background:var(--u)}
.gicon{font-size:2.6rem}
/* 놀이 */
.games{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px}
.game{background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:16px; text-align:center; box-shadow:0 4px 0 var(--ink)}
.game .pic{font-size:2.6rem}
.game b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem; display:block}
.game span{font-size:.92rem; color:var(--soft)}
.mem{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:520px; margin:14px auto}
.mcard{aspect-ratio:1; border:2px solid var(--ink); border-radius:14px; background:var(--u); box-shadow:0 3px 0 var(--ink); display:grid; place-items:center; font-size:clamp(.85rem,3.2vw,1.15rem); font-weight:700; padding:2px; overflow:hidden}
.mcard .f{display:none}
.mcard.up{background:var(--card)} .mcard.up .f{display:grid; place-items:center}
.mcard.done{background:var(--okbg); border-color:var(--ok); box-shadow:0 3px 0 var(--ok)}
.mcard .pic{font-size:clamp(1.8rem,8vw,2.8rem)}
.ox{display:flex; gap:16px; justify-content:center}
.ox button{width:110px; height:110px; border-radius:24px; font-size:3.4rem; font-family:'Jua',sans-serif; border:2px solid var(--ink); box-shadow:0 5px 0 var(--ink); color:#fff}
.ox .o{background:#2F7BF0} .ox .x{background:#E4485F}
.meter{font-family:'Jua',sans-serif; color:var(--soft); text-align:center}
@media (max-width:560px){
  body{font-size:17px}
  .boardgrid{grid-template-columns:repeat(4,1fr)}
  .lesson{gap:10px; padding:12px}
  .stim .pic{font-size:4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
/* 줄바꿈: 낱말 중간이나 조사 앞에서 끊기지 않게, 띄어쓰기에서만 줄을 바꿔요 */
body{word-break:keep-all; overflow-wrap:break-word; line-break:strict}
p,li,.lead,.inst,.sit p,.fb p,.tip,.lesson span,.unit .ko,.gtxt span,.game span,.hinfo p,.sync,summary,td{text-wrap:pretty}
h1,h2,h3,.lesson b,.fb b,.mzq{text-wrap:balance}
.nb,.stkline b,.result p b{white-space:nowrap!important; text-wrap:nowrap!important}
.gtxt span .nb{display:inline}
/* 계절 배경 그릇과 겨울 (12월~2월) */
#scene{position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; border-radius:24px}
.autumn.winter{background:radial-gradient(ellipse 60% 34% at 18% 108%,#FFFFFF 0 99%,transparent 100%),radial-gradient(ellipse 70% 30% at 74% 112%,#EAF3FB 0 99%,transparent 100%),linear-gradient(165deg,#CFE4F7 0%,#E3F0FA 50%,#F4FAFE 100%)}
.autumn.winter .hero p{color:#3A5A80}
.autumn.winter .fallttl span{text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 4px 0 rgba(27,39,80,.18)}
.autumn.winter .fallground{background:linear-gradient(#FFFFFF,#E6F0F8)}
.flake{width:calc(clamp(7px,1.4vw,12px) * var(--f))!important; aspect-ratio:1; border-radius:50%; background:#FFFFFF; box-shadow:0 0 0 1.5px rgba(27,39,80,.28); top:-8%!important; animation-name:snowfall!important}
@keyframes snowfall{0%{transform:translate(0,0)} 25%{transform:translate(10px,110px)} 50%{transform:translate(-8px,220px)} 75%{transform:translate(9px,330px)} 100%{transform:translate(0,460px)}}
.fsnowman{bottom:30%; width:calc(clamp(30px,6.4vw,58px) * var(--s,1))}
.fsnowman svg,.fgift svg{display:block; width:100%; height:auto}
.fgift{bottom:16%; width:calc(clamp(16px,3.2vw,30px) * var(--s,1)); transform:rotate(var(--r))}
:root[data-season="winter"] body{background-color:#EEF5FB}
@media (prefers-color-scheme:dark){ :root[data-season="winter"]:not([data-theme="light"]) body{background-color:var(--paper)} }
:root[data-season="winter"][data-theme="dark"] body{background-color:var(--paper)}
@media (prefers-reduced-motion:reduce){ .flake{animation:none!important; top:calc(8% + var(--f) * 40%)!important} }
/* 봄 (3~5월) */
.autumn.spring{background:radial-gradient(ellipse 60% 34% at 18% 108%,#B5E596 0 99%,transparent 100%),radial-gradient(ellipse 70% 30% at 74% 112%,#9BDB7C 0 99%,transparent 100%),linear-gradient(165deg,#DDF2FF 0%,#FDE8F1 55%,#FFF4D9 100%)}
.autumn.spring .hero p{color:#3F6B3A}
.autumn.spring .fallground{background:linear-gradient(#8FD468,#6FBF4F)}
.petal{width:calc(clamp(8px,1.6vw,14px) * var(--f))!important; aspect-ratio:1.25; background:#F9B5CC; border-radius:80% 12% 80% 12%; box-shadow:0 0 0 1.3px rgba(27,39,80,.3); top:-8%!important}
.bfly{position:absolute; width:clamp(18px,3.6vw,34px); animation:bflyfloat 2.6s ease-in-out infinite alternate}
.bfly svg,.ftulip svg,.cloudx svg{display:block; width:100%; height:auto}
@keyframes bflyfloat{from{transform:translate(0,0) rotate(-10deg)} to{transform:translate(16px,-14px) rotate(10deg)}}
.ftulip{bottom:34%; width:calc(clamp(11px,2.3vw,21px) * var(--s,1))}
:root[data-season="spring"] body{background-color:#F4FAF0}
/* 여름 (6~8월) */
.autumn.summer{background:linear-gradient(170deg,#7CCBFF 0%,#BFE7FF 60%,#E2F5FF 100%)}
.autumn.summer .hero p{color:#1F5E8C}
.autumn.summer .fallground{background:linear-gradient(#FBE7B0,#F2D38A)}
.autumn.summer #scene::before{content:""; position:absolute; left:0; right:0; bottom:clamp(46px,10vw,78px); height:clamp(20px,4.6vw,38px); background:linear-gradient(#2F9BE0,#63C1F0); border-top:2px solid var(--ink)}
.sunx{position:absolute; left:47%; top:5%; width:clamp(30px,6.4vw,58px); aspect-ratio:1; border-radius:50%; background:#FFD23F; border:2px solid var(--ink); box-shadow:0 0 0 clamp(4px,1vw,9px) rgba(255,210,63,.4)}
.cloudx{position:absolute; left:-22%; width:calc(clamp(42px,9vw,86px) * var(--s,1)); animation:cloudmove linear infinite}
@keyframes cloudmove{from{left:-22%} to{left:110%}}
:root[data-season="summer"] body{background-color:#EAF6FF}
@media (prefers-color-scheme:dark){ :root[data-season="spring"]:not([data-theme="light"]) body,:root[data-season="summer"]:not([data-theme="light"]) body{background-color:var(--paper)} }
:root[data-season="spring"][data-theme="dark"] body,:root[data-season="summer"][data-theme="dark"] body{background-color:var(--paper)}
@media (prefers-reduced-motion:reduce){ .petal{animation:none!important; top:calc(10% + var(--f) * 40%)!important} .bfly,.cloudx{animation:none} .cloudx:nth-of-type(2){left:10%} .cloudx:nth-of-type(3){left:55%} .cloudx:nth-of-type(4){left:30%} }
/* 학년 상자: 내용이 상자 밖으로 나가지 않게 */
.grade{overflow:hidden; gap:clamp(8px,2.4vw,16px); padding:clamp(12px,3vw,18px)}
.gtxt{min-width:0}
.gnum{width:clamp(52px,13vw,72px); height:clamp(52px,13vw,72px); font-size:clamp(1.9rem,6vw,2.6rem); flex:none}
.gicon{font-size:clamp(1.7rem,6vw,2.6rem); flex:none; line-height:1; max-width:1.3em; overflow:hidden}

/* ===== 채이의 공부방: 과목 틀 ===== */
.starttop .herotxt{container-type:inline-size; flex:1 1 0; min-width:0; width:100%}
.starttop .hero h1{white-space:nowrap; font-size:clamp(1rem,4.6vw,3rem); font-size:clamp(.82rem,calc(90cqw / var(--tc,8)),3.1rem)}
.starttop{min-height:clamp(230px,38vw,330px); align-items:start}
.starttop:has(.todaygrid>:only-child){align-items:center}
.hero p .hello{font-family:'Jua',sans-serif; color:var(--ink); font-weight:400; font-size:1.08em}
@media (max-width:860px){ .starttop .hero{flex-direction:column; align-items:flex-start; gap:6px} .starttop .herotxt{flex:none; width:100%} }
.todaybox{position:relative; z-index:1; margin:0; padding:12px 12px 14px; border:2px solid var(--ink); border-radius:20px; background:var(--card); box-shadow:0 6px 0 var(--ink); min-width:0}
.todaybox h2{font-family:'Jua',sans-serif; font-size:1.25rem; display:flex; align-items:center; justify-content:space-between; gap:8px}
.todaybox .lead{margin:0 0 8px; font-size:.88rem}
.todaygrid{display:grid; gap:7px}
.todaycard{display:flex; align-items:center; gap:9px; text-align:left; padding:8px 10px; border:2px solid var(--ink); border-left:8px solid var(--u); border-radius:14px; background:var(--paper); color:var(--ink); min-width:0; width:100%}
.todaycard .tmark{flex:none; min-width:44px; height:44px; padding:0 6px; border-radius:12px; background:var(--u); color:#fff; display:grid; place-items:center; font-family:'Jua',sans-serif; font-size:1.1rem}
.todaycard .tt{display:grid; flex:1 1 auto; min-width:0; line-height:1.3}
.todaycard .tt b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.1rem; color:var(--u)}
.todaycard .tw{font-size:.8rem; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.todaycard .tl{font-weight:700; font-size:.94rem; overflow-wrap:anywhere}
.todaycard .tgo{flex:none; color:var(--u); font-size:1rem}
.todaycard.did{background:var(--okbg); border-color:var(--ok); border-left-color:var(--ok)}
.todaycard.did .tt b{color:var(--ok)} .todaycard.did .tl{color:var(--soft); font-weight:400}
.tnext{font-weight:400}
.twait{margin:2px 0 0; font-size:.78rem; color:var(--soft); line-height:1.4}
.tcount{display:inline-flex; align-items:center; gap:4px; font-family:'Gowun Dodum','Noto Sans KR',sans-serif}
.tcount i{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--ink); background:var(--paper)}
.tcount i.on{background:var(--ok); border-color:var(--ok)}
.tcount b{font-size:.82rem; margin-left:3px; color:var(--soft)}
.todaybox.alldone{border-color:var(--ok); box-shadow:0 6px 0 var(--ok)}
.todaybox.alldone .lead{display:block!important; color:var(--ok); font-weight:700}
.tdone{flex:none; display:grid; place-items:center; width:46px; height:46px; border-radius:50%; border:2.5px solid #E0457B; color:#E0457B; background:#fff; font-family:'Jua',sans-serif; font-size:.9rem; transform:rotate(-12deg); box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3.5px #E0457B; animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{from{transform:rotate(-12deg) scale(2); opacity:0} to{transform:rotate(-12deg) scale(1); opacity:1}}
.subjcard{position:relative}
.subjcard.soon{background:repeating-linear-gradient(135deg,var(--card) 0 14px,var(--paper) 14px 28px)}
.subjcard.soon .gnum{opacity:.75}
.soonb{display:inline-block; width:fit-content; margin-top:4px; padding:2px 10px; border:1.5px dashed var(--soft); border-radius:999px; font-size:.78rem; color:var(--soft); background:var(--card)}
.subjtabs{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.stab{flex:1 1 auto; min-height:44px; padding:8px 14px; border:2px solid var(--ink); border-radius:999px; background:var(--card); color:var(--ink); font-family:'Jua',sans-serif; font-size:1.02rem; box-shadow:0 4px 0 var(--ink)}
.stab.on{background:var(--u); color:#fff}
.stab.home{background:var(--sun); color:var(--ink)}
.soonpanel{margin-top:16px; border-left:10px solid var(--u)}
.soonpanel h2{font-family:'Jua',sans-serif}
.soonpanel .gnum{background:var(--u); color:#fff; border-radius:16px; place-items:center}
.frame{margin:12px 0; padding:0; list-style:none; counter-reset:f; display:grid; gap:8px}
.frame li{counter-increment:f; display:grid; grid-template-columns:auto 1fr; column-gap:10px; padding:10px 12px; border:2px dashed var(--line); border-radius:14px; background:var(--paper)}
.frame li::before{content:counter(f); grid-row:1/3; width:32px; height:32px; border-radius:50%; background:var(--u); color:#fff; display:grid; place-items:center; font-family:'Jua',sans-serif}
.frame li b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.05rem} .frame li span{color:var(--soft); font-size:.9rem}
.calrow{display:flex; justify-content:center; margin-top:22px}
.calrow .cal{width:100%; max-width:none; margin:0; padding:clamp(10px,2vw,16px)}
.calrow .calgrid{gap:clamp(2px,.5vw,5px)}
.calrow .cd{height:clamp(30px,4.2vw,40px)}
.calrow .cal .lead{margin:2px 0 6px!important}
@media (max-width:600px){
  .todaybox{padding:8px 8px 10px; border-radius:16px; box-shadow:0 4px 0 var(--ink)}
  .todaybox h2{font-size:1rem} .todaybox .lead{display:none}
  .todaygrid{gap:5px; margin-top:5px}
  .todaycard{padding:5px 6px; gap:6px; border-left-width:6px}
  .todaycard .tmark{min-width:30px; height:30px; font-size:.8rem; border-radius:9px}
  .todaycard .tt b{font-size:.9rem} .todaycard .tw{display:none} .todaycard .tl{font-size:.76rem} .todaycard .tgo{display:none}
  .tcount i{width:8px; height:8px} .tcount b{font-size:.68rem}
  .tdone{width:30px; height:30px; font-size:.6rem; border-width:2px; box-shadow:none} .tnext{display:none}
  .twait{font-size:.66rem}
  .subjtabs{gap:5px} .stab{padding:6px 8px; font-size:.86rem; min-height:40px; box-shadow:0 3px 0 var(--ink)} .stab.home{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){ .tdone{animation:none} }
/* 과목 도우미 친구들 */
.hj{font-family:'Noto Serif KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',serif; font-weight:700; line-height:1.15}
.bud{display:block; width:100%; height:100%; overflow:visible}
.gnum.budbox{background:color-mix(in srgb,var(--u) 18%,var(--card)); padding:3px; border:2px solid var(--u)}
.subjcard.soon .gnum.budbox{opacity:1}
.budsay{display:flex; align-items:center; gap:14px; margin-top:14px}
.budsay .budpic{flex:none; width:clamp(68px,17vw,100px); height:clamp(68px,17vw,100px); animation:budbob 2.6s ease-in-out infinite}
.budsay p{position:relative; margin:0; padding:11px 16px; border:2px solid var(--ink); border-radius:18px; background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--ink); font-size:1rem; line-height:1.45; max-width:none}
.budsay p b{display:block; font-family:'Jua',sans-serif; font-weight:400; color:var(--u); font-size:1.08rem}

.budhelp{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:16px}
.budhelp button{display:flex; align-items:center; gap:6px; border:2px dashed var(--u); border-radius:999px; background:var(--card); color:var(--ink); padding:3px 16px 3px 6px; font-family:'Jua',sans-serif; font-size:1rem; min-height:50px}
.budhelp button .bud{width:42px; height:42px}
.budhelp button:disabled{opacity:.45}
.budhelp p{margin:0; padding:8px 14px; border:2px solid var(--ink); border-radius:16px; background:var(--card); font-size:.95rem}
.choice.out{opacity:.3; text-decoration:line-through}
.tile.out{opacity:.3}
.fbbud{flex:none; width:60px; display:grid; justify-items:center}

.budhelp p b{font-family:'Jua',sans-serif; font-weight:400; color:#C98A00; margin-right:4px}
.budcheer{width:86px; height:86px; margin:0 auto 4px; animation:budbob 1.6s ease-in-out infinite}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.15; margin:0 .18em; font-size:.92em}
.fr i{font-style:normal; padding:0 .25em}
.fr i:first-child{border-bottom:2px solid currentColor}
.mtxt{font-size:1.15rem; line-height:1.65; max-width:32em; margin:6px auto 0; text-wrap:pretty}
.choice .mth{font-size:1.25rem; font-weight:700}
.pg{display:inline-grid; gap:4px; text-align:left; border:2px solid var(--ink); border-radius:14px; padding:10px 14px; background:var(--card); max-width:100%}

.pgr{display:grid; grid-template-columns:5.2em 1fr; align-items:center; border-top:1.5px dashed var(--line); padding-top:3px}
.pgn{font-weight:700; font-size:.95rem}
.pgb{font-size:1.7rem; letter-spacing:1px} .pgs{font-size:.95rem; margin-left:4px}
.pg small{color:var(--soft); text-align:center}
.choice .kch{font-size:1.02rem; font-weight:400; line-height:1.45}
.choices:has(.kch){grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){ .choices:has(.kch){grid-template-columns:1fr} }
.kpas{background:color-mix(in srgb,var(--u) 9%,var(--card)); border-left:6px solid var(--u); border-radius:12px; padding:12px 16px; text-align:left; margin-bottom:6px}

  if(w.sw||w.txt||w.sm||w.nopic) return null;

  if(w.svg) return SVGKEY[w.svg]||null;
  return (w.p&&EMO[w.p])||null;

function phOk(el){ el.style.display=''; const n=el.nextElementSibling; if(n) n.remove(); }
function phBad(el,k){ PH[k]=0; el.remove(); }
function pic(w){
  const k=photoKey(w);
  if(!k||PH[k]===0) return picBase(w);
  if(IMG[k]) return '<span class="pic"><img class="ph" alt="" src="'+IMG[k]+'"></span>';

}
function picBase(w){
  if(w.sw) return '<span class="pic"><span class="sw" style="background:'+w.sw+'"></span></span>';

function MK(d){
  const A=t=>String(t||'').replace(/([A-Za-z])'/g,'$1’');
  return {id:d.id,color:d.color,icon:d.icon,title:A(d.title),ko:d.ko,books:d.books,note:A(d.note),tip2:A(d.tip2),tip3:A(d.tip3),
    words:d.w.split('|').map(x=>{const a=x.split('='), w={en:A(a[0]),ko:a[1]}; if(!a[2]) w.nopic=1; else if(a[2][0]==='#') w.txt=a[2].slice(1); else w.p=a[2]; return w;}),
    expr:d.e.split('|').map(x=>x.split('=').map(A)),
    mc:d.q.map(x=>{const a=x.split(';'); return [A(a[0]),{p:a[1]},A(a[2]),A(a[3]),A(a[4]),A(a[5]),A(a[6])];}),
    order:d.o.split('|').map(A)};
}

const VCOL=['#E0457B','#3D7BF2','#2FA36B','#F08A24','#8A5CF0','#1F9BB5'];
function MKV(lv,s,i){
  const A=t=>String(t||'').replace(/([A-Za-z])'/g,'$1’'), f=s.split('|'), low=t=>t.toLowerCase();
  const words=f[3].split('/').map(x=>{const a=x.split('='), w={en:A(a[0]),ko:a[1]}; if(a[2]) w.p=a[2]; else w.nopic=1; return w;});
  const sents=f[4].split('/').map(x=>{const a=x.split('='), m=/\[(.+?)\]/.exec(a[0]); return {en:A(a[0].replace(/[\[\]]/g,'')),gap:A(a[0].replace(/\[.+?\]/,'___')),ans:A(m[1]),start:a[0][0]==='[',ko:a[1]};});
  const find=ans=>{const t=low(ans); return words.find(w=>low(w.en)===t)||words.filter(w=>t.indexOf(low(w.en))===0).sort((a,b)=>b.en.length-a.en.length)[0];};
  const mc=[];
  sents.forEach((S,k)=>{
    const w=find(S.ans), t=low(S.ans), pool=words.filter(x=>x!==w&&t.indexOf(low(x.en))!==0&&low(x.en).indexOf(t)!==0);
    const d1=pool[(k*3+1)%pool.length], d2=pool[(k*3+5)%pool.length]===d1?pool[(k*3+6)%pool.length]:pool[(k*3+5)%pool.length];
    const cap=x=>S.start?x[0].toUpperCase()+x.slice(1):x, hint=(w?w.en+' : '+w.ko+'. ':'')+S.en, p={p:(w&&w.p)||'✏️'};
    mc.push([S.gap,p,S.ans,cap(d1.en),cap(d2.en),hint,'‘'+S.ko+'’ 빈칸에 알맞은 낱말을 고르세요.']);
    if(k%2===0){ const o=sents.filter(x=>x!==S); mc.push([S.en,p,S.ko,o[k%o.length].ko,o[(k+2)%o.length].ko,hint,'무슨 뜻일까요?']); }
  });
  const nw=t=>t.split(' ').length, ord=sents.filter(S=>nw(S.en)>=3&&nw(S.en)<=8).map(S=>S.en);
  const sayv=sents.slice(0,4).map(S=>{ const ws=S.en.replace(/[.,?!]/g,'').split(' '), hs=[...new Set(ws)].sort((a,b)=>b.length-a.length).slice(0,Math.min(3,Math.max(1,ws.length-1))); hs.sort((a,b)=>ws.indexOf(a)-ws.indexOf(b)); return '‘'+S.ko+'’ 영어로 뭐라고 말할까?|'+S.en+'|'+hs.join(','); });
  return {id:'v'+lv+'-'+String(i+1).padStart(2,'0'),voca:1,day:i+1,ul:'Day '+String(i+1).padStart(2,'0'),sem:i<15?1:2,color:VCOL[i%VCOL.length],icon:f[2],title:A(f[0]),ko:f[1],books:[],
    note:'오늘의 낱말은 '+words.length+'개예요. 소리를 듣고 큰 소리로 따라 말해 봐요.',tip2:'낱말은 문장 속에서 익히면 더 오래 기억에 남아요.',tip3:'낱말을 다 쓴 다음에는 소리 내어 한 번 더 읽어 봐요.',
    names:{0:['낱말 만나기','오늘의 낱말 '+words.length+'개를 익혀요'],1:['문장 속 낱말','문장의 빈칸에 알맞은 낱말을 골라요'],2:['낱말 쓰기','글자를 채우고 문장을 만들어요']},
    words,expr:[],sents,mc,order:ord.length>=3?ord.slice(0,4):sents.map(S=>S.en),sayv};
}
const VOCA1=V1.map((s,i)=>MKV(1,s,i)), VOCA2=V2.map((s,i)=>MKV(2,s,i));

function MKH(tag,src){

  const out=[]; let p=0;
  [10,10,10,9,9,9,9,9].forEach((n,i)=>{ const ws=all.slice(p,p+n); p+=n;
    out.push({id:tag+'-'+(i+1),hanja:1,cq:1,day:i+1,ul:(i+1)+'마당',sem:1,color:HCOL[i%HCOL.length],icon:'<span class="hj">'+ws[0].en+'</span>',title:ws.map(w=>w.en).join(' '),ko:'한자 '+n+'자 · '+ws.slice(0,3).map(w=>w.ko).join(', ')+' …',books:[],
      note:'한자는 뜻(훈)과 소리(음)를 함께 외워요. ‘'+ws[0].ko+'’처럼요.',tip2:'',tip3:'',
      names:{0:['한자 만나기','한자의 뜻과 소리를 익혀요'],1:['한자어 읽기','한자가 들어간 낱말을 읽어요'],2:['뜻과 소리','뜻과 소리로 한자를 찾아요'],3:['놀이 한마당','게임으로 배운 한자를 다져요'],s:['마무리 도전','배운 한자를 골고루 풀어요']},
      words:ws,expr:[],mc:[],order:[]}); });
  return out;
}

function hanjaQuiz(u,l){
  const W=u.words, ALL=GRADES[u.g].units.flatMap(x=>x.words), qs=[];

    B:w=>({t:'c',inst:'뜻과 소리에 알맞은 한자를 고르세요.',stim:stim(w.ko),ch:ch(w,oth(w,3,x=>x.en),x=>hj(x.en)),ex:ex(w)}),

    D:w=>({t:'c',inst:'풀이에 알맞은 한자어를 고르세요.',stim:stim(w.hm)+'<div class="meter">읽기: '+w.hr+'</div>',ch:ch(w,oth(w,2,x=>x.hw),x=>hj(x.hw)),ex:w.hw+'('+w.hr+') : '+w.hm}),
    E:w=>({t:'c',inst:'‘'+w.eum+'’ 소리가 나는 한자를 고르세요.',stim:stim('소리: '+w.eum),ch:ch(w,oth(w,3,x=>x.eum),x=>hj(x.en)),ex:ex(w)}),

    G:w=>({t:'c',inst:'빈칸에 들어갈 한자를 고르세요.',stim:stim(hj(w.hw.replace(w.en,'□'),3.4))+'<div class="meter">'+w.hr+' : '+w.hm+'</div>',ch:ch(w,oth(w,3,x=>x.en).filter(x=>w.hw.indexOf(x.en)<0),x=>hj(x.en)),ex:w.hw+'('+w.hr+') : '+w.hm})
  };
  T.H=w=>({t:'w',exact:1,nosay:1,inst:'한자의 소리(음)를 한글로 써 보세요.',w:{en:w.eum,ko:hj(w.en,4)+'<div class="meter">뜻: '+w.hun+'</div>',nopic:1,say:w.ko},ex:ex(w)});
  T.I=w=>({t:'w',exact:1,nosay:1,inst:'한자어를 어떻게 읽는지 한글로 써 보세요.',w:{en:w.hr,ko:hj(w.hw,3.4)+'<div class="meter">'+w.hm+'</div>',nopic:1,say:w.hr},ex:w.hw+'('+w.hr+') : '+w.hm});
  const add=(k,n)=>pick(W,n).forEach(w=>qs.push(T[k](w)));
  if(l===0){ add('A',5); add('B',5); }
  else if(l===1){ add('C',5); add('D',3); add('I',2); }
  else if(l===2){ add('E',3); add('F',3); add('G',2); add('H',2); }
  else { add('A',2); add('B',2); add('C',2); add('G',1); add('H',2); add('I',1); return shuffle(qs); }
  return qs;

function MKE(tag,list,cols){
  const A=t=>String(t||'').replace(/([A-Za-z])'/g,'$1’');
  return list.map((d,i)=>{
    const items=d.q.map(x=>{ const a=x.split('|'), f=o=>A(a[0].replace('___',o)); return {gap:A(a[0]),ans:A(a[1]),ws:[A(a[2]),A(a[3])],full:f(a[1]),bad:[f(a[2]),f(a[3])],ko:a[4]}; });
    const short=items.slice().sort((x,y)=>x.full.length-y.full.length).slice(0,7);
    return {id:tag+'-'+(i+1),gq:1,cq:1,sem:1,ul:(i+1)+'단원',color:cols[i%cols.length],icon:d.i,title:d.t,ko:d.k,books:[],note:'',tip2:'',tip3:'',expr:[],mc:[],order:[],
      rule:A(d.r),trap:A(d.p),items,words:short.map(x=>({en:x.full,ko:x.ko,nopic:1})),
      names:{0:['규칙 알아보기','빈칸에 알맞은 말을 골라요'],1:['바른 문장 찾기','뜻에 맞는 바른 문장을 골라요'],2:['문장 만들기','낱말을 놓아 문장을 만들어요'],3:['놀이 한마당','게임으로 배운 것을 다져요'],s:['마무리 도전','단원에서 배운 것을 골고루 풀어요']}};
  });
}

  "문단에서 가장 중요한 내용을 담은 문장을 무엇이라고 할까요?|중심 문장|뒷받침 문장|이어 주는 말|제목|문단의 중심 내용을 담은 문장이 중심 문장이에요.",
  "중심 문장을 자세히 설명하거나 예를 들어 주는 문장은 무엇일까요?|뒷받침 문장|중심 문장|제목|차례|뒷받침 문장은 중심 문장을 도와줘요.",
  "책을 다 읽은 뒤에 하면 좋은 활동은 무엇일까요?|중심 내용에 대한 내 의견 말하기|책의 쪽수만 세어 보기|책을 바로 잊어버리기|표지 색깔만 기억하기|읽은 내용에 대한 생각을 나누면 책을 더 깊이 이해해요.",
  "책을 꾸준히 읽으려면 어떻게 하는 것이 좋을까요?|계획을 세우고 날마다 조금씩 읽는다|하루에 한 권을 억지로 다 읽는다|어려운 책만 골라 읽는다|읽고 싶을 때만 가끔 읽는다|계획대로 차근차근 읽으면 끝까지 읽을 수 있어요."],
 ox:["자신의 수준과 흥미에 맞는 책을 고르는 것이 좋다.|O|내게 맞는 책이어야 끝까지 즐겁게 읽을 수 있어요.","중심 문장은 언제나 문단의 맨 끝에만 있다.|X|중심 문장은 문단의 처음, 가운데, 끝 어디에나 올 수 있어요.","책의 차례를 보면 책에 어떤 내용이 있는지 짐작할 수 있다.|O|차례에는 책의 내용이 순서대로 나와 있어요.","중심 내용을 찾을 때 제목은 아무 도움이 되지 않는다.|X|제목에는 글의 중심 내용이 담겨 있는 때가 많아요."],
 ap:[{pas:'도시에도 여러 야생 동물이 살고 있습니다. 공원의 나무에는 청설모가 삽니다. 하천 주변에는 왜가리가 날아옵니다. 밤에는 너구리가 먹이를 찾아 돌아다니기도 합니다.',q:["이 문단의 중심 문장은 무엇일까요?|도시에도 여러 야생 동물이 살고 있습니다.|공원의 나무에는 청설모가 삽니다.|하천 주변에는 왜가리가 날아옵니다.|밤에는 너구리가 돌아다니기도 합니다.|나머지 문장은 모두 도시에 사는 야생 동물의 예예요.","이 문단에 나오지 않은 동물은 무엇일까요?|호랑이|청설모|왜가리|너구리|호랑이는 글에 나오지 않아요."]},
  {pas:'갈대는 주로 물가에서 자랍니다. 억새는 산이나 들에서 자랍니다. 갈대의 이삭은 갈색이고 억새의 이삭은 은빛입니다. 이처럼 갈대와 억새는 비슷해 보여도 서로 다른 식물입니다.',q:["이 문단의 중심 문장은 무엇일까요?|갈대와 억새는 비슷해 보여도 서로 다른 식물입니다.|갈대는 주로 물가에서 자랍니다.|억새는 산이나 들에서 자랍니다.|갈대의 이삭은 갈색입니다.|앞의 문장들을 모아 정리한 마지막 문장이 중심 문장이에요.","억새는 주로 어디에서 자랄까요?|산이나 들|물가|바닷속|집 안|억새는 산이나 들에서 자란다고 했어요."]},
  {pas:'우리나라 전통 악기는 소리를 내는 방법이 여러 가지입니다. 장구와 북은 두드려서 소리를 냅니다. 가야금과 거문고는 줄을 뜯거나 튕겨서 소리를 냅니다. 대금과 단소는 입으로 불어서 소리를 냅니다.',q:["이 문단의 중심 내용은 무엇일까요?|전통 악기는 소리를 내는 방법이 여러 가지이다.|장구는 두드려서 소리를 낸다.|대금은 불어서 소리를 낸다.|가야금은 줄이 있는 악기이다.|첫 문장이 문단 전체를 감싸는 중심 문장이에요.","줄을 뜯거나 튕겨서 소리를 내는 악기는 무엇일까요?|가야금|장구|단소|북|가야금과 거문고는 줄을 뜯거나 튕겨요."]}],
 d:['계획','둥지','암수','형제의 화해','내 친구 나비','암나무와 수나무','박씨로 갚은 은혜','줄기가 반질반질해요.','우리나라의 전통 음악','읽고 싶은 책을 선택한다.'],
 w:'중심 문장=문단에서 가장 중요한 문장|뒷받침 문장=중심 문장을 자세히 설명하는 문장|차례=책의 내용을 순서대로 적은 것|독서 계획=읽을 책과 기간을 정한 것|문단=여러 문장이 모인 글의 한 덩어리|제목=글의 내용을 나타내는 이름'},
{ul:'1단원',t:'경험과 관련지으며 이해해요',k:'경험을 떠올리며 감상하기, 중요한 내용 간추리기',i:'🍂',
 r:'시나 이야기를 읽을 때 <b>내가 겪은 비슷한 일</b>을 떠올리면 인물의 마음을 더 잘 이해할 수 있어요.<br>중요한 내용을 간추리며 듣는 방법<br><b>듣기 전</b>: 제목을 보고 들을 내용을 예상해요.<br><b>듣는 중</b>: 중요한 부분을 간단히 기록해요.<br><b>들은 뒤</b>: 기호를 활용해 중요한 내용을 정리해요.',
 p:'글을 읽고 <b>누가, 무엇을, 왜</b> 했는지 찾아봐요. ‘첫째, 둘째’ 같은 말 뒤에는 중요한 내용이 차례대로 나와요.',
 c:["시나 이야기를 읽을 때 자신의 경험을 떠올리면 좋은 점은 무엇일까요?|인물의 마음을 더 잘 이해할 수 있다|글이 더 짧아진다|글씨를 예쁘게 쓸 수 있다|읽는 시간이 줄어든다|비슷한 경험을 떠올리면 인물의 마음이 더 잘 느껴져요.",
  "중요한 내용을 간추리며 들을 때, 듣기 전에 할 일은 무엇일까요?|제목을 보고 들을 내용을 예상한다|들은 내용을 모두 외운다|친구와 이야기를 나눈다|눈을 감고 쉰다|듣기 전에는 제목을 보고 내용을 예상해요.",
  "듣는 중에는 어떻게 하는 것이 좋을까요?|중요한 부분을 간단히 기록한다|들리는 말을 모두 받아 적는다|아무것도 적지 않는다|다른 생각을 한다|중요한 부분만 간단히 적어요.",
  "들은 뒤에 중요한 내용을 정리할 때 활용하면 좋은 것은 무엇일까요?|기호|큰 목소리|색종이|박수|화살표나 번호 같은 기호를 쓰면 정리하기 쉬워요.",
  "‘첫째’, ‘둘째’와 같은 말이 들리면 어떻게 해야 할까요?|중요한 내용이 차례로 나오므로 주의해서 듣는다|중요하지 않으므로 흘려듣는다|듣기를 멈춘다|다음 날 다시 듣는다|차례를 나타내는 말 뒤에는 중요한 내용이 나와요.",
  "이야기를 듣고 글로 정리할 때 알맞은 방법은 무엇일까요?|일이 일어난 차례대로 중요한 내용을 쓴다|기억나는 낱말만 아무렇게나 쓴다|들은 내용과 다른 이야기를 쓴다|제목만 쓴다|일어난 차례대로 정리하면 내용이 잘 드러나요."],
 ox:["중요한 내용을 간추릴 때는 들은 내용을 하나도 빠짐없이 옮겨 적어야 한다.|X|모두 적지 않고 중요한 부분만 간단히 기록해요.","듣는 목적을 생각하며 내용을 간추리면 좋다.|O|무엇을 알려고 듣는지 생각하면 중요한 내용이 보여요.","시 속 말하는 이와 비슷한 경험을 떠올리면 시를 더 깊이 느낄 수 있다.|O|경험과 관련지으면 마음이 더 잘 느껴져요.","같은 시를 읽으면 누구나 똑같은 느낌을 받는다.|X|사람마다 경험이 달라서 느낌도 다를 수 있어요."],
 ap:[{pas:'전학 간 단짝 지우가 생각났다. 운동장 은행나무 아래에서 함께 놀던 일이 떠올랐다. 나는 노란 은행잎 한 장을 주워 공책 사이에 끼워 두었다. 다음에 만나면 꼭 보여 주고 싶다.',q:["글쓴이의 마음으로 알맞은 것은 무엇일까요?|친구가 그리운 마음|친구에게 화난 마음|시험이 걱정되는 마음|배가 고픈 마음|전학 간 친구를 떠올리며 보고 싶어 해요.","글쓴이와 비슷한 경험을 떠올린 친구는 누구일까요?|이사 간 친구가 보고 싶어 편지를 쓴 적이 있어.|어제 급식에 은행이 나왔어.|나는 은행나무 냄새가 싫어.|공책을 새로 샀어.|멀리 간 친구를 그리워한 경험이 글쓴이의 경험과 비슷해요.","글쓴이가 은행잎을 공책에 끼워 둔 까닭은 무엇일까요?|다음에 지우를 만나면 보여 주려고|공책을 꾸미려고|숙제를 하려고|은행잎을 팔려고|다음에 만나면 꼭 보여 주고 싶다고 했어요."]},
  {pas:'내일 현장 체험 학습 안내입니다. 첫째, 아침 8시 30분까지 운동장으로 모입니다. 둘째, 도시락과 물을 준비합니다. 셋째, 걷기 편한 운동화를 신고 옵니다.',q:["이 안내를 알맞게 간추린 것은 무엇일까요?|8시 30분 운동장, 도시락과 물, 운동화|내일은 학교에 오지 않는다|도시락은 학교에서 준다|운동장에서 축구를 한다|차례를 나타내는 말 뒤의 내용을 간단히 적으면 돼요.","준비물로 알맞지 않은 것은 무엇일까요?|장난감|도시락|물|운동화|장난감은 안내에 없었어요.","모이는 곳은 어디일까요?|운동장|교실|도서관|급식실|운동장으로 모인다고 했어요."]}],
 d:['텃새','연통','객차','상자갑','콧방귀','헛발질','요리조리','아득히 사라진다.','설계도를 꾸민다.','개미 떼가 덤빈다.'],
 w:'경험=내가 직접 겪은 일|간추리기=중요한 내용만 짧게 정리하기|말하는 이=시에서 이야기하는 사람|기록=잊지 않도록 적어 두는 것|예상=미리 짐작해 보는 것|감상=작품을 읽고 느끼는 것'},
{ul:'2단원',t:'유창하게 읽고 발표해요',k:'분위기를 살려 읽기, 글과 그림으로 발표하기',i:'🎤',
 r:'<b>유창하게 읽기</b>: 알맞은 빠르기로, 정확하게 발음하고, 알맞게 띄어 읽어요.<br>장면의 <b>분위기</b>에 어울리는 목소리와 말투로 읽어요. 슬픈 장면은 낮고 느리게, 신나는 장면은 밝고 경쾌하게 읽어요.<br>설명할 때 <b>글과 그림</b>을 함께 쓰면 듣는 사람이 더 쉽게 이해해요.',
 p:'장면에서 <b>무슨 일이 일어났는지</b>, <b>인물의 마음이 어떤지</b>를 찾으면 분위기를 알 수 있어요.',
 c:["글을 유창하게 읽는 방법으로 알맞은 것은 무엇일까요?|알맞은 빠르기로 정확하게 발음하며 읽는다|무조건 빠르게 읽는다|작은 소리로 웅얼거리며 읽는다|쉬지 않고 한숨에 읽는다|알맞은 빠르기와 정확한 발음이 중요해요.",
  "슬픈 장면을 읽을 때 어울리는 목소리는 무엇일까요?|낮고 느린 목소리|밝고 빠른 목소리|크게 웃는 목소리|장난스러운 목소리|슬픈 분위기에는 낮고 느린 목소리가 어울려요.",
  "신나는 장면을 읽을 때 어울리는 목소리는 무엇일까요?|밝고 경쾌한 목소리|낮고 무거운 목소리|울먹이는 목소리|속삭이는 목소리|신나는 분위기는 밝고 경쾌하게 읽어요.",
  "설명할 때 글과 그림을 함께 활용하면 좋은 점은 무엇일까요?|듣는 사람이 내용을 더 쉽게 이해한다|설명이 더 길어진다|그림만 봐도 되어 글이 필요 없다|발표를 빨리 끝낼 수 있다|그림이 글의 내용을 눈으로 보여 줘요.",
  "발표 자료에 넣을 그림은 어떤 것이 좋을까요?|설명하는 내용과 관련 있는 그림|내가 좋아하는 만화 그림|색이 가장 화려한 그림|내용과 상관없는 재미있는 그림|내용과 관련 있는 그림이어야 이해를 도와요.",
  "발표할 때 알맞은 태도는 무엇일까요?|듣는 사람을 바라보며 알맞은 크기로 말한다|바닥만 보며 작은 소리로 말한다|자료만 보며 빠르게 읽는다|뒤돌아서서 말한다|듣는 사람을 바라보고 또박또박 말해요."],
 ox:["글은 빠르게 읽을수록 유창하게 읽는 것이다.|X|알맞은 빠르기로 읽어야 내용이 잘 전달돼요.","장면의 분위기에 어울리는 목소리와 말투로 읽으면 실감 난다.|O|분위기를 살려 읽으면 장면이 생생하게 떠올라요.","발표할 때 그림은 내용과 관련이 없어도 재미있으면 된다.|X|그림은 설명하는 내용과 관련이 있어야 해요.","인물이 처한 상황을 떠올리며 읽으면 인물의 마음이 잘 드러난다.|O|상황을 떠올리면 어울리는 목소리를 찾을 수 있어요."],
 ap:[{pas:'비가 그치자 운동장 위로 무지개가 떴다. 아이들은 환호성을 지르며 밖으로 뛰어나갔다. 여기저기에서 웃음소리가 터져 나왔다.',q:["이 장면의 분위기로 알맞은 것은 무엇일까요?|밝고 신난다|조용하고 슬프다|무섭고 어둡다|쓸쓸하고 외롭다|환호성과 웃음소리에서 신나는 분위기를 알 수 있어요.","이 글을 읽을 때 어울리는 목소리는 무엇일까요?|밝고 경쾌한 목소리|낮고 느린 목소리|울먹이는 목소리|화난 목소리|신나는 장면은 밝고 경쾌하게 읽어요."]},
  {pas:'할머니 댁 강아지 복실이가 며칠째 밥을 먹지 않았다. 민지는 복실이 곁에 조용히 앉아 등을 쓸어 주었다. 창밖에는 비가 추적추적 내리고 있었다.',q:["이 장면의 분위기로 알맞은 것은 무엇일까요?|조용하고 걱정스럽다|시끄럽고 즐겁다|바쁘고 정신없다|우습고 재미있다|아픈 강아지를 걱정하는 조용한 장면이에요.","민지의 마음으로 알맞은 것은 무엇일까요?|복실이가 걱정되는 마음|복실이에게 화난 마음|신나고 들뜬 마음|심심한 마음|곁에 앉아 등을 쓸어 주는 모습에서 걱정하는 마음을 알 수 있어요."]},
  {pas:'숫자는 수를 셀 때만 쓰는 것이 아닙니다. 버스 번호, 전화번호, 운동선수의 등 번호처럼 이름처럼 쓰이기도 합니다. 이런 숫자는 서로를 구별하게 해 줍니다.',q:["이 글을 활용해 발표할 주제로 알맞은 것은 무엇일까요?|이름처럼 쓰는 숫자|숫자를 예쁘게 쓰는 방법|버스를 타는 방법|전화기의 역사|숫자가 이름처럼 쓰이는 예를 설명하는 글이에요.","이름처럼 쓰는 숫자의 예로 알맞지 않은 것은 무엇일까요?|사과 세 개|버스 번호|전화번호|등 번호|‘사과 세 개’의 세는 수를 세는 말이에요.","이 발표에 어울리는 그림은 무엇일까요?|번호가 적힌 버스와 운동복 그림|바닷속 물고기 그림|눈 내리는 산 그림|맛있는 케이크 그림|설명하는 내용과 관련 있는 그림을 골라요."]}],
 d:['대들보','서까래','되새기다','왕진 가방','자동차 번호판','신세가 처량했다.','태권도의 기본 동작','옭아매는 마법의 힘','영롱한 소리를 뿜어냈다.','글자가 예사롭지 않았다.'],
 w:'유창하게=막힘없이 자연스럽게|분위기=장면에서 느껴지는 느낌|발음=말소리를 내는 것|발표=여러 사람 앞에서 말하는 것|띄어 읽기=알맞은 곳에서 쉬어 읽기|장면=이야기에서 일이 벌어지는 모습'},
{ul:'3단원',t:'정확하게 글을 써요',k:'출처 확인하기, 이어 주는 말, 순서를 설명하는 글',i:'✏️',
 r:'<b>출처</b>는 자료를 가져온 곳이에요. 다른 사람이 만든 자료를 쓸 때는 출처를 꼭 밝혀요.<br>출처를 확인하면 내용이 <b>믿을 만한지</b> 알 수 있어요.<br><b>이어 주는 말</b><br>그리고: 비슷한 내용을 이어요. · 그러나, 하지만: 반대되는 내용을 이어요.<br>그래서: 앞의 일 때문에 생긴 결과를 이어요. · 왜냐하면: 까닭을 말해요.',
 p:'앞 문장과 뒤 문장이 <b>비슷한지, 반대인지, 까닭과 결과인지</b> 살펴봐요.<br>순서를 설명하는 글은 ‘먼저, 다음으로, 마지막으로’나 ‘첫째, 둘째’를 써서 차례가 잘 드러나게 써요.',
 c:["자료의 출처란 무엇일까요?|자료를 가져온 곳|글을 쓴 날씨|글의 길이|글씨의 크기|출처는 자료가 어디에서 나왔는지 알려 줘요.",
  "글을 읽을 때 출처를 확인하면 좋은 점은 무엇일까요?|내용이 믿을 만한지 확인할 수 있다|글을 더 빨리 읽을 수 있다|글씨가 더 잘 보인다|글이 재미있어진다|출처를 보면 믿을 수 있는 자료인지 알 수 있어요.",
  "다른 사람이 만든 자료를 내 글에 쓸 때 어떻게 해야 할까요?|출처를 밝힌다|내가 만든 것처럼 쓴다|조금 바꾸어 몰래 쓴다|출처를 지운다|다른 사람의 자료를 쓸 때는 출처를 밝혀야 해요.",
  "일의 순서를 설명하는 글에 쓰면 좋은 말은 무엇일까요?|먼저, 다음으로, 마지막으로|아마, 혹시, 어쩌면|그런데, 글쎄, 뭐|와, 우아, 어머|차례를 나타내는 말을 쓰면 순서가 잘 드러나요.",
  "순서나 방법을 설명하는 글에 쓸 내용을 정할 때 생각할 점은 무엇일까요?|읽는 사람과 글을 쓰는 목적|종이의 색깔|연필의 길이|글을 쓰는 방의 크기|누가 읽는지, 왜 쓰는지 생각하고 내용을 정해요.",
  "앞의 내용과 반대되는 내용을 이어 줄 때 쓰는 말은 무엇일까요?|그러나|그리고|그래서|왜냐하면|반대되는 내용은 ‘그러나’, ‘하지만’으로 이어요."],
 ox:["글에 쓸 자리가 모자라면 자료의 출처는 쓰지 않아도 된다.|X|다른 사람의 자료를 쓸 때는 언제나 출처를 밝혀요.","출처를 알면 그곳에서 관련 있는 정보를 더 찾아볼 수 있다.|O|자료를 가져온 곳에서 더 많은 정보를 찾을 수 있어요.","‘그래서’는 앞의 일 때문에 생긴 결과를 이어 주는 말이다.|O|비가 왔다. 그래서 우산을 썼다.","순서를 설명하는 글은 차례를 뒤섞어 써야 재미있다.|X|일의 차례대로 써야 읽는 사람이 따라 할 수 있어요."],
 ap:[{fill:["비가 왔습니다. ___ 소풍은 취소되지 않았습니다.|그러나|그래서|왜냐하면","배가 고팠습니다. ___ 빵을 먹었습니다.|그래서|그러나|왜냐하면","나는 축구를 좋아합니다. ___ 농구도 좋아합니다.|그리고|그러나|왜냐하면","우산을 챙겼습니다. ___ 비가 온다고 했기 때문입니다.|왜냐하면|그래서|그러나","열심히 연습했습니다. ___ 대회에서 상을 받았습니다.|그래서|그러나|왜냐하면","동생은 키가 작습니다. ___ 달리기는 아주 빠릅니다.|하지만|그래서|왜냐하면","손을 씻었습니다. ___ 간식을 먹었습니다.|그리고|그러나|왜냐하면","늦잠을 잤습니다. ___ 학교에 지각했습니다.|그래서|하지만|왜냐하면"],inst:'빈칸에 알맞은 이어 주는 말을 고르세요.'},
  {seq:["종이를 반으로 접었다가 편다|위쪽 두 모서리를 가운데 선에 맞추어 접는다|전체를 반으로 접는다|양쪽 날개를 아래로 접는다","손에 물을 묻힌다|비누로 거품을 낸다|손바닥과 손등을 문지른다|흐르는 물에 헹군다|수건으로 물기를 닦는다","화분에 흙을 담는다|씨앗을 넣고 흙을 덮는다|물을 준다|햇빛이 드는 곳에 둔다"],names:['종이비행기 접기','손 씻기','씨앗 심기'],inst:'일의 순서에 맞게 차례대로 눌러 보세요.'},
  {pas:'2023년 질병관리청의 자료에 따르면, 자전거를 탈 때 안전모를 쓰면 머리를 다치는 일을 크게 줄일 수 있다고 합니다. 그래서 자전거를 탈 때에는 안전모를 꼭 써야 합니다.',q:["이 글에서 활용한 자료의 출처는 어디일까요?|질병관리청|자전거 가게|우리 반 친구|글쓴이의 일기장|‘질병관리청의 자료에 따르면’에서 출처를 알 수 있어요.","이 글에서 말하려는 것은 무엇일까요?|자전거를 탈 때 안전모를 써야 한다|자전거를 타면 안 된다|안전모는 무겁다|자전거는 빠르다|마지막 문장에 글쓴이의 생각이 드러나요."]}],
 d:['점자','감염병','부딪히다','반포하다','자전거 안전모','한글을 창제하다.','세계 손 씻기의 날','손바닥을 문지릅니다.','내가 날린 종이비행기','연우는 진료를 받고 왔다.'],
 w:'출처=자료를 가져온 곳|그리고=비슷한 내용을 이어 주는 말|그러나=반대되는 내용을 이어 주는 말|그래서=결과를 이어 주는 말|왜냐하면=까닭을 말할 때 쓰는 말|설명하는 글=어떤 것을 알기 쉽게 풀어 쓴 글'},
{ul:'매체',t:'온라인 상황에서 글을 써요',k:'초상권과 개인 정보 보호, 온라인 글쓰기',i:'💻',
 r:'<b>초상권</b>은 내 얼굴이나 모습이 허락 없이 찍히거나 쓰이지 않을 권리예요.<br><b>개인 정보</b>는 이름, 집 주소, 전화번호, 학교처럼 나를 알 수 있는 정보예요.<br>온라인에 쓴 글은 <b>많은 사람이 볼 수 있고 빠르게 퍼져요</b>. 그래서 읽는 사람을 존중하는 말로 써요.',
 p:'온라인에 글이나 사진을 올리기 전에 <b>누가 보는지</b>, <b>다른 사람의 모습이나 정보가 들어 있지 않은지</b> 한 번 더 살펴봐요.',
 c:["초상권이란 무엇일까요?|내 얼굴이나 모습이 허락 없이 쓰이지 않을 권리|사진을 잘 찍을 권리|그림을 그릴 권리|인터넷을 오래 쓸 권리|초상권은 내 모습을 지킬 권리예요.",
  "개인 정보에 해당하는 것은 무엇일까요?|집 주소와 전화번호|오늘의 날씨|좋아하는 계절|교과서의 쪽수|주소와 전화번호는 나를 알 수 있는 개인 정보예요.",
  "친구와 함께 찍은 사진을 온라인에 올리려면 먼저 무엇을 해야 할까요?|친구에게 올려도 되는지 물어본다|그냥 바로 올린다|친구 얼굴에 낙서를 한다|다른 친구에게 물어본다|친구의 초상권을 지키려면 허락을 받아야 해요.",
  "온라인에서 글을 쓸 때 알맞은 태도는 무엇일까요?|읽는 사람을 존중하는 말을 쓴다|얼굴이 안 보이니 아무 말이나 쓴다|다른 사람인 척하고 쓴다|확인하지 않은 소문을 퍼뜨린다|온라인에서도 상대를 존중하며 써요.",
  "모르는 사람이 온라인에서 집 주소를 물어보면 어떻게 해야 할까요?|알려 주지 않고 어른께 말씀드린다|친절하게 알려 준다|친구의 주소를 대신 알려 준다|전화번호도 함께 알려 준다|개인 정보는 모르는 사람에게 알려 주지 않아요.",
  "온라인에 올린 글의 특징으로 알맞은 것은 무엇일까요?|많은 사람이 보고 빠르게 퍼질 수 있다|나만 볼 수 있다|금방 저절로 사라진다|아무도 읽지 않는다|한번 올린 글은 널리 퍼질 수 있어서 신중해야 해요."],
 ox:["내가 찍은 사진이면 친구가 나와도 마음대로 올려도 된다.|X|사진에 나온 사람에게 허락을 받아야 해요.","온라인 게시 글을 쓸 때에는 읽는 사람을 생각하며 쓴다.|O|여러 사람이 읽는 글이므로 예의를 지켜 써요.","비밀번호는 친한 친구에게는 알려 주어도 괜찮다.|X|비밀번호는 누구에게도 알려 주지 않아요.","온라인에 글을 올리기 전에 내용을 다시 읽어 보는 것이 좋다.|O|올리기 전에 잘못된 내용이 없는지 살펴봐요."],

function korQuiz(u,l){
  const pas=t=>'<div class="mtxt kpas">'+t+'</div>';
  const MCQ=(s,stim)=>{ const a=s.split('|'), ex=a.pop(), q=a.shift(), ans=a[0]; return {t:'c',inst:stim?q:'알맞은 답을 고르세요.',stim:stim||MTX(q),ch:shuffle(a).map(o=>({h:'<span class="mth kch">'+o+'</span>',ok:o===ans})),ex}; };

  const DIC=t=>({t:'w',exact:1,loose:1,nosay:!canSpeak,inst:canSpeak?'🔊 버튼을 눌러 소리를 듣고 받아써 보세요.':'글자를 잘 보고 그대로 써 보세요.',w:{en:t,ko:canSpeak?'소리를 듣고 써요':t,nopic:1,say:t},ex:t});
  const POOL2=gs=>{ const AP=[]; gs.forEach(g=>{
    if(g.pas) g.q.forEach(s=>AP.push(()=>MCQ(s,pas(g.pas))));
    if(g.fill) g.fill.forEach(s=>AP.push(()=>{ const a=s.split('|'); return {t:'c',inst:g.inst,stim:MTX(a[0]),ch:shuffle(a.slice(1)).map(o=>({h:'<span class="mth kch">'+o+'</span>',ok:o===a[1]})),ex:a[0].replace('___',a[1])}; }));
    if(g.seq) g.seq.forEach((s,k)=>AP.push(()=>({t:'o',sep:'|',inst:'<b>'+g.names[k]+'</b> '+g.inst,s,ex:s.split('|').map((x,n)=>(n+1)+'. '+x).join(' → ')})));
    if(g.sit) g.sit.forEach(s=>AP.push(()=>{ const a=s.split('|'); return {t:'c',inst:g.inst,stim:MTX(a[0]),ch:shuffle(a.slice(1)).map(o=>({h:'<span class="mth kch">'+o+'</span>',ok:o===a[1]})),ex:a[1]}; }));
    if(g.pick) g.pick.forEach(s=>AP.push(()=>{ const a=s.split('|'); return {t:'c',inst:g.inst,stim:'',ch:shuffle(a).map(o=>({h:'<span class="mth kch">'+o+'</span>',ok:o===a[0]})),ex:a[0]}; }));
    if(g.pair){ const ps=g.pair.map(x=>x.split('=')); ps.forEach(p=>AP.push(()=>({t:'c',inst:g.inst,stim:MLN('‘'+p[0]+'’의 높임말'),ch:shuffle([p,...pick(ps.filter(x=>x!==p),3)]).map(o=>({h:'<span class="mth">'+o[1]+'</span>',ok:o===p})),ex:p[0]+' → '+p[1]}))); }
    if(g.cls) g.items.forEach(s=>AP.push(()=>{ const a=s.split('='), k=+a[1]; return {t:'c',inst:g.inst,stim:a[0].length>8?MTX(a[0]):MLN(a[0]),ch:g.cls.map((c,n)=>({h:'<span class="mth kch">'+c+'</span>',ok:n===k})),ex:'‘'+a[0]+'’ → '+g.cls[k]}; }));
    if(g.base) g.base.forEach(s=>AP.push(()=>{ const a=s.split('='); return {t:'w',exact:1,nosay:1,inst:g.inst,w:{en:a[1],ko:a[0]+' → ?',nopic:1,say:a[1]},ex:a[0]+'의 기본형은 '+a[1]}; }));
    if(g.dict) for(let k=0;k<6;k++) AP.push(()=>{ const ws=pick(g.dict,4).sort(); return {t:'o',sep:'|',inst:g.inst,s:ws.join('|'),ex:ws.join(' → ')}; });
  }); return AP; };
  const AP=POOL2(u.ap), AP2=u.ap2?POOL2(u.ap2):[], ap=n=>pick(AP,n).map(f=>f()), ap2=n=>{ const a=pick(AP2,n).map(f=>f()); return a.length<n?a.concat(pick(u.ox,Math.min(u.ox.length,n-a.length)).map(OXQ)):a; };
  /* 뜻을 보고 낱말 쓰기(과학, 사회)와 받아쓰기 문장 만들기(국어) */

}

 ap2:[{pas:'나무 막대를 모양이 다른 여러 그릇에 차례로 옮겨 담아 보았습니다.',q:["실험 결과로 알맞은 것은 무엇일까요?|나무 막대의 모양과 크기가 변하지 않는다|나무 막대가 그릇 모양으로 변한다|나무 막대가 그릇을 가득 채운다|나무 막대가 점점 작아진다|고체는 담는 그릇이 바뀌어도 모양과 부피가 변하지 않아요.","이 실험으로 알 수 있는 나무 막대의 상태는 무엇일까요?|고체|액체|기체|알 수 없다|모양과 부피가 일정하므로 고체예요."]},
  {pas:'주스를 모양이 다른 컵에 차례로 옮겨 담은 뒤, 처음에 담았던 컵에 다시 옮겨 담았습니다.',q:["주스의 모양은 어떻게 될까요?|담는 컵의 모양에 따라 변한다|어느 컵에서나 똑같다|공처럼 둥글게 뭉친다|컵 밖으로 퍼져 나간다|액체는 담는 그릇에 따라 모양이 변해요.","처음 컵에 다시 담았을 때 주스의 높이는 어떻게 될까요?|처음과 같다|처음보다 높아진다|처음보다 낮아진다|알 수 없다|액체의 부피는 변하지 않으므로 높이가 처음과 같아요."]},
  {pas:'물이 담긴 수조에 페트병 뚜껑을 띄우고, 바닥에 구멍이 없는 플라스틱 컵을 뒤집어 뚜껑을 덮은 채 수조 바닥까지 밀어 넣었습니다.',q:["페트병 뚜껑은 어떻게 될까요?|컵과 함께 아래로 내려간다|물 위에 그대로 떠 있다|컵 위로 튀어 오른다|물에 녹는다|컵 안의 공기가 공간을 차지해서 물을 밀어내요.","이 실험으로 알 수 있는 공기의 성질은 무엇일까요?|공기는 공간을 차지한다|공기는 눈에 보인다|공기는 맛이 있다|공기는 딱딱하다|컵 안에 공기가 있어서 물이 들어오지 못해요.","바닥에 구멍이 뚫린 컵으로 하면 어떻게 될까요?|공기가 빠져나가 컵 안으로 물이 들어온다|뚜껑이 더 깊이 내려간다|컵이 떠오른다|아무 일도 일어나지 않는다|구멍으로 공기가 빠져나가면 그 자리에 물이 들어와요."]},
  {pas:'공기 주입 마개를 끼운 페트병의 무게를 잰 다음, 마개를 여러 번 눌러 공기를 더 넣고 무게를 다시 쟀습니다.',q:["페트병의 무게는 어떻게 될까요?|공기를 넣은 뒤가 더 무겁다|공기를 넣은 뒤가 더 가볍다|변하지 않는다|무게를 잴 수 없다|공기를 더 넣은 만큼 무게가 늘어나요.","이 실험으로 알 수 있는 것은 무엇일까요?|공기는 무게가 있다|공기는 무게가 없다|공기는 색깔이 있다|공기는 액체이다|기체인 공기에도 무게가 있어요."]},
  {pas:'주사기 두 개를 비닐관으로 연결하고, 한쪽 주사기의 손잡이를 밀었습니다.',q:["다른 쪽 주사기의 손잡이는 어떻게 될까요?|밀려 나온다|안으로 들어간다|움직이지 않는다|빙글빙글 돈다|한쪽의 공기가 비닐관을 지나 다른 쪽으로 이동해요.","이 실험으로 알 수 있는 공기의 성질은 무엇일까요?|공기는 다른 곳으로 이동할 수 있다|공기는 이동하지 못한다|공기는 고체이다|공기는 눈에 보인다|공기는 한 곳에서 다른 곳으로 이동해요."]}],

{t:'지구와 바다',k:'지구 표면의 모습, 육지와 바다, 밀물과 썰물, 갯벌',i:'🌊',
 r:'지구 표면에는 <b>산, 들, 강, 호수, 사막, 바다</b> 같은 여러 모습이 있어요.<br>지구 표면은 <b>바다가 육지보다 넓어요</b>.<br>지구에 있는 물은 대부분 <b>바닷물</b>이에요. 바닷물은 짠맛이 나서 마시기 어려워요. 육지의 물(강, 호수)은 짜지 않아요.<br>바닷물이 육지 쪽으로 들어오는 것을 <b>밀물</b>, 바다 쪽으로 빠져나가는 것을 <b>썰물</b>이라고 해요.<br>썰물 때 드러나는 넓고 평평한 땅이 <b>갯벌</b>이에요.',
 p:'<b>밀물</b>은 물이 밀려 들어와서 바닷물의 높이가 높아지고, <b>썰물</b>은 물이 빠져나가서 낮아져요.<br>갯벌은 많은 생물이 사는 곳이고, 오염된 물을 깨끗하게 해 줘요.',
 how2:'실험에서 <b>남은 것, 달라진 것</b>을 살펴봐요. 바닷물을 가열해 물을 증발시키면 하얀 알갱이가 남아요.',
 c:["지구 표면에서 더 넓은 곳은 어디일까요?|바다|육지|사막|산|지구 표면은 바다가 육지보다 넓어요.",
  "지구에 있는 물의 대부분을 차지하는 것은 무엇일까요?|바닷물|강물|호수의 물|빗물|지구의 물은 대부분 바닷물이에요.",
  "바닷물을 그대로 마시기 어려운 까닭은 무엇일까요?|짠맛이 나기 때문에|너무 차갑기 때문에|색깔이 파랗기 때문에|양이 적기 때문에|바닷물에는 소금이 녹아 있어 짠맛이 나요.",
  "바닷물이 육지 쪽으로 밀려 들어오는 것을 무엇이라고 할까요?|밀물|썰물|갯벌|파도|물이 밀려 들어오는 것이 밀물이에요.",
  "바닷물이 바다 쪽으로 빠져나가는 것을 무엇이라고 할까요?|썰물|밀물|홍수|소나기|물이 빠져나가는 것이 썰물이에요.",
  "썰물 때 드러나는 넓고 평평한 땅을 무엇이라고 할까요?|갯벌|사막|절벽|들|갯벌은 썰물 때 모습을 드러내요.",
  "갯벌이 하는 일로 알맞은 것은 무엇일까요?|여러 생물이 살 곳을 마련해 준다|바닷물을 모두 없앤다|비를 내리게 한다|산을 높게 만든다|갯벌에는 조개, 게, 갯지렁이 같은 많은 생물이 살아요.",
  "지구 표면의 모습으로 알맞지 않은 것은 무엇일까요?|달의 표면|산|강|바다|달의 표면은 지구 표면의 모습이 아니에요."],

 ap:[{cls:['밀물','썰물'],items:["바닷물이 육지 쪽으로 밀려 들어온다.=0","갯벌이 바닷물에 잠긴다.=0","바닷물의 높이가 높아진다.=0","바닷물이 바다 쪽으로 빠져나간다.=1","갯벌이 넓게 드러난다.=1","바닷물의 높이가 낮아진다.=1","갯벌에 나가 조개를 캘 수 있다.=1"],inst:'밀물일까요, 썰물일까요?'},
  {cls:['육지의 물','바닷물'],items:["강물=0","호수의 물=0","계곡물=0","짠맛이 나지 않는다.=0","짠맛이 난다.=1","지구에 있는 물의 대부분을 차지한다.=1","증발시키면 하얀 소금 알갱이가 남는다.=1"],inst:'육지의 물일까요, 바닷물일까요?'},
  {sit:["갯벌 체험을 가려고 합니다. 언제 가야 할까요?|썰물 때|밀물 때|한밤중","갯벌에서 볼 수 있는 생물은 무엇일까요?|게와 조개|낙타와 선인장|펭귄과 북극곰","지구본에서 파란색으로 넓게 칠해진 곳은 무엇을 나타낼까요?|바다|육지|사막","갯벌을 보호하는 방법으로 알맞은 것은 무엇일까요?|쓰레기를 버리지 않고 생물을 함부로 잡지 않는다|갯벌에 쓰레기를 묻는다|갯벌의 생물을 모두 잡아 온다","모래가 넓게 쌓여 있어 여름에 사람들이 물놀이하러 많이 가는 곳은 어디일까요?|바닷가 모래밭|갯벌|바닷가 절벽"],inst:'알맞은 답을 고르세요.'}],
 ap2:[{pas:'지구 표면을 100칸으로 나눈 그림에서 육지 칸과 바다 칸을 세어 보았더니, 바다는 약 70칸이고 육지는 약 30칸이었습니다.',q:["육지와 바다 중 더 넓은 곳은 어디일까요?|바다|육지|서로 같다|알 수 없다|바다 칸이 육지 칸보다 많아요.","바다의 넓이는 육지의 넓이와 견주어 어떨까요?|육지의 2배보다 넓다|육지의 반이다|육지와 같다|육지보다 조금 좁다|70칸은 30칸의 2배인 60칸보다 많아요."]},
  {pas:'강물과 바닷물을 각각 증발 접시에 조금씩 넣고 가열하여 물을 모두 증발시켰습니다.',q:["바닷물을 넣은 증발 접시에는 무엇이 남을까요?|하얀 알갱이|파란 물|검은 돌|아무것도 남지 않는다|바닷물에 녹아 있던 소금이 하얀 알갱이로 남아요.","이 실험으로 알 수 있는 것은 무엇일까요?|바닷물에는 짠맛이 나는 물질이 녹아 있다|강물이 바닷물보다 짜다|바닷물은 증발하지 않는다|강물과 바닷물은 똑같다|바닷물에는 소금 같은 물질이 녹아 있어요."]},
  {pas:'같은 바닷가를 아침과 오후에 찍은 사진을 비교했습니다. 아침 사진에는 바닷물이 가득 차 있었고, 오후 사진에는 넓은 갯벌이 드러나 있었습니다.',q:["오후에 일어난 일은 무엇일까요?|썰물이 되어 바닷물이 빠져나갔다|밀물이 되어 바닷물이 들어왔다|비가 많이 내렸다|바닷물이 모두 증발했다|바닷물이 빠져나가 갯벌이 드러났어요.","바닷물의 높이가 더 높은 때는 언제일까요?|아침|오후|둘 다 같다|알 수 없다|바닷물이 가득 차 있던 아침이 밀물 때예요."]}],

{t:'소리의 성질',k:'소리와 떨림, 소리의 세기와 높낮이, 소리의 전달, 소음',i:'🔔',
 r:'소리가 나는 물체는 <b>떨려요</b>. 떨림을 멈추면 소리도 멈춰요.<br>물체가 <b>크게 떨리면 큰 소리</b>, <b>작게 떨리면 작은 소리</b>가 나요.<br>소리에는 <b>높은 소리와 낮은 소리</b>가 있어요. 실로폰은 짧은 음판이 높은 소리, 긴 음판이 낮은 소리를 내요.<br>소리는 <b>공기(기체), 물(액체), 나무나 실(고체)</b>을 통해 전달돼요.<br>사람의 기분을 좋지 않게 하거나 건강을 해치는 시끄러운 소리를 <b>소음</b>이라고 해요.',
 p:'<b>소리의 세기</b>(크다, 작다)와 <b>소리의 높낮이</b>(높다, 낮다)는 서로 다른 것이에요. 북을 세게 치면 큰 소리가 나지만 높은 소리가 되지는 않아요.',
 how2:'소리가 날 때 <b>무엇이 떨리는지</b> 찾아봐요. 세게 칠 때와 약하게 칠 때, 긴 것과 짧은 것을 견주어 봐요.',
 c:["소리가 나는 물체의 공통점은 무엇일까요?|떨린다|차갑다|반짝인다|무겁다|소리가 나는 물체는 모두 떨려요.",

  "실로폰에서 가장 높은 소리가 나는 음판은 무엇일까요?|가장 짧은 음판|가장 긴 음판|가운데 음판|모두 같다|짧은 음판일수록 높은 소리가 나요.",

 ox:["소리가 나는 스피커에 손을 대면 떨림을 느낄 수 있다.|O|소리가 나는 물체는 떨려요.","북을 약하게 치면 북이 작게 떨려 작은 소리가 난다.|O|작게 떨리면 작은 소리가 나요.","소리는 공기를 통해서만 전달된다.|X|소리는 물이나 나무 같은 액체와 고체를 통해서도 전달돼요.","실로폰의 긴 음판은 짧은 음판보다 높은 소리가 난다.|X|긴 음판은 낮은 소리가 나요.","공동 주택에서 밤늦게 뛰는 것은 이웃에게 소음이 될 수 있다.|O|다른 사람을 불편하게 하는 소리는 소음이에요."],

 ap2:[{pas:'소리굽쇠를 고무망치로 쳐서 소리를 낸 다음, 물이 담긴 수조의 물 표면에 살짝 대 보았습니다.',q:["어떤 일이 일어날까요?|물이 튄다|물이 언다|물 색깔이 변한다|아무 일도 일어나지 않는다|떨리는 소리굽쇠가 물을 튀게 해요.","이 실험으로 알 수 있는 것은 무엇일까요?|소리가 나는 물체는 떨린다|소리가 나는 물체는 뜨겁다|소리굽쇠는 물에 뜬다|물은 소리를 없앤다|소리가 나는 물체의 떨림을 눈으로 확인할 수 있어요."]},

  {pas:'길이가 다른 실로폰 음판을 같은 세기로 차례로 쳐 보았습니다.',q:["음판의 길이가 짧아질수록 소리는 어떻게 될까요?|높아진다|낮아진다|커진다|변하지 않는다|짧은 음판일수록 높은 소리가 나요.","가장 낮은 소리를 내려면 어느 음판을 쳐야 할까요?|가장 긴 음판|가장 짧은 음판|가운데 음판|어느 것이든 같다|긴 음판일수록 낮은 소리가 나요."]},
  {pas:'소리가 나는 작은 스피커를 통 안에 넣고, 통 안의 공기를 조금씩 빼 보았습니다.',q:["공기를 뺄수록 스피커 소리는 어떻게 들릴까요?|점점 작게 들린다|점점 크게 들린다|점점 높게 들린다|변하지 않는다|소리를 전달하는 공기가 줄어들어 소리가 작게 들려요.","이 실험으로 알 수 있는 것은 무엇일까요?|소리는 공기를 통해 전달된다|소리는 공기가 없어야 잘 들린다|스피커는 떨리지 않는다|통은 소리를 크게 한다|소리가 전달되려면 공기 같은 물질이 필요해요."]}],

{t:'감염병과 건강한 생활',k:'감염병의 종류, 퍼지는 방법, 예방하는 방법',i:'😷',
 r:'<b>감염병</b>은 세균이나 바이러스처럼 병을 일으키는 아주 작은 것이 몸에 들어와 생기고, 다른 사람에게 옮을 수 있는 병이에요. 감기, 독감, 식중독, 유행성 눈병이 있어요.<br>감염병은 <b>기침이나 재채기할 때 나오는 침방울</b>, <b>오염된 손이나 물건</b>, <b>오염된 물과 음식</b>, <b>모기 같은 동물</b>을 통해 퍼져요.<br>예방하려면 <b>손을 깨끗이 씻고, 기침할 때 옷소매로 가리고, 마스크를 쓰고, 자주 환기하고, 예방접종</b>을 해요.',
 p:'감염병은 <b>다른 사람에게 옮는 병</b>이에요. 넘어져서 생긴 상처처럼 옮지 않는 것은 감염병이 아니에요.',
 how2:'실험에서 <b>가짜 세균(형광 물질)이 어디로 옮겨 갔는지</b> 찾아봐요. 그것이 감염병이 퍼지는 길이에요.',
 c:["감염병이란 무엇일까요?|세균이나 바이러스가 몸에 들어와 생기고 다른 사람에게 옮을 수 있는 병|넘어져서 다친 상처|음식을 많이 먹어서 생긴 배탈|운동을 많이 해서 생긴 근육통|감염병은 다른 사람에게 옮을 수 있어요.",
  "감염병에 해당하는 것은 무엇일까요?|독감|골절|멍|화상|독감은 바이러스 때문에 생기고 다른 사람에게 옮아요.",

  "기침이 나올 때 알맞은 행동은 무엇일까요?|옷소매로 입과 코를 가린다|손바닥으로 가리고 그대로 둔다|친구 쪽을 보고 한다|아무것도 가리지 않는다|옷소매로 가리면 침방울이 퍼지는 것을 막을 수 있어요.",
  "감염병을 예방하는 방법으로 알맞지 않은 것은 무엇일까요?|씻지 않은 손으로 눈과 코를 만진다|비누로 손을 꼼꼼히 씻는다|자주 환기를 한다|예방접종을 한다|씻지 않은 손으로 얼굴을 만지면 세균이 몸에 들어올 수 있어요.",
  "감염병이 위험한 까닭은 무엇일까요?|짧은 시간에 많은 사람에게 퍼질 수 있기 때문에|한 사람만 걸리기 때문에|금방 저절로 사라지기 때문에|동물만 걸리기 때문에|감염병은 빠르게 퍼져 많은 사람을 아프게 할 수 있어요.",
  "감염병에 걸리지 않도록 미리 주사를 맞는 것을 무엇이라고 할까요?|예방접종|환기|소독|진료|예방접종을 하면 감염병을 예방하는 데 도움이 돼요.",
  "식중독을 예방하는 방법으로 알맞은 것은 무엇일까요?|음식을 충분히 익혀 먹는다|상한 음식도 아까우니 먹는다|손을 씻지 않고 음식을 먹는다|음식을 오래 밖에 둔다|음식을 익혀 먹고 손을 씻으면 식중독을 예방할 수 있어요."],
 ox:["손은 물로만 잠깐 헹구어도 충분히 깨끗해진다.|X|비누로 30초 이상 꼼꼼히 씻어야 해요.","감염병에 걸렸을 때는 다른 사람에게 옮기지 않도록 집에서 쉬는 것이 좋다.|O|아플 때 쉬면 나도 빨리 낫고 다른 사람에게도 옮기지 않아요.","마스크를 쓰면 침방울이 퍼지는 것을 줄일 수 있다.|O|마스크는 침방울을 막아 줘요.","감염병은 사람 사이에서만 퍼지고 모기 같은 동물과는 관계가 없다.|X|모기 같은 동물을 통해 퍼지는 감염병도 있어요.","교실 창문을 열어 자주 환기하면 감염병 예방에 도움이 된다.|O|환기를 하면 공기 중의 바이러스가 밖으로 나가요."],

  {cls:['침방울','오염된 손과 물건','오염된 음식과 물','모기 같은 동물'],items:["기침하는 친구 옆에서 이야기를 나누었다.=0","재채기를 가리지 않고 했다.=0","씻지 않은 손으로 눈을 비볐다.=1","여러 사람이 만진 문손잡이를 잡고 손을 씻지 않았다.=1","덜 익은 음식을 먹었다.=2","끓이지 않은 더러운 물을 마셨다.=2","모기에게 물렸다.=3"],inst:'감염병이 무엇을 통해 퍼질까요?'},
  {seq:["흐르는 물에 손을 적신다|비누로 거품을 낸다|손바닥, 손등, 손가락 사이를 꼼꼼히 문지른다|흐르는 물에 깨끗이 헹군다|수건으로 물기를 닦는다"],names:['손 씻기'],inst:'일의 순서에 맞게 차례대로 눌러 보세요.'},

 c:["사람들이 함께 살아가며 만들어 온 생활 방식을 무엇이라고 할까요?|문화|날씨|지도|인구|옷, 음식, 집, 말 등 생활 방식이 모두 문화예요.",
  "문화에 해당하지 않는 것은 무엇일까요?|비가 오는 날씨|명절에 먹는 음식|인사하는 방법|전통 옷|날씨는 사람이 만든 생활 방식이 아니에요.",
  "나라마다 문화가 서로 다른 까닭은 무엇일까요?|사는 곳의 환경과 살아온 역사가 다르기 때문에|사람들의 키가 다르기 때문에|이름이 다르기 때문에|나이가 다르기 때문에|환경과 역사에 따라 생활 방식이 달라져요.",
  "한쪽으로 치우친 생각을 무엇이라고 할까요?|편견|존중|배려|문화|편견은 제대로 알지 못한 채 한쪽으로 치우쳐 생각하는 것이에요.",
  "알맞은 까닭 없이 사람을 다르게 대하는 것을 무엇이라고 할까요?|차별|존중|이해|협동|차별은 사람을 공평하지 않게 대하는 것이에요.",
  "다른 문화를 대하는 태도로 알맞은 것은 무엇일까요?|나와 달라도 이해하고 존중한다|내 문화만 옳다고 생각한다|낯선 것은 무조건 싫어한다|다른 문화를 놀린다|다른 것은 틀린 것이 아니에요.",
  "여러 문화가 함께하면 좋은 점은 무엇일까요?|다양한 음식과 놀이, 생각을 경험할 수 있다|모두 똑같아져서 편하다|새로운 것을 배울 수 없다|서로 만날 일이 없어진다|다양한 문화가 어울리면 생활이 더 풍요로워져요.",
  "우리 주변에서 볼 수 있는 다양한 문화의 모습은 무엇일까요?|여러 나라의 음식을 파는 식당|모두 같은 옷만 입는 사람들|한 가지 음식만 파는 시장|한 가지 말만 적힌 안내판|우리 주변에서 여러 나라의 음식과 글자를 볼 수 있어요."],
 ox:["내가 먹어 보지 않은 음식을 먹는다고 친구를 놀려도 된다.|X|음식 문화가 다를 뿐이에요. 놀리는 것은 차별이에요.","나라마다 인사하는 방법이 다를 수 있다.|O|악수, 절, 손 모으기 등 인사법은 여러 가지예요.","문화가 다르다는 것은 어느 한쪽이 틀렸다는 뜻이다.|X|다른 것은 틀린 것이 아니에요.","다른 문화를 가진 친구에게 궁금한 것을 예의 바르게 물어보는 것은 좋은 태도이다.|O|알아 가려는 노력이 존중의 시작이에요.","피부색이나 생김새가 다르다는 까닭으로 친구를 따돌려서는 안 된다.|O|생김새로 사람을 다르게 대하는 것은 차별이에요."],
 ap:[{cls:['존중하는 태도','편견이나 차별'],items:["친구 나라의 명절 이야기를 귀 기울여 듣는다.=0","처음 보는 음식을 먹어 보려고 한다.=0","우리말이 서툰 친구에게 천천히 말해 준다.=0","친구의 전통 옷이 멋지다고 말해 준다.=0","말투가 다르다고 흉내 내며 놀린다.=1","생김새가 다르다고 같이 놀지 않는다.=1","다른 나라 음식은 모두 이상하다고 말한다.=1","다른 나라에서 온 친구는 공부를 못할 거라고 생각한다.=1"],inst:'어떤 태도일까요?'},
  {cls:['옷','음식','집'],items:["한복=0","인도의 사리=0","베트남의 아오자이=0","김치=1","베트남 쌀국수=1","이탈리아 피자=1","한옥=2","몽골의 게르=2","눈과 얼음으로 지은 이글루=2"],inst:'무엇과 관련 있는 문화일까요?'},
  {sit:["새로 전학 온 친구가 우리말이 서툴러요.|천천히 말해 주고 함께 논다|못 알아듣는다고 놀린다|말을 걸지 않는다","친구가 믿는 종교 때문에 급식에서 못 먹는 음식이 있어요.|친구의 문화를 이해하고 존중한다|억지로 먹어 보라고 한다|이상하다고 친구들에게 말한다","친구가 손으로 밥을 먹는 나라에서 왔어요.|그 나라의 식사 문화라는 것을 이해한다|더럽다고 놀린다|같이 밥을 먹지 않는다","다른 나라의 명절에 대해 알고 싶어요.|책이나 친구에게 물어 알아본다|우리 명절이 아니라서 관심을 두지 않는다|우리와 다르니 틀렸다고 말한다"],inst:'이럴 때 알맞은 행동을 고르세요.'}],
 ap2:[{pas:'세계 여러 나라의 인사법을 조사했습니다. 악수를 하는 나라, 두 손을 모으고 고개를 숙이는 나라, 허리를 굽혀 절하는 나라, 서로 뺨을 가볍게 맞대는 나라가 있었습니다.',q:["이 자료에서 알 수 있는 것은 무엇일까요?|나라마다 인사하는 방법이 다르다|모든 나라의 인사법은 같다|인사는 하지 않는 것이 좋다|악수만이 바른 인사법이다|인사하는 방법도 문화에 따라 달라요.","다른 나라의 인사법을 대하는 태도로 알맞은 것은 무엇일까요?|그 나라의 문화로 이해하고 존중한다|우리와 다르니 틀렸다고 한다|이상하다고 웃는다|따라 하면 안 된다고 한다|다른 인사법도 그 나라의 소중한 문화예요."]},
  {pas:'더운 지역 사람들은 바람이 잘 통하는 얇은 옷을 입고, 추운 지역 사람들은 털이나 가죽으로 만든 두꺼운 옷을 입습니다. 비가 많이 오는 지역에서는 땅에서 높이 띄워 집을 짓기도 합니다.',q:["이 자료에서 알 수 있는 것은 무엇일까요?|사는 곳의 환경에 따라 생활 모습이 달라진다|모든 지역의 옷과 집은 같다|옷은 멋으로만 입는다|집은 어디에서나 똑같이 짓는다|환경에 알맞게 살아가면서 문화가 달라졌어요.","추운 지역 사람들이 두꺼운 옷을 입는 까닭은 무엇일까요?|추위를 막으려고|멋을 내려고|빨리 달리려고|비를 맞으려고|환경에 맞추어 옷을 입어요."]},
  {pas:'민수는 급식 시간에 돼지고기를 먹지 않는 친구를 보고 “편식하면 안 돼!”라고 말했습니다. 그런데 그 친구는 믿는 종교에서 돼지고기를 먹지 않도록 정해 두었기 때문에 먹지 않은 것이었습니다.',q:["민수의 생각에서 고쳐야 할 점은 무엇일까요?|까닭을 알아보지 않고 한쪽으로만 생각했다|친구에게 관심이 너무 많았다|급식을 너무 빨리 먹었다|목소리가 너무 작았다|제대로 알지 못하고 치우쳐 생각하는 것이 편견이에요.","민수가 할 수 있는 알맞은 행동은 무엇일까요?|친구의 문화를 이해하고 사과한다|계속 먹으라고 한다|다른 친구들에게 흉을 본다|친구와 떨어져 앉는다|다른 문화를 이해하고 존중하는 태도가 필요해요."]}],
 w:'문화=사람들이 만들어 온 생활 방식|편견=한쪽으로 치우친 생각|차별=까닭 없이 다르게 대하는 것|존중=소중하게 여기고 받아들이는 것|다양성=여러 가지가 서로 다른 것|의식주=옷과 음식과 집|인사법=인사하는 방법'},
{t:'교통과 통신의 변화',k:'옛날과 오늘날의 교통수단, 통신수단',i:'🚄',b:['2단원','2단원'],
 r:'<b>교통수단</b>은 사람이 이동하거나 물건을 옮길 때 쓰는 것이에요.<br>옛날: 사람, 동물, 바람의 힘을 이용했어요. <b>가마, 말, 소달구지, 뗏목, 돛단배</b><br>오늘날: 기계의 힘을 이용해요. <b>자동차, 지하철, 고속 열차, 배, 비행기</b><br><b>통신수단</b>은 소식이나 정보를 전할 때 쓰는 것이에요.<br>옛날: <b>봉수</b>(연기와 횃불), <b>파발</b>(사람이나 말이 달려서 전함), <b>방</b>(글을 써서 붙임), 편지<br>오늘날: <b>전화, 스마트폰, 인터넷, 텔레비전</b>',
 p:'<b>사람이나 물건을 옮기면 교통수단</b>, <b>소식을 전하면 통신수단</b>이에요.<br>옛날에는 사람, 동물, 자연의 힘을 썼고 오늘날에는 기계의 힘을 써요.',
 how2:'옛날과 오늘날을 <b>걸리는 시간, 한 번에 옮기는 양, 전할 수 있는 거리</b>로 견주어 봐요.',lead2:'자료를 읽고 견주어 봐요.',
 c:["사람이 이동하거나 물건을 옮길 때 쓰는 것을 무엇이라고 할까요?|교통수단|통신수단|세시 풍속|문화|이동하거나 옮길 때 쓰는 것이 교통수단이에요.",
  "소식이나 정보를 전할 때 쓰는 것을 무엇이라고 할까요?|통신수단|교통수단|풍습|놀이|소식을 전할 때 쓰는 것이 통신수단이에요.",
  "옛날 교통수단의 특징으로 알맞은 것은 무엇일까요?|사람이나 동물, 바람의 힘을 이용했다|기계의 힘을 이용했다|매우 빨랐다|한 번에 수백 명을 태웠다|옛날에는 사람, 동물, 자연의 힘으로 움직였어요.",
  "옛날에 연기와 횃불로 위급한 소식을 전하던 통신수단은 무엇일까요?|봉수|파발|방|가마|낮에는 연기, 밤에는 횃불로 소식을 전했어요.",
  "옛날에 사람이 직접 달리거나 말을 타고 가서 소식을 전하던 통신수단은 무엇일까요?|파발|봉수|돛단배|뗏목|파발은 사람이나 말이 달려 문서를 전했어요.",
  "오늘날 교통수단이 옛날과 달라진 점은 무엇일까요?|더 빠르고 한 번에 많은 사람과 물건을 옮긴다|더 느려졌다|한 번에 한 사람만 탈 수 있다|동물의 힘으로만 움직인다|기계의 힘으로 빠르게 많이 옮겨요.",
  "통신수단의 발달로 달라진 생활 모습은 무엇일까요?|멀리 있는 사람과도 바로 소식을 주고받는다|소식을 전하는 데 며칠씩 걸린다|편지만 주고받는다|가까운 사람과만 이야기한다|전화와 인터넷으로 바로 소식을 주고받아요.",
  "교통의 발달로 생긴 문제는 무엇일까요?|교통사고와 공기 오염이 늘어났다|먼 곳에 갈 수 없게 되었다|물건을 옮길 수 없게 되었다|이동 시간이 길어졌다|자동차가 늘어나 사고와 환경 오염 문제가 생겼어요."],
 ox:["가마는 옛날 사람들이 이용한 교통수단이다.|O|가마는 사람이 메고 옮기는 옛날 교통수단이에요.","봉수는 물건을 옮기던 교통수단이다.|X|봉수는 연기와 횃불로 소식을 전한 통신수단이에요.","오늘날에는 고속 열차를 타고 먼 곳도 빠르게 갈 수 있다.|O|교통의 발달로 이동 시간이 크게 줄었어요.","스마트폰은 통신수단이다.|O|스마트폰으로 전화하고 문자와 영상을 주고받아요.","통신수단이 발달하면 좋은 점만 있고 문제는 생기지 않는다.|X|지나치게 오래 쓰거나 개인 정보가 새어 나가는 문제가 생길 수 있어요."],

  {pas:'옛날에 한양에서 부산까지 걸어서 가려면 보름쯤 걸렸습니다. 오늘날에는 고속 열차를 타면 약 두 시간 반 만에 갈 수 있습니다.',q:["이 자료에서 알 수 있는 것은 무엇일까요?|교통의 발달로 이동 시간이 크게 줄었다|옛날이 오늘날보다 빨랐다|이동 시간은 변하지 않았다|부산이 더 멀어졌다|보름이 걸리던 길을 몇 시간 만에 가요.","교통이 발달해서 달라진 생활 모습은 무엇일까요?|먼 곳으로 하루 만에 다녀올 수 있다|먼 곳에는 갈 수 없다|다른 지역의 물건을 살 수 없다|여행을 가는 사람이 없어졌다|이동이 빨라져 생활하는 범위가 넓어졌어요."]},
  {pas:'옛날에는 멀리 사는 친척에게 편지를 보내면 사람이 직접 걸어가서 전해 주었기 때문에 며칠에서 몇 달이 걸렸습니다. 오늘날에는 스마트폰으로 문자와 사진을 바로 보낼 수 있습니다.',q:["오늘날 통신수단의 좋은 점은 무엇일까요?|소식을 빠르게 주고받을 수 있다|소식이 늦게 전해진다|글자만 보낼 수 있다|가까운 곳에만 보낼 수 있다|멀리 있어도 바로 소식을 전해요.","스마트폰을 바르게 사용하는 방법은 무엇일까요?|사용 시간을 정하고 예의를 지켜 사용한다|걸어 다니면서 계속 본다|다른 사람의 사진을 함부로 보낸다|밤늦게까지 쉬지 않고 사용한다|편리한 만큼 바르게 사용하는 태도가 필요해요."]}],

  {pas:'단오는 음력 5월 5일로, 모내기를 끝내고 여름이 시작될 무렵입니다. 사람들은 창포를 삶은 물에 머리를 감고, 다가올 더위를 잘 이겨 내라고 서로 부채를 선물했습니다. 씨름과 그네뛰기도 즐겼습니다.',q:["단오에 부채를 선물한 까닭은 무엇일까요?|다가올 더위를 잘 이겨 내라고|추위를 막으라고|비를 피하라고|방을 꾸미라고|여름을 건강하게 보내기를 바라는 마음이에요.","단오에 즐긴 놀이는 무엇일까요?|씨름과 그네뛰기|강강술래|윷놀이|눈싸움|단오에는 씨름과 그네뛰기를 했어요.","이 자료에서 알 수 있는 것은 무엇일까요?|세시 풍속은 계절이나 농사와 관련이 있다|세시 풍속은 계절과 관계가 없다|단오는 겨울의 풍속이다|옛날에는 놀이가 없었다|모내기와 더위처럼 계절, 농사와 이어져 있어요."]},

    if(wr.length>=2){ const x=pick(wr,1)[0]; x.disabled=true; x.classList.add('out'); return '답이 아닌 것을 하나 지웠어요. 남은 것 중에서 골라 봐요.'; }

    if(n===1) return '이 낱말의 뜻: “'+q.w.ko+'”. 소리 내어 읽으면서 빠진 글자를 떠올려 봐요.';

/* 효과음: 파일 없이 브라우저에서 바로 만들어요. 시작할 때는 올라가는 세 음, 마칠 때는 짧은 팡파르 */
let AC=null, SND_OFF=false; try{ SND_OFF=localStorage.getItem('e3-snd')==='off'; }catch(e){}
const SFX={start:[[523,0,.13],[659,.11,.13],[784,.22,.24]],done:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.42],[784,.36,.42],[1319,.5,.5]]};
function sfx(name){
  if(SND_OFF) return;
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=AC||new C(); if(AC.state==='suspended') AC.resume(); const t=AC.currentTime+.02;
    SFX[name].forEach(n=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,t+n[1]); g.gain.linearRampToValueAtTime(.16,t+n[1]+.02); g.gain.exponentialRampToValueAtTime(.0001,t+n[1]+n[2]);
      o.connect(g); g.connect(AC.destination); o.start(t+n[1]); o.stop(t+n[1]+n[2]+.05); });
  }catch(e){}
}

   수학은 계산과 크기 비교, 국어·과학·사회는 초성과 분류, 영어는 듣기, 문법은 틀린 낱말 찾기, 한자는 뜻·소리와 한자어 */
const CHOS='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const CHO=t=>[...t].map(c=>{ const n=c.charCodeAt(0)-0xAC00; return n>=0&&n<11172?CHOS[Math.floor(n/588)]:c; }).join('');
function GAMES(u){
  if(u.math) return [['calc','⚡','번개 계산','60초 동안 계산 문제를 많이 풀어요'],['big','⚖️','더 큰 쪽 고르기','둘 중에서 더 큰 쪽을 빨리 골라요']];
  if(u.hanja) return [['flash','⚡','번개 한자','한자의 뜻과 소리를 빨리 골라요'],['build','🧩','한자어 만들기','풀이에 알맞은 한자어를 골라요']];
  if(u.gq) return [['fix','🔍','틀린 낱말 찾기','문장에서 틀린 낱말을 찾아 눌러요'],['blank','⚡','번개 빈칸','빈칸에 알맞은 말을 빨리 골라요']];
  if(u.kq) return [['cho','🔤','초성 퀴즈','초성을 보고 낱말을 맞혀요']].concat(u.ap.concat(u.ap2||[]).some(g=>g.cls)?[['sort','🧺','바구니에 담기','알맞은 바구니를 빨리 골라요']]:[]);
  return [['listen','🎧','듣고 고르기','소리를 듣고 뜻을 빨리 골라요'],['mean','⚡','번개 낱말','뜻을 보고 낱말을 빨리 골라요']];
}
function sprintQ(u,kind){
  const en=t=>'<span class="en">'+t+'</span>', mth=t=>'<span class="mth">'+t+'</span>', W=u.words;
  const four=(w,pool,key,f)=>{ const seen=new Set([key(w)]), o=[]; shuffle(pool).forEach(x=>{ if(o.length<3&&!seen.has(key(x))){ seen.add(key(x)); o.push(x); } }); return shuffle([w,...o]).map(x=>({h:f(x),ok:x===w})); };

      if(k==='div'){ const b=rnd(2,6), q=rnd(6,25); return {h:b*q+' ÷ '+b,v:q}; }
      if(k==='cir'){ const r=rnd(2,12); return Math.random()<.5?{h:'반지름이 '+r+' cm인 원',v:2*r}:{h:'지름이 '+2*r+' cm인 원',v:2*r}; }
      if(k==='fra'){ const x=rnd(1,14); return x>5&&x%5&&Math.random()<.5?{h:MX(Math.floor(x/5),x%5,5),v:x}:{h:FR(x,5),v:x}; }
      if(k==='mea'){ const x=rnd(11,49)*100, U=one([['L','mL'],['kg','g']]); return Math.random()<.5?{h:LM(x,U[0],U[1]),v:x,u:U[0]}:{h:x+' '+U[1],v:x,u:U[0]}; }
      const a=rnd(1,5), b=rnd(0,9); return Math.random()<.5?{h:'10이 '+a+'개, 1이 '+b+'개',v:a*10+b}:{h:String(a*10+b),v:a*10+b}; };
    let a=mk(), b=mk(), g=0; while((a.v===b.v||a.u!==b.u)&&g++<50) b=mk();
    const big=a.v>b.v?a:b;
    return {inst:'더 큰 쪽을 고르세요.',stim:'',ch:[a,b].map(x=>({h:mth(x.h),ok:x===big})),ex:(u.mk==='mul'||u.mk==='div'?a.h+' = '+a.v+', '+b.h+' = '+b.v:'크기를 같은 모양으로 바꾸어 견주어 봐요.')};
  }
  if(kind==='flash'){ const w=one(W); return Math.random()<.5?{inst:'한자의 뜻과 소리를 고르세요.',stim:MLN(hj(w.en,4)),ch:four(w,W,x=>x.ko,x=>x.ko),ex:w.en+' : '+w.ko}:{inst:'뜻과 소리에 알맞은 한자를 고르세요.',stim:MLN(w.ko),ch:four(w,W,x=>x.en,x=>hj(x.en)),ex:w.en+' : '+w.ko}; }
  if(kind==='build'){ const w=one(W), rev=[...w.hw].reverse().join(''), o=pick(W.filter(x=>x!==w),3).map(x=>x.hw), set=[w.hw]; [rev].concat(o).forEach(x=>{ if(set.length<4&&set.indexOf(x)<0) set.push(x); });
    return {inst:'풀이에 알맞은 한자어를 고르세요.',stim:MTX(w.hm)+'<div class="meter">읽기: '+w.hr+'</div>',ch:shuffle(set).map(x=>({h:hj(x),ok:x===w.hw})),ex:w.hw+'('+w.hr+') : '+w.hm}; }
  if(kind==='fix'){ const c=[]; u.items.forEach(x=>x.bad.forEach(b=>{ const A=x.full.split(' '), B=b.split(' '); if(A.length===B.length){ const d=B.map((t,k)=>t!==A[k]?k:-1).filter(k=>k>=0); if(d.length===1) c.push({x,B,k:d[0]}); } }));
    if(!c.length) return sprintQ(u,'blank');
    const p=one(c); return {inst:'틀린 낱말을 찾아 누르세요.',stim:'<div class="meter">'+p.x.ko+'</div>',row:1,ch:p.B.map((t,k)=>({h:en(t),ok:k===p.k})),ex:'바른 문장: '+p.x.full}; }

    return {inst:g.inst,stim:a[0].length>8?MTX(a[0]):MLN(a[0]),ch:g.cls.map((c,n)=>({h:'<span class="mth kch">🧺 '+c+'</span>',ok:n===k})),ex:'‘'+a[0]+'’ → '+g.cls[k]}; }

}
function sprint(u,kind){

  const left=()=>Math.max(0,T-Math.floor((Date.now()-t0)/1000));
  const draw=()=>{
    const q=sprintQ(u,kind); busy=false;
    show(gameHead(u,G[2],G[3])+'<div class="meter">남은 시간 <b id="tm">'+left()+'</b>초 · 맞힌 개수 '+right+'</div><div class="bar"><i id="tb" style="width:'+(left()/T*100)+'%"></i></div><p class="inst" style="margin-top:12px">'+q.inst+'</p><div class="stim">'+(q.stim||'')+'</div><div class="'+(q.row?'fixrow':'choices')+'" id="spc">'+q.ch.map((c,k)=>'<button class="choice" data-k="'+k+'">'+c.h+'</button>').join('')+'</div><p class="meter" id="msg">&nbsp;</p></section>',u.color);
    if(q.say) say(q.say);
    const bs=[...document.querySelectorAll('#spc .choice')];
    bs.forEach(b=>b.onclick=()=>{ if(busy||over) return; busy=true; const c=q.ch[+b.dataset.k]; n++;
      bs.forEach((x,k)=>{ x.disabled=true; if(q.ch[k].ok) x.classList.add('ok'); }); if(c.ok) right++; else b.classList.add('no');
      document.getElementById('msg').textContent=(c.ok?'맞았어요! ':'아쉬워요. ')+(c.ok?'':q.ex);
      setTimeout(()=>{ if(over) return; if(!document.getElementById('spc')) return; left()>0?draw():end(); },c.ok?450:1600); });
  };
  show(gameHead(u,G[2],G[3])+'<div class="budsay" style="--u:'+BUDS.cheer.col+'"><span class="budpic">'+BUD('cheer','happy')+'</span><p><b>'+BUDS.cheer.n+'</b>60초 동안 많이 맞혀 봐요. 틀려도 괜찮아요, 바로 다음 문제가 나와요!</p></div><div class="row center" style="margin-top:16px"><button class="btn main" id="spgo">시작</button></div></section>',u.color);
  document.getElementById('spgo').onclick=()=>{ t0=Date.now();

function wrapGroups(g){
  const us=GRADES[g].units, n=GRADES[g].wrap||4, gs=[];
  for(let i=0;i<us.length;i+=n){ const a=us.slice(i,i+n); if(a.length>=2||!gs.length) gs.push(a); else gs[gs.length-1]=gs[gs.length-1].concat(a); }
  return gs.map((a,k)=>({k,units:a,id:'wrap'+g+'-'+(k+1),label:a.length>1?UL(a[0])+' ~ '+UL(a[a.length-1]):UL(a[0])}));
}
function wrapQs(us,N){
  const per=Math.ceil(N/us.length); let qs=[];
  us.forEach(u=>{ let q=[]; try{ q=u.cq?buildQuiz(u,'s'):buildQuiz(u,0).concat(buildQuiz(u,1),buildQuiz(u,2)); }catch(e){} qs=qs.concat(shuffle(q).slice(0,per)); });
  return shuffle(qs).slice(0,N);
}

/* 기록 저장: 이 기기(localStorage)에 저장하고, claude.ai 에서 로그인해 열면 계정에도 저장해요 */
const SAVE_KEY='e3-save';
let STATE={stamps:{},best:{},days:{},resume:null,t:0}, VIEW='home';
try{ const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(o&&o.stamps) STATE=Object.assign(STATE,o);
  else{ const old=JSON.parse(localStorage.getItem('e3-stamps')||'null'); if(old) STATE.stamps=old; } }catch(e){}
STATE.stamps=STATE.stamps||{}; STATE.best=STATE.best||{}; STATE.days=STATE.days||{};
const prog=STATE.stamps;
let cloudRef=null, cloudBusy=false, cloudDirty=false, cloudState='checking';
function saveLocal(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(STATE))}catch(e){} }
function sig(){ return JSON.stringify([STATE.stamps,STATE.best,STATE.days,STATE.resume&&[STATE.resume.uid,STATE.resume.l,STATE.resume.i]]); }
function readRemote(snap){ try{ const d=snap&&snap.exists?snap.data():null; return d&&d.json?JSON.parse(d.json):null; }catch(e){ return null; } }
/* 계정 저장: 먼저 계정에 있는 기록을 읽어 합친 뒤에 써서, 다른 기기에서 모은 도장을 지우지 않아요 */
async function pushCloud(){
  if(!cloudRef) return; if(cloudBusy){cloudDirty=true; return;}
  cloudBusy=true;
  try{ const keep=STATE.resume, t=STATE.t; mergeState(readRemote(await cloudRef.get())); STATE.resume=keep; STATE.t=t; saveLocal();
    await cloudRef.set({json:JSON.stringify(STATE),t:STATE.t}); setCloud('on'); }catch(e){ setCloud('error'); }
  cloudBusy=false; if(cloudDirty){cloudDirty=false; pushCloud();}
}
function persist(){ STATE.t=Date.now(); saveLocal(); pushCloud(); }
function mergeState(o){
  if(!o) return;
  Object.keys(o.stamps||{}).forEach(k=>{ if((prog[k]||0)<o.stamps[k]) prog[k]=o.stamps[k]; });
  Object.keys(o.best||{}).forEach(k=>{ const a=STATE.best[k], b=o.best[k]; if(b&&(!a||b.r>a.r)) STATE.best[k]=b; });
  Object.keys(o.days||{}).forEach(k=>{ if((STATE.days[k]||0)<o.days[k]) STATE.days[k]=o.days[k]; });
  Object.keys(o.full||{}).forEach(k=>{ (STATE.full=STATE.full||{})[k]=1; });
  if((o.t||0)>(STATE.t||0)){ STATE.resume=o.resume||null; if(o.bp) STATE.bp=o.bp; STATE.t=o.t; }
}
function setCloud(st){ cloudState=st; const el=document.getElementById('sync'); if(el) el.innerHTML=syncText(); }
function syncText(){
  return {checking:'⏳ 저장 방법을 확인하고 있어요.',
    on:'☁️ 계정에 저장돼요. 같은 계정으로 로그인하면 다른 기기에서도 이어져요.',
    off:'📱 지금은 이 기기에만 저장돼요. 아래 “다른 기기로 기록 옮기기”를 써 보세요.',
    error:'⚠️ 계정에 저장하지 못했어요. 이 기기에는 저장돼 있어요.'}[cloudState];
