<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3학년 2학기 영어 도장판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F8FF; --dot:#D5E2F5; --card:#FFFFFF; --ink:#1B2750; --soft:#5A668C; --line:#C9D6EE;
  --ok:#1E9E62; --okbg:#E2F6EC; --no:#D9415F; --nobg:#FDE7EC; --sun:#FFC83A; --u:#3D7BF2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A33; --dot:#222C52; --card:#1C2547; --ink:#EEF2FF; --soft:#A9B4D9; --line:#34406E;
    --okbg:#143B2A; --nobg:#45182A; --ok:#4FD093; --no:#FF7C95;
  }
}
:root[data-theme="dark"]{
  --paper:#131A33; --dot:#222C52; --card:#1C2547; --ink:#EEF2FF; --soft:#A9B4D9; --line:#34406E;
  --okbg:#143B2A; --nobg:#45182A; --ok:#4FD093; --no:#FF7C95;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background:var(--paper);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px); background-size:22px 22px;
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:18px; line-height:1.6;
}
h1,h2,h3,.jua{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:400; line-height:1.25; margin:0}
.en{font-family:'Andika','Comic Sans MS','Trebuchet MS',sans-serif}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun); outline-offset:3px}
#app{max-width:920px; margin:0 auto; padding:20px 16px 64px}

/* 버튼 */
.btn{border:2px solid var(--ink); background:var(--card); border-radius:999px; padding:10px 22px; font-family:'Jua',sans-serif; font-size:1.05rem; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--u); color:#fff}
.btn.sun{background:var(--sun); color:#1B2750}
.btn[disabled]{opacity:.45; cursor:default}
.back{border:none; background:none; padding:6px 2px; color:var(--soft); font-size:1rem}
.back:hover{color:var(--ink)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.center{justify-content:center; text-align:center}

/* 첫 화면 */
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(2rem,6.5vw,3.4rem); letter-spacing:-.01em}
.hero p{max-width:34em; color:var(--soft); margin:10px 0 0}
.board{margin:22px 0 10px; background:var(--card); border:2px solid var(--ink); border-radius:22px; padding:16px 18px; box-shadow:0 6px 0 var(--ink)}
.board h2{font-size:1.2rem; margin-bottom:10px}
.boardgrid{display:grid; grid-template-columns:repeat(var(--n,8),1fr); gap:10px 6px}
.board h3{font-size:1rem; color:var(--soft); margin:12px 0 6px}
.semh{font-size:1.5rem; margin:30px 0 0}
.semh + .units{margin-top:12px}
.col{display:grid; gap:6px; justify-items:center}
.col small{font-size:.75rem; color:var(--soft); text-align:center; line-height:1.2}
.stamp{width:34px; height:34px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-size:.8rem; color:transparent}
.stamp.on{border:2px solid var(--u); background:var(--u); color:#fff; transform:rotate(-12deg); font-family:'Jua',sans-serif}
.units{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; margin-top:22px}
.unit{position:relative; text-align:left; background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:16px 16px 14px 26px; box-shadow:0 5px 0 var(--ink); overflow:hidden; transition:transform .1s}
.unit::before{content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--u)}
.unit:hover{transform:translateY(-2px)}
.unit .pic{font-size:2rem; line-height:1}
.num{display:inline-block; font-family:'Jua',sans-serif; font-size:1.1rem; background:var(--u); color:#fff; border-radius:999px; padding:3px 14px; line-height:1.4}
.unit h3{font-size:1.25rem; margin:6px 0 0}
.unit .ko{color:var(--soft); font-size:.95rem}
.unit .dots{display:flex; gap:5px; margin-top:10px}
.unit .dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--u)}
.unit .dots i.on{background:var(--u)}
details{margin-top:28px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px 16px}
summary{font-family:'Jua',sans-serif; cursor:pointer}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.92rem; margin-top:10px; min-width:520px}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top}
th{font-family:'Jua',sans-serif; font-weight:400}

/* 단원 화면 */
.uhead{border-left:12px solid var(--u); padding-left:16px; margin:8px 0 20px}
.uhead h1{font-size:clamp(1.7rem,5.5vw,2.6rem)}
.uhead p{margin:4px 0 0; color:var(--soft)}
.lessons{display:grid; gap:14px}
.lesson{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; text-align:left; background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:14px 16px; box-shadow:0 5px 0 var(--ink)}
.lesson .n{font-family:'Jua',sans-serif; background:var(--u); color:#fff; border-radius:12px; padding:6px 12px; white-space:nowrap}
.lesson b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem; display:block}
.lesson span{color:var(--soft); font-size:.95rem}

/* 수업 화면 */
.panel{background:var(--card); border:2px solid var(--ink); border-radius:22px; padding:22px 20px; box-shadow:0 6px 0 var(--ink)}
.panel h2{font-size:1.5rem; margin-bottom:6px}
.lead{color:var(--soft); margin:0 0 14px}
.words{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; margin:14px 0}
.word{background:var(--paper); border:2px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center}
.word .en{display:block; font-size:1.25rem; font-weight:700}
.word small{color:var(--soft)}
.pic{display:inline-grid; place-items:center; line-height:1}
.pic svg{width:1em; height:1em}
.sw{width:1em; height:1em; border-radius:50%; border:3px solid var(--ink); display:inline-block}
.talk{display:grid; gap:8px; margin:14px 0}
.bub{max-width:85%; border:2px solid var(--line); border-radius:18px; padding:10px 14px; background:var(--paper); text-align:left}
.bub.b{justify-self:end; border-color:var(--u)}
.bub .en{font-size:1.2rem; font-weight:700; display:block}
.bub small{color:var(--soft)}
.tip{border:2px dashed var(--u); border-radius:14px; padding:10px 14px; margin:14px 0}
.tip b{font-family:'Jua',sans-serif; font-weight:400}
.say{border:2px solid var(--ink); background:var(--sun); color:#1B2750; border-radius:999px; padding:4px 14px; font-size:.95rem; font-family:'Jua',sans-serif}

.bar{height:14px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--card); margin:6px 0 16px}
.bar i{display:block; height:100%; background:var(--u); transition:width .25s}
.inst{font-family:'Jua',sans-serif; font-size:1.2rem; margin:0 0 4px}
.sit{color:var(--soft); margin:0 0 8px}
.stim{text-align:center; margin:12px 0 16px}
.stim .pic{font-size:5rem}
.stim .line{font-size:1.5rem; font-weight:700; margin-top:6px}
.choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.choice{border:2px solid var(--ink); background:var(--card); border-radius:16px; padding:14px 10px; font-size:1.2rem; box-shadow:0 4px 0 var(--ink); min-height:64px}
.choice .pic{font-size:3rem}
.choice.ok{background:var(--okbg); border-color:var(--ok); box-shadow:0 4px 0 var(--ok)}
.choice.no{background:var(--nobg); border-color:var(--no); box-shadow:0 4px 0 var(--no)}
.choice[disabled]{cursor:default}
.fb{margin-top:16px; border-radius:16px; padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--nobg)}
.fb b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--no)}
.fb p{margin:2px 0 0}
.slots,.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:56px; margin:10px 0}
.slots{border-bottom:3px solid var(--ink); padding-bottom:10px}
.tile{border:2px solid var(--ink); background:var(--card); border-radius:12px; padding:8px 14px; font-size:1.3rem; font-weight:700; box-shadow:0 3px 0 var(--ink)}
.tile.used{visibility:hidden}
.gap{display:inline-block; min-width:1.1em; border-bottom:4px solid var(--u); color:var(--u); text-align:center; margin:0 2px}
.spell{font-size:2.2rem; font-weight:700; letter-spacing:.08em}
input.type{font-family:'Andika',sans-serif; font-size:1.6rem; text-align:center; width:min(100%,320px); padding:10px; border:2px solid var(--ink); border-radius:14px; background:var(--paper); color:var(--ink)}
.result{text-align:center}
.result .big{font-size:4rem; line-height:1.1}
.result h2{font-size:1.8rem}

/* 놀이 */
.games{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px}
.game{background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:16px; text-align:center; box-shadow:0 4px 0 var(--ink)}
.game .pic{font-size:2.6rem}
.game b{font-family:'Jua',sans-serif; font-weight:400; font-size:1.2rem; display:block}
.game span{font-size:.92rem; color:var(--soft)}
.mem{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:520px; margin:14px auto}
.mcard{aspect-ratio:1; border:2px solid var(--ink); border-radius:14px; background:var(--u); box-shadow:0 3px 0 var(--ink); display:grid; place-items:center; font-size:clamp(.85rem,3.2vw,1.15rem); font-weight:700; padding:2px; overflow:hidden}
.mcard .f{display:none}
.mcard.up{background:var(--card)} .mcard.up .f{display:grid; place-items:center}
.mcard.done{background:var(--okbg); border-color:var(--ok); box-shadow:0 3px 0 var(--ok)}
.mcard .pic{font-size:clamp(1.8rem,8vw,2.8rem)}
.ox{display:flex; gap:16px; justify-content:center}
.ox button{width:110px; height:110px; border-radius:24px; font-size:3.4rem; font-family:'Jua',sans-serif; border:2px solid var(--ink); box-shadow:0 5px 0 var(--ink); color:#fff}
.ox .o{background:#2F7BF0} .ox .x{background:#E4485F}
.meter{font-family:'Jua',sans-serif; color:var(--soft); text-align:center}
@media (max-width:560px){
  body{font-size:17px}
  .boardgrid{grid-template-columns:repeat(4,1fr)}
  .lesson{grid-template-columns:auto 1fr}
  .lesson .go{display:none}
  .stim .pic{font-size:4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- 그림 ---------- */
const SVG={
 eraser:'<svg viewBox="0 0 64 64"><g transform="rotate(-25 32 32)"><rect x="8" y="22" width="48" height="22" rx="5" fill="#F58FB0" stroke="#1B2750" stroke-width="3"/><rect x="8" y="22" width="20" height="22" rx="5" fill="#5AA9F7" stroke="#1B2750" stroke-width="3"/></g></svg>',
 glue:'<svg viewBox="0 0 64 64"><rect x="22" y="22" width="20" height="34" rx="3" fill="#FFD23F" stroke="#1B2750" stroke-width="3"/><rect x="20" y="12" width="24" height="12" rx="3" fill="#E4485F" stroke="#1B2750" stroke-width="3"/><rect x="26" y="5" width="12" height="8" rx="2" fill="#fff" stroke="#1B2750" stroke-width="3"/><text x="32" y="45" font-size="9" font-family="Arial" font-weight="700" text-anchor="middle" fill="#1B2750">GLUE</text></svg>',
 dooropen:'<svg viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" fill="#1B2750" stroke="#1B2750" stroke-width="3"/><polygon points="14,6 34,12 34,60 14,58" fill="#C98A4B" stroke="#1B2750" stroke-width="3" stroke-linejoin="round"/><circle cx="29" cy="36" r="2.5" fill="#FFC83A"/><path d="M4 60h56" stroke="#1B2750" stroke-width="3"/></svg>',
 doorclosed:'<svg viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" fill="#C98A4B" stroke="#1B2750" stroke-width="3"/><rect x="20" y="12" width="24" height="16" fill="none" stroke="#1B2750" stroke-width="2"/><rect x="20" y="34" width="24" height="18" fill="none" stroke="#1B2750" stroke-width="2"/><circle cx="44" cy="33" r="2.5" fill="#FFC83A" stroke="#1B2750"/><path d="M4 60h56" stroke="#1B2750" stroke-width="3"/></svg>',
 jump:'<svg viewBox="0 0 64 64" fill="none" stroke="#1B2750" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="12" r="6" fill="#FFC83A"/><path d="M32 18v16M32 22L20 10M32 22l12-12M32 34L22 44l-6-4M32 34l10 10 6-4"/><path d="M14 58h36" stroke="#2FA36B"/><path d="M24 52v-3M32 53v-4M40 52v-3" stroke="#5AA9F7" stroke-width="3"/></svg>'
};
function pic(w){
  if(w.sw) return '<span class="pic"><span class="sw" style="background:'+w.sw+'"></span></span>';
  if(w.svg) return '<span class="pic">'+SVG[w.svg]+'</span>';
  if(w.txt) return '<span class="pic en" style="font-weight:700">'+w.txt+'</span>';
  return '<span class="pic"'+(w.sm?' style="font-size:.5em"':'')+'>'+(w.p||'')+'</span>';
}
const P=p=>({p}), PS=p=>({p,sm:1}), sp=w=>w.say||w.en;

/* ---------- 단원 자료 ---------- */
const BOOKS=['김태은','이동환','함순애'];
const UNITS=[
{id:'have', color:'#3D7BF2', icon:'✏️', title:'Do You Have a Pencil?', ko:'학용품, 가지고 있는지 묻고 답하기',
 books:['8단원','7단원','6단원(1학기)'],
 words:[{en:'pencil',ko:'연필',p:'✏️',a:'a pencil'},{en:'ruler',ko:'자',p:'📏',a:'a ruler'},{en:'eraser',ko:'지우개',svg:'eraser',a:'an eraser'},{en:'notebook',ko:'공책',p:'📓',a:'a notebook'},{en:'glue stick',ko:'풀',svg:'glue',a:'a glue stick'},{en:'crayons',ko:'크레용',p:'🖍️',a:'crayons'},{en:'scissors',ko:'가위',p:'✂️',a:'scissors'}],
 note:'crayons(크레용)와 scissors(가위)는 여러 개이거나 짝으로 된 물건이라 끝에 s가 붙어요.',
 expr:[['Do you have a pencil?','너 연필 있니?','Yes, I do. / No, I don’t.','응, 있어. / 아니, 없어.'],['I have a ruler.','나는 자가 있어.','I don’t have a ruler.','나는 자가 없어.'],['Here you are.','여기 있어.','Thank you.','고마워.']],
 tip2:'가지고 있으면 Yes, I do. 없으면 No, I don’t. 라고 답해요.',
 mc:[
  ['Do you have a pencil?',P('✏️'),'Yes, I do.','No, I don’t.','Yes, I can.','가지고 있으면 Yes, I do.','나는 연필을 가지고 있어요.'],
  ['Do you have an eraser?',P('🚫'),'No, I don’t.','Yes, I do.','No, I can’t.','없으면 No, I don’t.','나는 지우개가 없어요.'],
  ['',P('📏'),'Do you have a ruler?','Can you run?','What color is it?','가지고 있는지 물을 때는 Do you have ~?','친구에게 자가 있는지 물어보려고 해요. 뭐라고 말할까요?'],
  ['Here you are.',P('🤝'),'Thank you.','No, I don’t.','Yes, I can.','물건을 받으면 Thank you.','친구가 풀을 건네주었어요.'],
  ['',P('📓'),'I have a notebook.','I don’t have a notebook.','Do you have a notebook?','I have ~ 는 “나는 ~가 있어요”.','“나는 공책이 있어요.”를 영어로 고르세요.'],
  ['',P('✂️'),'I don’t have scissors.','I have scissors.','Do you have scissors?','I don’t have ~ 는 “나는 ~가 없어요”.','“나는 가위가 없어요.”를 영어로 고르세요.'],
  ['Do you have ___ eraser?',{svg:'eraser'},'an','a','is','eraser처럼 소리가 “이”로 시작하면 an을 써요.','빈칸에 알맞은 말을 고르세요.']],
 order:['Do you have a pencil?','I have a glue stick.','I don’t have a ruler.','Yes, I do.'],
 tip3:'an eraser 처럼 a 대신 an 을 쓰는 낱말이 있어요. don’t 는 do not 을 줄인 말이에요.'},

{id:'color', color:'#E0457B', icon:'🎨', title:'What Color Is It?', ko:'색깔 묻고 답하기',

 words:[{en:'red',ko:'빨간색',sw:'#E53935'},{en:'orange',ko:'주황색',sw:'#FB8C00'},{en:'yellow',ko:'노란색',sw:'#FDD835'},{en:'green',ko:'초록색',sw:'#43A047'},{en:'blue',ko:'파란색',sw:'#1E88E5'},{en:'pink',ko:'분홍색',sw:'#F48FB1'},{en:'black',ko:'검은색',sw:'#111111'},{en:'white',ko:'흰색',sw:'#FFFFFF'}],

 tip2:'색깔을 말할 때는 It’s 뒤에 색깔 낱말을 붙여요.',
 mc:[
  ['What color is it?',{sw:'#1E88E5'},'It’s blue.','It’s green.','It’s pink.','blue는 파란색.',''],
  ['What color is it?',P('🍌'),'It’s yellow.','It’s red.','It’s blue.','바나나는 yellow.',''],
  ['',P('🎨'),'What color is it?','How’s the weather?','Who is he?','색깔을 물을 때는 What color is it?','색깔을 물어보려면 뭐라고 말할까요?'],
  ['What color is it?',P('🍅'),'It’s red.','It’s black.','It’s white.','토마토는 red.',''],
  ['What color is it?',P('⛄'),'It’s white.','It’s black.','It’s orange.','눈사람은 white.',''],
  ['What color is it?',P('🐸'),'It’s green.','It’s pink.','It’s yellow.','개구리는 green.',''],
  ['Look! It’s pink.',{sw:'#F48FB1'},'봐! 분홍색이야.','봐! 파란색이야.','봐! 정말 커.','pink는 분홍색.','무슨 뜻일까요?'],
  ['',P('🎁'),'Thank you.','You’re welcome.','What color is it?','고마울 때는 Thank you.','친구가 파란색 크레용을 빌려주었어요.'],
  ['Thank you.',P('😊'),'You’re welcome.','I’m sorry.','It’s red.','고맙다는 말에는 You’re welcome.','친구가 고맙다고 말했어요. 뭐라고 답할까요?']],
 order:['What color is it?','It’s yellow.','Look! It’s pink.'],
 tip3:'It’s 는 It is 를 줄인 말이에요. 물어보는 문장 끝에는 물음표(?)를 써요.'},

{id:'can', color:'#2FA36B', icon:'🏊', title:'Can You Swim?', ko:'할 수 있는 것 묻고 답하기',

/* 1학기 단원(UNITS1)은 쓰지 않아요. 다시 넣으려면: UNITS.unshift(...UNITS1); */
const SEM={1:0,2:0};
UNITS.forEach(u=>{u.sem=u.sem||2; u.num=++SEM[u.sem];});
const LN=(u,l)=>(u.names&&u.names[l])||LESSONS[l];
const POOL=u=>(u.gameWords||u.words).filter(w=>!w.nopic);

/* ---------- 도우미 ---------- */
const $app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const canSpeak='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
function say(t){
  if(!canSpeak) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/’/g,"'").replace(/_+/g,' ')); u.lang='en-US'; u.rate=.8; speechSynthesis.speak(u);}catch(e){}
}
const sayBtn=t=>canSpeak?'<button class="say" data-say="'+esc(t).replace(/"/g,'&quot;')+'">소리 듣기</button>':'';
let prog={};
try{prog=JSON.parse(localStorage.getItem('e3-stamps')||'{}')||{}}catch(e){prog={}}
function saveStamp(u,l,stars){
  const k=u.id+'-'+l; if((prog[k]||0)<stars) prog[k]=stars;
  try{localStorage.setItem('e3-stamps',JSON.stringify(prog))}catch(e){}
}
function show(html,color){
  $app.style.setProperty('--u',color||'#3D7BF2'); $app.innerHTML=html; window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]'); if(s){say(s.dataset.say); if(!s.dataset.go) return;}
  const g=e.target.closest('[data-go]'); if(g){ const [v,a,b]=g.dataset.go.split(':'); route(v,a,b); }
});
function route(v,a,b){
  if(canSpeak) try{speechSynthesis.cancel()}catch(e){}
  if(v==='home') home();
  else if(v==='unit') unitView(UNITS[+a]);
  else if(v==='lesson') lessonIntro(UNITS[+a],+b);
  else if(v==='quiz') startQuiz(UNITS[+a],+b);
  else if(v==='game') startGame(UNITS[+a],b);
}

/* ---------- 첫 화면 ---------- */
function home(){
  const total=UNITS.reduce((n,u)=>n+[0,1,2,3].filter(l=>prog[u.id+'-'+l]).length,0), sems=[[1,'1학기'],[2,'2학기']].filter(x=>UNITS.some(u=>u.sem===x[0])), multi=sems.length>1;
  let h='<header class="hero"><h1>3학년 '+(multi?'':'2학기')+'<br>영어 도장판</h1><p>단원을 고르고 차시를 하나씩 끝내면 도장이 찍혀요. 도장 '+UNITS.length*4+'개를 모두 모아 보세요.</p></header>';
  h+='<section class="board"><h2>내 도장 '+total+'개</h2>';
  sems.forEach(([n,name])=>{
    const us=UNITS.filter(u=>u.sem===n);
    h+=(multi?'<h3>'+name+'</h3>':'')+'<div class="boardgrid" style="--n:'+us.length+'">';
    us.forEach(u=>{
      h+='<div class="col" style="--u:'+u.color+'">';
      for(let l=0;l<4;l++){const s=prog[u.id+'-'+l]; h+='<span class="stamp'+(s?' on':'')+'">'+(s?'★'.repeat(s):'')+'</span>';}
      h+='<small>'+u.num+'단원</small></div>';
    });
    h+='</div>';
  });
  h+='</section>';
  sems.forEach(([n,name])=>{
    h+=(multi?'<h2 class="semh">'+name+'</h2>':'')+'<section class="units">';
    UNITS.forEach((u,i)=>{
      if(u.sem!==n) return;
      h+='<button class="unit" style="--u:'+u.color+'" data-go="unit:'+i+'"><span class="row"><span class="num">'+u.num+'단원</span><span class="pic">'+u.icon+'</span></span><h3 class="en">'+u.title+'</h3><div class="ko">'+u.ko+'</div><div class="dots">';
      for(let l=0;l<4;l++) h+='<i class="'+(prog[u.id+'-'+l]?'on':'')+'"></i>';
      h+='</div></button>';
    });
    h+='</section>';
  });
  h+='<details><summary>선생님, 부모님께: 교과서 단원 연결표</summary><div class="tablewrap"><table><tr><th>활동 단원</th>'+BOOKS.map(b=>'<th>'+b+'</th>').join('')+'</tr>';
  UNITS.forEach(u=>{h+='<tr><td class="en">'+u.num+'. '+u.title+'</td>'+u.books.map(b=>'<td>'+b+'</td>').join('')+'</tr>';});
  h+='</table></div><p>세 교과서에서 주제가 겹치는 단원을 하나로 묶었어요. 표 안의 숫자는 각 교과서의 단원 번호이고, (1학기)는 그 교과서에서 1학기에 배우는 단원이에요. 도장 기록은 이 기기에만 저장돼요.</p></details>';
  show(h);
}

/* ---------- 단원 화면 ---------- */
function unitView(u){
  const i=UNITS.indexOf(u);
  let h='<button class="back" data-go="home">← 도장판으로</button><div class="uhead"><span class="num">'+u.num+'단원</span><h1 class="en" style="margin-top:8px">'+u.title+'</h1><p>'+u.ko+'</p></div><div class="lessons">';
  LESSONS.forEach((L0,l)=>{
    const s=prog[u.id+'-'+l], L=LN(u,l);
    h+='<button class="lesson" data-go="lesson:'+i+':'+l+'"><span class="n">'+(l+1)+'차시</span><span><b>'+L[0]+'</b><span>'+L[1]+'</span></span><span class="go stamp'+(s?' on':'')+'">'+(s?'★'.repeat(s):'')+'</span></button>';
  });
  show(h+'</div>',u.color);
}

/* ---------- 차시 소개 ---------- */
function lessonIntro(u,l){
  const i=UNITS.indexOf(u);
  let h='<button class="back" data-go="unit:'+i+'">← '+esc(u.title)+'</button><section class="panel"><h2>'+(l+1)+'차시 '+LN(u,l)[0]+'</h2>';
  if(l===0){
    h+='<p class="lead">먼저 알아봐요. 듣기 버튼을 누르면 소리가 나요.</p><div class="words">';
    const list=u.abc?LET.map(w=>({en:w.txt+w.en,ko:w.ko,say:w.say,nopic:1})):u.words;
    list.forEach(w=>{h+='<div class="word">'+(w.nopic?'':'<span style="font-size:2.6rem">'+pic(w)+'</span>')+'<span class="en">'+w.en+'</span><small>'+w.ko+'</small>'+(canSpeak?'<div style="margin-top:8px"><button class="say" data-say="'+sp(w)+'" aria-label="'+w.en+' 소리 듣기">🔊 듣기</button></div>':'')+'</div>';});
    h+='</div><div class="tip"><b>알아 두기</b> '+u.note+'</div>';
  }else if(l===1){
    h+='<p class="lead">먼저 알아봐요. 두 친구가 이렇게 말해요.</p><div class="talk">';
    u.expr.forEach(x=>{
      h+='<div class="bub"><span class="en">'+x[0]+'</span><small>'+x[1]+'</small> '+sayBtn(x[0])+'</div><div class="bub b"><span class="en">'+x[2]+'</span><small>'+x[3]+'</small> '+sayBtn(x[2].replace(' / ','. '))+'</div>';
    });
    h+='</div><div class="tip"><b>기억해요</b> '+u.tip2+'</div>';
  }else if(l===2){
    h+='<p class="lead">먼저 알아봐요. 문장을 쓸 때는 세 가지 약속이 있어요.</p><div class="tip"><b>쓰기 약속</b> 첫 글자는 대문자로 써요. 낱말과 낱말 사이는 띄어요. 끝에는 마침표(.)나 물음표(?)를 찍어요.</div><div class="talk">';
    u.order.forEach(s=>{h+='<div class="bub"><span class="en">'+s+'</span> '+sayBtn(s)+'</div>';});
    h+='</div><div class="tip"><b>이 단원 쓰기 비밀</b> '+u.tip3+'</div>';
  }else{
    h+='<p class="lead">하고 싶은 놀이를 골라요. 하나만 끝내도 도장이 찍혀요.</p><div class="games">'
     +'<button class="game" data-go="game:'+i+':mem"><span class="pic">🃏</span><b>짝 맞추기</b><span>그림 카드와 낱말 카드를 짝지어요</span></button>'
     +'<button class="game" data-go="game:'+i+':mix"><span class="pic">🔤</span><b>글자 섞기</b><span>뒤섞인 글자를 바르게 놓아요</span></button>'
     +'<button class="game" data-go="game:'+i+':ox"><span class="pic">⏱️</span><b>빨리 OX</b><span>그림과 낱말이 맞는지 빠르게 골라요</span></button></div>';
  }
  if(l<3) h+='<div class="row center" style="margin-top:18px"><button class="btn main" data-go="quiz:'+i+':'+l+'">퀴즈 풀기</button></div>';
  show(h+'</section>',u.color);
}

/* ---------- 문제 만들기 ---------- */
function others(u,w,n,picOnly){return pick(u.words.filter(x=>x!==w&&(!picOnly||!x.nopic)),n)}
function buildQuiz(u,l){
  const pw=u.words.filter(w=>!w.nopic), qs=[];
  const big=t=>'<span class="en" style="font-size:2rem;font-weight:700">'+t+'</span>', oth=(w,n)=>pick(LET.filter(x=>x!==w),n);
  if(u.abc&&l===0){
    const ws=pick(LET,10);
    ws.forEach((w,k)=>{
      const ex=w.txt+' '+w.en+' : '+w.ko;
      if(k<5||(k>=8&&!canSpeak)) qs.push({t:'c',inst:'대문자와 짝이 되는 소문자를 고르세요.',stim:pic(w),say:w.say,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.en),ok:x===w})),ex});
      else if(k<8) qs.push({t:'c',inst:'소문자와 짝이 되는 대문자를 고르세요.',stim:'<div class="line en" style="font-size:4.5rem;line-height:1.1">'+w.en+'</div>',say:w.say,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.txt),ok:x===w})),ex});
      else qs.push({t:'c',inst:'버튼을 눌러 소리를 듣고 알맞은 글자를 고르세요.',listen:w.say,peek:w.ko,ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(x.txt+x.en),ok:x===w})),ex});
    });
  }else if(u.abc&&l===2){
    pick([...Array(23).keys()],3).forEach((st,k)=>{
      const hole=1+Math.floor(Math.random()*3), w=LET[st+hole], f=k===1?(x=>x.en):(x=>x.txt);
      const row=[0,1,2,3].map(j=>j===hole?'<span class="gap">&nbsp;</span>':f(LET[st+j])).join(' ');
      qs.push({t:'c',inst:'알파벳 순서에 맞게 빈칸에 들어갈 글자를 고르세요.',stim:'<div class="spell en">'+row+'</div>',ch:shuffle([w,...oth(w,3)]).map(x=>({h:big(f(x)),ok:x===w})),ex:[0,1,2,3].map(j=>f(LET[st+j])).join(' ')});
    });
    pick(LET,2).forEach(w=>qs.push({t:'w',exact:1,inst:'대문자를 소문자로 써 보세요.',w:{en:w.en,txt:w.txt,ko:'이 글자의 소문자는?',say:w.say},ex:w.txt+' → '+w.en}));
    pick(u.words,4).forEach(w=>{
      const ans=w.en[0], pool=shuffle('abcdeghklmnopqrstw'.split('').filter(c=>c!==ans)).slice(0,3);
      qs.push({t:'b',inst:'낱말의 첫 글자를 고르세요.',w,idx:0,tiles:shuffle([ans,...pool]),ex:w.en+' : '+w.ko});
    });
    u.order.forEach(s=>qs.push({t:'o',inst:'낱말을 순서대로 눌러 문장을 만드세요.',s,ex:s}));
  }else if(l===0){
    pick(pw,4).forEach(w=>qs.push({t:'c',inst:'그림에 알맞은 낱말을 고르세요.',stim:pic(w),ch:shuffle([w,...others(u,w,3,false)]).map(x=>({h:'<span class="en">'+x.en+'</span>',ok:x===w})),ex:w.en+' : '+w.ko,say:w.en}));
    pick(pw,3).forEach(w=>qs.push({t:'c',inst:canSpeak?'버튼을 눌러 소리를 듣고 알맞은 그림을 고르세요.':'낱말에 알맞은 그림을 고르세요.',listen:w.en,ch:shuffle([w,...others(u,w,2,true)]).map(x=>({h:pic(x),ok:x===w})),ex:w.en+' : '+w.ko}));
    pick(u.words,3).forEach(w=>qs.push({t:'c',inst:'낱말의 뜻을 고르세요.',stim:'<div class="line en">'+w.en+'</div>',say:w.en,ch:shuffle([w,...others(u,w,2,false)]).map(x=>({h:x.ko,ok:x===w})),ex:w.en+' : '+w.ko}));
  }else if(l===1){
    shuffle(u.mc).forEach(m=>{
      const en=/[a-zA-Z]/.test(m[2]);
      qs.push({t:'c',inst:m[6]||'알맞은 대답을 고르세요.',stim:pic(m[1])+(m[0]?'<div class="line en">'+m[0]+'</div>':''),say:m[0]&&m[0].indexOf('_')<0?m[0]:'',
        ch:shuffle([0,1,2]).map(k=>({h:'<span class="'+(en?'en':'')+'">'+m[2+k]+'</span>',ok:k===0})),ex:m[5],sayAns:en&&m[0].indexOf('_')<0?m[2]:''});
    });
  }else{
    pick(u.words,4).forEach(w=>{
      const idx=shuffle([...w.en].map((c,k)=>c===' '?-1:k).filter(k=>k>=0))[0], ans=w.en[idx];
      const pool=shuffle('abcdeghiklmnoprstuwy'.split('').filter(c=>c!==ans)).slice(0,3);
      qs.push({t:'b',inst:'빠진 글자를 골라 낱말을 완성하세요.',w,idx,tiles:shuffle([ans,...pool]),ex:w.en+' : '+w.ko});
    });
    pick(u.words,3).forEach(w=>qs.push({t:'w',inst:'낱말을 영어로 써 보세요.',w,ex:w.en+' : '+w.ko}));
    u.order.forEach(s=>qs.push({t:'o',inst:'낱말을 순서대로 눌러 문장을 만드세요.',s,ex:s}));
  }
  return qs;
}

/* ---------- 퀴즈 진행 ---------- */
let Q=null;
function startQuiz(u,l){ Q={u,l,qs:buildQuiz(u,l),i:0,right:0}; drawQ(); }
function drawQ(){
  const {u,l,qs,i}=Q, q=qs[i], ui=UNITS.indexOf(u);
  let h='<button class="back" data-go="lesson:'+ui+':'+l+'">← 소개로 돌아가기</button><div class="meter">'+(i+1)+' / '+qs.length+'</div><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div><section class="panel"><p class="inst">'+q.inst+'</p>';
  if(q.t==='c'){
    h+='<div class="stim">';
    if(q.listen) h+=canSpeak?'<button class="btn sun" data-say="'+q.listen+'">🔊 소리 듣기</button> <button class="back" id="peek">소리가 안 들리면 글자로 보기</button><div class="line en" id="peekw" hidden>'+(q.peek||q.listen)+'</div>':'<div class="line en">'+q.listen+'</div>';
    else h+=(q.stim||'')+(q.say?'<div style="margin-top:8px">'+sayBtn(q.say)+'</div>':'');
    h+='</div><div class="choices">'+q.ch.map((c,k)=>'<button class="choice" data-k="'+k+'">'+c.h+'</button>').join('')+'</div>';
  }else if(q.t==='b'){
    const sp=[...q.w.en].map((c,k)=>k===q.idx?'<span class="gap" id="gap">&nbsp;</span>':(c===' '?'&nbsp;&nbsp;':c)).join('');
    h+='<div class="stim">'+(q.w.nopic?'':pic(q.w))+'<div>'+q.w.ko+'</div><div class="spell en">'+sp+'</div></div><div class="bank">'+q.tiles.map(t=>'<button class="tile en" data-t="'+t+'">'+t+'</button>').join('')+'</div>';
  }else if(q.t==='w'){
    h+='<div class="stim">'+(q.w.nopic?'':pic(q.w))+'<div>'+q.w.ko+'</div><div style="margin-top:6px">'+sayBtn(sp(q.w))+'</div></div><div class="row center"><input class="type" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="영어 낱말 쓰기" placeholder="여기에 써요"><button class="btn main" id="chk">확인하기</button></div>';
  }else{
    let toks=q.s.split(' '), sh=shuffle(toks); if(sh.join(' ')===q.s) sh=sh.reverse();
    q.toks=sh; q.put=[];
    h+='<div class="stim">'+sayBtn(q.s)+'</div><div class="slots en" id="slots"></div><div class="bank" id="bank">'+sh.map((t,k)=>'<button class="tile en" data-k="'+k+'">'+t+'</button>').join('')+'</div><div class="row center"><button class="btn main" id="chk" disabled>확인하기</button></div>';
  }
  h+='<div id="fb"></div></section>';
  show(h,u.color);
  bindQ(q);
}
function bindQ(q){
  const done=(ok,extra)=>{
    if(ok) Q.right++;
    const last=Q.i===Q.qs.length-1, st=q.t==='o'?q.s:(q.w?sp(q.w):(q.sayAns||q.listen||''));
    document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'" role="status"><div><b>'+(ok?'정답이에요!':'아쉬워요, 다시 봐요.')+'</b><p>'+(extra||'')+'<span class="en">'+esc(q.ex)+'</span> '+(st?sayBtn(st):'')+'</p></div><button class="btn main" id="next">'+(last?'결과 보기':'다음 문제')+'</button></div>';
    const n=document.getElementById('next'); n.onclick=()=>{Q.i++; Q.i<Q.qs.length?drawQ():finish()}; n.focus();
  };
  if(q.t==='c'){
    const pk=document.getElementById('peek'); if(pk) pk.onclick=()=>{document.getElementById('peekw').hidden=false};
    const bs=[...$app.querySelectorAll('.choice')];
    bs.forEach(b=>b.onclick=()=>{
      const c=q.ch[+b.dataset.k]; bs.forEach((x,k)=>{x.disabled=true; if(q.ch[k].ok) x.classList.add('ok')});
      if(!c.ok) b.classList.add('no');
      done(c.ok);
    });
  }else if(q.t==='b'){
    const bs=[...$app.querySelectorAll('.tile')];
    bs.forEach(b=>b.onclick=()=>{
      const ok=b.dataset.t===q.w.en[q.idx]; bs.forEach(x=>x.disabled=true);
      document.getElementById('gap').textContent=q.w.en[q.idx]; done(ok);
    });
  }else if(q.t==='w'){
    const inp=document.getElementById('inp'), go=()=>{
      const raw=inp.value.trim(), v=raw.toLowerCase().replace(/\s+/g,' '); if(!v) {inp.focus();return;}
      inp.disabled=true; document.getElementById('chk').disabled=true;
      const ok=q.exact?raw===q.w.en:v===q.w.en.toLowerCase(); done(ok, ok?'':'바른 답: ');
    };
    document.getElementById('chk').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go()}; inp.focus();
  }else{
    const slots=document.getElementById('slots'), bank=document.getElementById('bank'), chk=document.getElementById('chk');
    const redraw=()=>{
      slots.innerHTML=q.put.map((k,p)=>'<button class="tile en" data-p="'+p+'">'+q.toks[k]+'</button>').join('');
      [...bank.children].forEach(b=>b.classList.toggle('used',q.put.includes(+b.dataset.k)));
      chk.disabled=q.put.length!==q.toks.length;
    };
    let locked=false;
    bank.onclick=e=>{const b=e.target.closest('.tile'); if(!b||locked) return; q.put.push(+b.dataset.k); redraw()};
    slots.onclick=e=>{const b=e.target.closest('.tile'); if(!b||locked) return; q.put.splice(+b.dataset.p,1); redraw()};
    chk.onclick=()=>{locked=true; chk.disabled=true; const ok=q.put.map(k=>q.toks[k]).join(' ')===q.s; done(ok, ok?'':'바른 문장: ')};
  }
}
function finish(){
  const {u,l,qs,right}=Q, r=right/qs.length, stars=r>=.9?3:r>=.6?2:1;
  resultScreen(u,l,stars,right+' / '+qs.length+' 문제를 맞혔어요.','quiz:'+UNITS.indexOf(u)+':'+l);
}
function resultScreen(u,l,stars,msg,again){
  saveStamp(u,l,stars);
  const ui=UNITS.indexOf(u), next=l<3?'lesson:'+ui+':'+(l+1):(ui<UNITS.length-1?'unit:'+(ui+1):'home');
  const nextLabel=l<3?(l+2)+'차시로 가기':(ui<UNITS.length-1?'다음 단원 보기':'도장판 보기');
  show('<section class="panel result"><div class="big">'+'⭐'.repeat(stars)+'</div><h2>'+['','끝까지 해냈어요!','잘했어요!','최고예요!'][stars]+'</h2><p>'+msg+'<br>'+(l+1)+'차시 도장이 찍혔어요.</p><div class="row center"><button class="btn" data-go="'+again+'">다시 하기</button><button class="btn main" data-go="'+next+'">'+nextLabel+'</button><button class="btn" data-go="unit:'+ui+'">차시 목록</button></div></section>',u.color);
}

/* ---------- 놀이 ---------- */
function gameHead(u,title,sub){
  return '<button class="back" data-go="lesson:'+UNITS.indexOf(u)+':3">← 놀이 고르기</button><section class="panel"><h2>'+title+'</h2><p class="lead">'+sub+'</p>';
}
function startGame(u,kind){ ({mem:gameMem,mix:gameMix,ox:gameOx})[kind](u); }

function gameMem(u){
  const ws=pick(POOL(u),6), ui=UNITS.indexOf(u);
  const cards=shuffle(ws.flatMap(w=>[{w,h:pic(w)},{w,h:'<span class="en"'+(u.abc?' style="font-size:2rem"':'')+'>'+w.en+'</span>'}]));
  let open=[], found=0, tries=0, lock=true;
  show(gameHead(u,'짝 맞추기','시작을 누르면 카드를 3초 동안 보여 줘요. 자리를 잘 기억했다가 '+(u.abc?'대문자와 소문자를':'그림과 낱말을')+' 짝지어요.')+'<div class="row center"><button class="btn main" id="memgo">시작</button></div><div class="meter" id="mt">시작을 누르면 카드가 보여요</div><div class="mem">'+cards.map((c,k)=>'<button class="mcard" data-k="'+k+'" aria-label="카드"><span class="f">'+c.h+'</span></button>').join('')+'</div></section>',u.color);
  const mt=document.getElementById('mt'), goBtn=document.getElementById('memgo'), all=[...$app.querySelectorAll('.mcard')];
  goBtn.onclick=()=>{
    goBtn.disabled=true; all.forEach(c=>c.classList.add('up'));
    let left=3; mt.textContent='잘 기억해요! '+left;
    const tm=setInterval(()=>{
      if(!document.body.contains(mt)){clearInterval(tm);return;}
      left--;
      if(left>0) mt.textContent='잘 기억해요! '+left;
      else{clearInterval(tm); all.forEach(c=>c.classList.remove('up')); goBtn.parentNode.hidden=true; mt.textContent='뒤집은 횟수 0번'; lock=false;}
    },1000);
  };
  $app.querySelector('.mem').onclick=e=>{
    const b=e.target.closest('.mcard'); if(!b||lock||b.classList.contains('up')) return;
    b.classList.add('up'); open.push(b);
    if(open.length<2) return;
    tries++; mt.textContent='뒤집은 횟수 '+tries+'번';
    const [a,c]=open, wa=cards[+a.dataset.k].w, wc=cards[+c.dataset.k].w; open=[];
    if(wa===wc){ a.classList.add('done'); c.classList.add('done'); found++;
      if(found===ws.length) setTimeout(()=>resultScreen(u,3,tries<=9?3:tries<=14?2:1,tries+'번 만에 짝을 모두 찾았어요.','game:'+ui+':mem'),700);
    }else{ lock=true; setTimeout(()=>{a.classList.remove('up'); c.classList.remove('up'); lock=false},900); }
  };
}

function gameMix(u){
  const ws=pick(u.words.filter(w=>w.en.length>2),5), ui=UNITS.indexOf(u); let i=0, miss=0;
  const draw=()=>{
    const w=ws[i], letters=[...w.en.replace(/ /g,'')]; let sh=shuffle(letters); if(sh.join('')===letters.join('')) sh=sh.reverse();
    let put=[];
    show(gameHead(u,'글자 섞기','글자를 순서대로 눌러 낱말을 만들어요.')+'<div class="meter">'+(i+1)+' / '+ws.length+'</div><div class="stim">'+(w.nopic?'':pic(w))+'<div>'+w.ko+'</div></div><div class="slots en" id="slots"></div><div class="bank" id="bank">'+sh.map((t,k)=>'<button class="tile en" data-k="'+k+'">'+t+'</button>').join('')+'</div><p class="meter" id="msg">놓은 글자를 누르면 다시 내려가요.</p></section>',u.color);
    const slots=document.getElementById('slots'), bank=document.getElementById('bank'), msg=document.getElementById('msg');
    const redraw=()=>{
      slots.innerHTML=put.map((k,p)=>'<button class="tile en" data-p="'+p+'">'+sh[k]+'</button>').join('');
      [...bank.children].forEach(b=>b.classList.toggle('used',put.includes(+b.dataset.k)));
      if(put.length===sh.length){
        if(put.map(k=>sh[k]).join('')===letters.join('')){ msg.textContent='맞았어요! '+w.en; bank.onclick=slots.onclick=null;
          setTimeout(()=>{i++; i<ws.length?draw():resultScreen(u,3,miss===0?3:miss<=2?2:1,'낱말 '+ws.length+'개를 모두 완성했어요.','game:'+ui+':mix')},1000);
        }else{ miss++; msg.textContent='순서가 달라요. 글자를 눌러 다시 놓아 보세요.'; }
      }
    };
    bank.onclick=e=>{const b=e.target.closest('.tile'); if(b){put.push(+b.dataset.k); redraw()}};
    slots.onclick=e=>{const b=e.target.closest('.tile'); if(b){put.splice(+b.dataset.p,1); redraw()}};
  };
  draw();
}

function gameOx(u){
  const pw=POOL(u), ui=UNITS.indexOf(u), N=10; let i=0, right=0, t0=Date.now();
  const draw=()=>{
    const w=pick(pw,1)[0], match=Math.random()<.5, shown=match?w:pick(pw.filter(x=>x!==w),1)[0];
    show(gameHead(u,'빨리 OX',(u.abc?'대문자와 소문자가 짝이면 O, 아니면 X를 눌러요.':'그림과 낱말이 같으면 O, 다르면 X를 눌러요.'))+'<div class="meter">'+(i+1)+' / '+N+' , 맞힌 개수 '+right+'</div><div class="stim">'+pic(w)+'<div class="line en">'+shown.en+'</div></div><div class="ox"><button class="o" data-a="1" aria-label="맞아요">O</button><button class="x" data-a="0" aria-label="달라요">X</button></div><p class="meter" id="msg">&nbsp;</p></section>',u.color);
    $app.querySelector('.ox').onclick=e=>{
      const b=e.target.closest('button'); if(!b) return; $app.querySelector('.ox').onclick=null;
      const ok=(b.dataset.a==='1')===match; if(ok) right++;
      document.getElementById('msg').textContent=(ok?'맞았어요! ':'아쉬워요. ')+(u.abc?w.txt+' 의 짝은 '+w.en:'그림은 '+w.en+' ('+w.ko+')');
      setTimeout(()=>{i++; if(i<N) draw(); else{const sec=Math.round((Date.now()-t0)/1000); resultScreen(u,3,right>=9?3:right>=6?2:1,N+'문제 중 '+right+'개를 '+sec+'초 만에 맞혔어요.','game:'+ui+':ox')}},ok?650:1500);
    };
  };
  draw();
}

home();
</script>
